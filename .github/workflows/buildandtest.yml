name: CI

on:
  push:
    branches: [ master, main, master378, develop/*, release/* ]
  pull_request:
    branches: [ master, main, master378, develop/*, release/* ]
    # No paths filter: the required summary must report even for documentation.
  workflow_dispatch:
    inputs:
      include_macos:
        description: 'Include macOS runners in the test / AoT matrix'
        type: boolean
        default: true

permissions:
  contents: read

# GitHub owns the complete PR workload. Scheduled full validation uses the same
# expander and runner in nightly.yml; no setting delegates PR scope to Azure.
env:
  # nbgv cloud exports these once per job. Parallel per-project appends tear
  # GITHUB_ENV; disabling that writer does not change computed versions.
  NBGV_SetCloudBuildVersionVars: 'false'
  ENABLE_CODECOV: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover test projects
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.matrix.outputs.tests }}
      builds: ${{ steps.matrix.outputs.builds }}
      batch_size: ${{ steps.matrix.outputs.batch_size }}
      assurance_projects: ${{ steps.matrix.outputs.assurance_projects }}
      assurance_selected: ${{ steps.list.outputs.assurance_selected }}
      aot_matrix: ${{ steps.list.outputs.aot_matrix }}
      relevant_changes: ${{ steps.list.outputs.relevant_changes }}
      include_macos: ${{ steps.list.outputs.include_macos }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Validate migration plugin
      shell: pwsh
      run: ./.azurepipelines/validate-migration-plugin.ps1
    - name: Resolve path relevance
      id: list
      shell: pwsh
      env:
        EVENT_NAME: ${{ github.event_name }}
        INCLUDE_MACOS: ${{ github.event.inputs.include_macos }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        TARGET_REF: ${{ github.base_ref || github.ref_name }}
      run: |
        $includeMac = switch ($env:EVENT_NAME) {
            'workflow_dispatch' { $env:INCLUDE_MACOS -eq 'true' }
            default { $true }
        }
        $relevantChanges = $true
        if ($env:EVENT_NAME -eq 'pull_request' -and -not [string]::IsNullOrWhiteSpace($env:BASE_SHA)) {
            $changed = @(& git diff --name-only "$($env:BASE_SHA)...HEAD")
            if ($LASTEXITCODE -ne 0) {
                throw 'Could not diff the pull-request base. Refusing to skip required CI work.'
            }
            $relevantChanges = [bool](& ./.github/scripts/get-path-relevance.ps1 -ChangedFile $changed)
            Write-Host "Changed files: $(@($changed).Count); build-relevant: $relevantChanges"
        }

        $releaseLine = $env:TARGET_REF -eq 'master' -or $env:TARGET_REF -like 'release/2.*'
        $assuranceSelected = $relevantChanges -and $releaseLine -and $env:EVENT_NAME -ne 'pull_request'
        $aotMatrix = @()
        if ($relevantChanges) {
            $aotMatrix += @{ os = 'ubuntu-latest'; rid = 'linux-x64' }
            if ($releaseLine) {
                $aotMatrix += @{ os = 'windows-2025'; rid = 'win-x64' }
            }
            if ($includeMac) {
                $aotMatrix += @{ os = 'macos-15-intel'; rid = 'osx-x64' }
                $aotMatrix += @{ os = 'macos-latest'; rid = 'osx-arm64' }
            }
        }
        "relevant_changes=$($relevantChanges.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append
        "include_macos=$($includeMac.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append
        "assurance_selected=$($assuranceSelected.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append
        "aot_matrix=$(ConvertTo-Json -InputObject @($aotMatrix) -Compress)" | Out-File $env:GITHUB_OUTPUT -Append

    - name: Expand the pull-request test and build matrix
      id: matrix
      shell: pwsh
      env:
        RELEVANT_CHANGES: ${{ steps.list.outputs.relevant_changes }}
        INCLUDE_MACOS: ${{ steps.list.outputs.include_macos }}
      run: |
        if ($env:RELEVANT_CHANGES -ne 'true') {
            'tests=[]', 'builds=[]', 'assurance_projects=[]', 'batch_size=0' |
                Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
        }
        ./.github/scripts/get-ci-matrix.ps1 -Scope pr -ExcludeMacOS:($env:INCLUDE_MACOS -ne 'true')

  build-and-test:
    name: test-${{ matrix.entry.name }}
    needs: discover
    if: ${{ needs.discover.outputs.tests != '[]' }}
    runs-on: ${{ matrix.entry.runsOn }}
    timeout-minutes: ${{ matrix.entry.timeoutMinutes }}
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.discover.outputs.tests) }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: ./.github/actions/run-dotnet-tests
      with:
        projects: ${{ matrix.entry.projects }}
        custom-test-target: ${{ matrix.entry.customTestTarget }}
        framework: ${{ matrix.entry.framework }}
        configuration: ${{ matrix.entry.configuration }}
        dotnet: ${{ matrix.entry.dotnet }}
        filter: ${{ matrix.entry.filter }}
        hang-timeout: ${{ matrix.entry.hangTimeout }}
        per-project-timeout: ${{ matrix.entry.perProjectTimeout }}
        coverage: ${{ matrix.entry.coverage }}
        artifact-name: dotnet-results-${{ matrix.entry.id }}
        assurance-workflow: .github/workflows/buildandtest.yml
        assurance-artifact-name: assurance-batch-${{ matrix.entry.id }}-${{ github.run_id }}-${{ github.run_attempt }}-build-and-test

  assurance-windows:
    name: assurance-${{ matrix.project.id }}
    needs: discover
    if: ${{ needs.discover.outputs.assurance_selected == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover.outputs.assurance_projects) }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: ./.github/actions/run-dotnet-tests
      with:
        projects: ${{ matrix.project.project }}
        custom-test-target: net10.0
        framework: net10.0
        configuration: Release
        dotnet: '10.0.401'
        filter: ''
        hang-timeout: 10m
        per-project-timeout: '45'
        coverage: 'false'
        artifact-name: assurance-test-results-${{ matrix.project.id }}-${{ github.run_id }}-${{ github.run_attempt }}
        assurance-workflow: .github/workflows/buildandtest.yml
        assurance-artifact-name: assurance-${{ matrix.project.id }}-${{ github.run_id }}-${{ github.run_attempt }}-assurance-windows
        require-assurance: 'true'

  assurance-summary:
    name: release assurance
    needs: [discover, build-and-test, assurance-windows, aot-test]
    if: ${{ always() && needs.discover.result == 'success' && needs.discover.outputs.relevant_changes == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        pattern: assurance-*
        path: assurance-records
    - name: Collect profile scope without inventing external results
      shell: pwsh
      run: |
        # Local summary, not authenticated cross-workflow release retrieval.
        $sha = (& git rev-parse HEAD).Trim()
        if ($LASTEXITCODE -ne 0) { throw 'Cannot identify checked-out source.' }
        ./.azurepipelines/assurance/collect.ps1 -RecordsPath assurance-records `
          -OutputPath assurance-component/assurance.json -ExpectedSourceSha $sha `
          -ExpectedRunId "$env:GITHUB_RUN_ID" -ExpectedAttempt "$env:GITHUB_RUN_ATTEMPT" `
          -ExpectedWorkflow '.github/workflows/buildandtest.yml' -ExpectedDefinitionSha "$env:GITHUB_WORKFLOW_SHA"
    - uses: actions/upload-artifact@v7
      with:
        name: assurance-component-${{ github.run_id }}-${{ github.run_attempt }}-assurance-summary
        path: assurance-component/*.json
        if-no-files-found: error

  # Advisory: coverage does not replace any selected build, test or proof job.
  code-coverage:
    name: code coverage
    needs: [discover, build-and-test]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.discover.outputs.tests != '[]' && needs.discover.outputs.relevant_changes == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.401'
    - name: Download test results
      uses: actions/download-artifact@v8
      with:
        pattern: dotnet-results-*
        path: coverage-artifacts
    - name: Detect coverage
      id: probe
      shell: pwsh
      env:
        TEST_MATRIX: ${{ needs.discover.outputs.tests }}
      run: |
        . ./.github/scripts/get-test-verdict.ps1
        $coverage = Assert-CiCoverage -Matrix $env:TEST_MATRIX -ArtifactsDirectory coverage-artifacts
        Write-Host "Found $($coverage.Reports) verified per-project Cobertura report(s)."
        "has_reports=$($coverage.HasReports.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append
    - name: Merge coverage report
      if: ${{ steps.probe.outputs.has_reports == 'true' }}
      shell: pwsh
      run: |
        dotnet tool install --tool-path tools dotnet-reportgenerator-globaltool
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ./tools/reportgenerator `
            '-reports:coverage-artifacts/**/*.cobertura.xml' `
            '-targetdir:CodeCoverage' '-reporttypes:Cobertura;HtmlSummary' `
            '-title:UA .Net Standard Test Coverage' '-assemblyfilters:-*.Tests'
        exit $LASTEXITCODE
    - name: Upload merged coverage report
      if: ${{ steps.probe.outputs.has_reports == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: CodeCoverage
    - name: Upload to codecov.io
      if: ${{ steps.probe.outputs.has_reports == 'true' && env.ENABLE_CODECOV == 'true' && env.HAS_CODECOV_TOKEN == 'true' }}
      continue-on-error: true
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: CodeCoverage/Cobertura.xml
        flags: actions
        disable_search: true
        fail_ci_if_error: false
    - name: Evaluate coverage
      id: gate
      if: ${{ steps.probe.outputs.has_reports == 'true' }}
      shell: pwsh
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        ./.azurepipelines/coverage/check.ps1 `
            -CoberturaPath CodeCoverage/Cobertura.xml -ThresholdsPath coverage-thresholds.json `
            -RepoRoot '${{ github.workspace }}' -BaseRef $env:BASE_REF -SummaryPath coverage-summary.md
        "outcome=$LASTEXITCODE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        if (Test-Path coverage-summary.md) {
            Get-Content coverage-summary.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
        }
        exit 0
    - name: Comment coverage on the pull request
      if: ${{ steps.probe.outputs.has_reports == 'true' && github.event_name == 'pull_request' }}
      continue-on-error: true
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- ua-coverage-report -->';
          if (!fs.existsSync('coverage-summary.md')) {
            core.info('No coverage summary to post.');
            return;
          }
          const body = marker + '\n' + fs.readFileSync('coverage-summary.md', 'utf8');
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner, repo, issue_number, per_page: 100,
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }
    - name: Report coverage gate result
      if: ${{ steps.probe.outputs.has_reports == 'true' }}
      shell: pwsh
      run: |
        if ('${{ steps.gate.outputs.outcome }}' -ne '0') {
            Write-Host '::error title=Code coverage::Coverage thresholds were not met. This check remains advisory.'
            exit 1
        }
        Write-Host 'Coverage gate passed.'

  aot-test:
    needs: discover
    name: aot-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: ${{ needs.discover.outputs.aot_matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.aot_matrix) }}
    env:
      AOTPROJECT: './tests/Opc.Ua.Aot.Tests/Opc.Ua.Aot.Tests.csproj'
      AOTPROJECT_HISTORIAN: './tests/Opc.Ua.Aot.Tests.Historian/Opc.Ua.Aot.Tests.Historian.csproj'
      AOTPROJECT_MCP: './tests/Opc.Ua.Aot.Tests.Mcp/Opc.Ua.Aot.Tests.Mcp.csproj'
      DOTNET_VERSION: '10.0.401'
      CONFIGURATION: 'Release'
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    - name: Set Cloud Version
      shell: pwsh
      run: ./.azurepipelines/set-version.ps1
    - name: Publish and independently observe NativeAOT execution
      shell: pwsh
      run: |
        ./.azurepipelines/assurance/native.ps1 -Project '${{ env.AOTPROJECT }}' `
          -RuntimeIdentifier '${{ matrix.rid }}' -Configuration '${{ env.CONFIGURATION }}' `
          -WorkDirectory '.assurance/native-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.rid }}' `
          -OutputPath '.assurance/native-proof.json'
        exit $LASTEXITCODE
    - name: Record source-bound native execution proof
      if: ${{ always() }}
      shell: pwsh
      run: |
        ./.azurepipelines/assurance/write-job.ps1 -Project 'tests/Opc.Ua.Aot.Tests/Opc.Ua.Aot.Tests.csproj' `
          -ResultsPath '.assurance/native-proof.json' -Kind native-aot -OutputPath ./assurance/evidence.job.json `
          -Workflow '.github/workflows/buildandtest.yml'
    - name: Publish and independently observe NativeAOT execution (Historian)
      shell: pwsh
      run: |
        ./.azurepipelines/assurance/native.ps1 -Project '${{ env.AOTPROJECT_HISTORIAN }}' `
          -RuntimeIdentifier '${{ matrix.rid }}' -Configuration '${{ env.CONFIGURATION }}' `
          -WorkDirectory '.assurance/native-historian-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.rid }}' `
          -OutputPath '.assurance/native-historian-proof.json'
        exit $LASTEXITCODE
    - name: Publish and independently observe NativeAOT execution (MCP)
      shell: pwsh
      run: |
        ./.azurepipelines/assurance/native.ps1 -Project '${{ env.AOTPROJECT_MCP }}' `
          -RuntimeIdentifier '${{ matrix.rid }}' -Configuration '${{ env.CONFIGURATION }}' `
          -WorkDirectory '.assurance/native-mcp-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.rid }}' `
          -OutputPath '.assurance/native-mcp-proof.json'
        exit $LASTEXITCODE
    - name: Upload sanitized native proof
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: assurance-native-aot-${{ github.run_id }}-${{ github.run_attempt }}-aot-test-${{ matrix.os }}
        path: assurance/*.json
        if-no-files-found: error

  build-solutions:
    name: build-${{ matrix.entry.name }}
    needs: discover
    if: ${{ needs.discover.outputs.builds != '[]' }}
    runs-on: ${{ matrix.entry.runsOn }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.discover.outputs.builds) }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ matrix.entry.dotnet }}
    - name: Set cloud version
      shell: pwsh
      run: ./.azurepipelines/set-version.ps1
    - name: Build ${{ matrix.entry.solution }} (${{ matrix.entry.customTestTarget }})
      shell: pwsh
      env:
        CI_SOLUTION: ${{ matrix.entry.solution }}
        CI_CUSTOM_TEST_TARGET: ${{ matrix.entry.customTestTarget }}
        CI_CONFIGURATION: ${{ matrix.entry.configuration }}
      run: |
        dotnet build $env:CI_SOLUTION --configuration $env:CI_CONFIGURATION `
          "/p:CustomTestTarget=$($env:CI_CUSTOM_TEST_TARGET)"
        exit $LASTEXITCODE

  fuzz-drop:
    name: fuzz-public-drop
    needs: discover
    if: ${{ needs.discover.outputs.relevant_changes == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.401
    - name: Validate manifest and negative controls
      shell: pwsh
      run: ./fuzzing/Scripts/validate-fuzz-manifest.ps1 -SelfTest
    - name: Exercise published-library contracts
      shell: pwsh
      run: |
        $env:CustomTestTarget = 'net10.0'
        $results = Join-Path $env:RUNNER_TEMP 'onefuzz-contract-results'
        dotnet test ./fuzzing/OneFuzz/Opc.Ua.OneFuzz.Validator.Tests/Opc.Ua.OneFuzz.Validator.Tests.csproj `
          -c Release -f net10.0 -m:1 --results-directory $results --logger 'trx;LogFileName=contracts.trx'
        if ($LASTEXITCODE -ne 0) { throw "Published-library contract tests failed: $LASTEXITCODE" }
        ./.azurepipelines/assurance/results.ps1 -ResultsPath $results -Kind trx -StrictTrx `
          -RequireNoSkipped -Enforce -OutputPath (Join-Path $env:RUNNER_TEMP 'contracts-proof.json')
        exit $LASTEXITCODE
    - name: Publish and replay uninstrumented callbacks
      shell: pwsh
      run: ./fuzzing/Scripts/build-onefuzz.ps1 -OutputDirectory '${{ runner.temp }}/onefuzz-drop'
    - name: Upload validated public drop
      uses: actions/upload-artifact@v7
      with:
        name: fuzz-public-drop
        path: ${{ runner.temp }}/onefuzz-drop
        if-no-files-found: error

  fuzz-replay:
    name: fuzz-replay-${{ matrix.os }}-${{ matrix.framework }}
    needs: discover
    if: ${{ needs.discover.outputs.relevant_changes == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          framework: net10.0
        - os: ubuntu-latest
          framework: net8.0
        - os: ubuntu-latest
          framework: net9.0
        - os: windows-latest
          framework: net48
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.401
    - name: Run fuzz regressions with private diagnostics
      shell: pwsh
      env:
        CI_FRAMEWORK: ${{ matrix.framework }}
      run: |
        $raw = Join-Path $env:RUNNER_TEMP 'fuzz-results'
        $public = Join-Path $env:GITHUB_WORKSPACE 'FuzzResults'
        $log = Join-Path $env:RUNNER_TEMP 'fuzz-replay.log'
        $failed = $false
        try {
            & ./fuzzing/Scripts/test-fuzzing.ps1 -Framework $env:CI_FRAMEWORK -ResultsDirectory $raw *> $log
            if ($LASTEXITCODE -ne 0) { $failed = $true }
        }
        catch {
            $_ | Out-String | Out-File -LiteralPath $log -Append
            $failed = $true
        }
        $projects = @('Opc.Ua.Fuzzing.Tests', 'Opc.Ua.Encoders.Fuzz.Tests', 'Opc.Ua.Certificates.Fuzz.Tests')
        if ($env:CI_FRAMEWORK -ne 'net48') {
            $projects += 'Opc.Ua.Network.Fuzz.Tests', 'Opc.Ua.PubSub.Fuzz.Tests'
        }
        foreach ($project in $projects) {
            $directory = Join-Path $raw $project
            $destination = Join-Path $public $project
            ./.azurepipelines/assurance/results.ps1 -ResultsPath $directory -Kind trx -StrictTrx `
              -RequireNoSkipped -Enforce -OutputPath (Join-Path $destination 'public-results.json')
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            $index = 0
            if (Test-Path -LiteralPath $directory) {
                foreach ($file in Get-ChildItem -LiteralPath $directory -File -Recurse -Filter '*.cobertura.xml') {
                    $index++
                    Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $destination "coverage-$index.cobertura.xml")
                }
            }
        }
        if ($failed) { throw 'Fuzz regression execution failed; raw diagnostics remain private on the runner.' }
    - name: Upload sanitized fuzz replay evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: fuzz-replay-${{ matrix.os }}-${{ matrix.framework }}
        path: FuzzResults
        if-no-files-found: error

  build-and-test-summary:
    name: build-and-test summary
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [discover, build-and-test, assurance-windows, assurance-summary, aot-test, build-solutions, fuzz-replay, fuzz-drop]
    steps:
    - uses: actions/checkout@v7
    - name: Evaluate job results
      shell: pwsh
      env:
        RELEVANT_CHANGES: ${{ needs.discover.outputs.relevant_changes }}
        TEST_MATRIX: ${{ needs.discover.outputs.tests }}
        BUILD_MATRIX: ${{ needs.discover.outputs.builds }}
        AOT_MATRIX: ${{ needs.discover.outputs.aot_matrix }}
        ASSURANCE_SELECTED: ${{ needs.discover.outputs.assurance_selected }}
        DISCOVER_RESULT: ${{ needs.discover.result }}
        TEST_RESULT: ${{ needs.build-and-test.result }}
        AOT_RESULT: ${{ needs.aot-test.result }}
        BUILD_RESULT: ${{ needs.build-solutions.result }}
        FUZZ_RESULT: ${{ needs.fuzz-replay.result }}
        FUZZ_DROP_RESULT: ${{ needs.fuzz-drop.result }}
        ASSURANCE_RESULT: ${{ needs.assurance-windows.result }}
        ASSURANCE_SUMMARY_RESULT: ${{ needs.assurance-summary.result }}
      run: |
        . ./.github/scripts/get-test-verdict.ps1
        $results = [ordered]@{
          'discover' = $env:DISCOVER_RESULT
          'build-and-test' = $env:TEST_RESULT
          'aot-test' = $env:AOT_RESULT
          'build-solutions' = $env:BUILD_RESULT
          'fuzz-replay' = $env:FUZZ_RESULT
          'fuzz-public-drop' = $env:FUZZ_DROP_RESULT
          'assurance-windows' = $env:ASSURANCE_RESULT
          'assurance-summary' = $env:ASSURANCE_SUMMARY_RESULT
        }
        $expected = [ordered]@{
          'discover' = $true
          'build-and-test' = (Test-CiMatrixSelected $env:TEST_MATRIX)
          'aot-test' = (Test-CiMatrixSelected $env:AOT_MATRIX)
          'build-solutions' = (Test-CiMatrixSelected $env:BUILD_MATRIX)
          'fuzz-replay' = $env:RELEVANT_CHANGES -eq 'true'
          'fuzz-public-drop' = $env:RELEVANT_CHANGES -eq 'true'
          'assurance-windows' = $env:ASSURANCE_SELECTED -eq 'true'
          'assurance-summary' = $env:RELEVANT_CHANGES -eq 'true'
        }
        $verdict = Get-CiJobVerdict -Results $results -Expected $expected
        if (-not $verdict.Passed) {
            Write-Host "::error::Build and test jobs did not succeed: $($verdict.Failures -join ', ')"
            exit 1
        }
        Write-Host 'Selected jobs succeeded. Unselected scope is not release assurance; coverage remains advisory.'

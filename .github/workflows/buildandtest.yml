name: Build and Test .NET 10.0

on:
  push:
    branches: [ master, main, master378, develop/*, release/* ]
  pull_request:
    branches: [ master, main, master378, develop/*, release/* ]
    # Filter jobs below, not the workflow: the required summary must report
    # even when a pull request changes no build-relevant files.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover test projects
    runs-on: ubuntu-latest
    outputs:
      csprojs: ${{ steps.list.outputs.csprojs }}
      relevant_changes: ${{ steps.relevance.outputs.relevant_changes }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Resolve path relevance
      id: relevance
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        relevant=true
        if [[ "$EVENT_NAME" == pull_request ]]; then
          : "${BASE_SHA:?Missing pull-request base commit}"
          # A failed diff must fail discovery, never silently skip the tests.
          git diff --name-only --no-renames -z "${BASE_SHA}...HEAD" > "$RUNNER_TEMP/build-changed-files"
          relevant=false
          while IFS= read -r -d '' file; do
            case "$file" in
              *.cs|*.csproj|*.props|*.targets|*.sln|*.slnx|global.json|NuGet.config|.github/workflows/buildandtest.yml)
                relevant=true
                break
                ;;
            esac
          done < "$RUNNER_TEMP/build-changed-files"
        fi
        echo "relevant_changes=$relevant" >> "$GITHUB_OUTPUT"

    - name: Enumerate Tests/Opc.Ua.*.Tests projects
      id: list
      if: ${{ steps.relevance.outputs.relevant_changes == 'true' }}
      shell: pwsh
      run: |
        # Discover test projects from the filesystem so this matrix does not
        # have to be hand-maintained as projects are added or renamed.
        $projects = Get-ChildItem -Path Tests -Directory -Filter 'Opc.Ua.*.Tests' |
            Where-Object { Test-Path (Join-Path $_.FullName "$($_.Name).csproj") } |
            ForEach-Object { $_.Name -replace '^Opc\.Ua\.', '' -replace '\.Tests$', '' } |
            Sort-Object
        $json = ConvertTo-Json -InputObject @($projects) -Compress
        Write-Host "Discovered $(@($projects).Count) project(s): $json"
        "csprojs=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  build-and-test:
    needs: discover
    if: ${{ needs.discover.outputs.relevant_changes == 'true' }}
    name: test-${{matrix.os}}-${{matrix.csproj}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # os: [ubuntu-latest, windows-latest, macOS-latest] - disable mac os due to cost
        os: [ubuntu-latest, windows-latest]
        csproj: ${{ fromJSON(needs.discover.outputs.csprojs) }}
        include:
          - framework: 'net10.0'
            dotnet-version: '10.0.x'
            configuration: 'Release'
            customtesttarget: net10.0

    env:
      OS: ${{ matrix.os }}
      DOTNET_VERSION: ${{ matrix.dotnet-version }}
      CONFIGURATION:  ${{ matrix.configuration }}
      CSPROJ: ${{ matrix.csproj }}
      CSPROJECT: "./Tests/Opc.Ua.${{ matrix.csproj }}.Tests/Opc.Ua.${{ matrix.csproj }}.Tests.csproj"
      TESTRESULTS: "TestResults-${{matrix.csproj}}-${{matrix.os}}-${{matrix.framework}}-${{matrix.configuration}}"

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup .NET ${{ matrix.dotnet-version }}
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Set Cloud Version
      shell: pwsh
      run: ./.azurepipelines/set-version.ps1

    - name: Build
      run: dotnet build ${{ env.CSPROJECT }} --force --framework ${{ matrix.framework }} --configuration ${{ matrix.configuration }} /p:CustomTestTarget=${{ matrix.customtesttarget }}

    - name: Test
      # note: /p:CollectCoverage=true is only used to disable deterministic builds
      run: dotnet test ${{ env.CSPROJECT }} --no-build --framework ${{ matrix.framework }} --logger trx --configuration ${{ matrix.configuration }} /p:CollectCoverage=true /p:CustomTestTarget=${{ matrix.customtesttarget }} --collect:"XPlat Code Coverage" --settings ./Tests/coverlet.runsettings.xml --results-directory ${{ env.TESTRESULTS }} 

    - name: Upload test results
      uses: actions/upload-artifact@v6
      with:
        name: dotnet-results-${{matrix.csproj}}-${{matrix.os}}-${{matrix.framework}}-${{matrix.configuration}}
        path: ${{ env.TESTRESULTS }}
      # Use always() to always run this step to publish test results when there are test failures
      if: ${{ always() }}

    - name: Upload to Codecov
      uses: codecov/codecov-action@v5
      with:
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: ${{ env.TESTRESULTS }}
        env_vars: CSPROJ,OS,DOTNET_VERSION,CONFIGURATION
        fail_ci_if_error: false
        #path_to_write_report: "./coverage/codecov_report-${{matrix.os}}-${{matrix.framework}}-${{matrix.configuration}}/"
        verbose: true
      # Use always() to always run this step to publish test results when there are test failures
      if: ${{ always() }}

  build-and-test-summary:
    name: build-and-test summary
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [discover, build-and-test]
    steps:
    - name: Evaluate job results
      shell: bash
      env:
        DISCOVER_RESULT: ${{ needs.discover.result }}
        RELEVANT_CHANGES: ${{ needs.discover.outputs.relevant_changes }}
        TEST_RESULT: ${{ needs.build-and-test.result }}
      run: |
        set -euo pipefail
        echo "Discovery: $DISCOVER_RESULT; build-relevant: $RELEVANT_CHANGES; tests: $TEST_RESULT"
        if [[ "$DISCOVER_RESULT" != success ]]; then
          echo '::error::Test discovery did not succeed.'
          exit 1
        fi
        # Only accept a skipped matrix when discovery intentionally excluded it.
        case "$RELEVANT_CHANGES:$TEST_RESULT" in
          true:success|false:skipped)
            echo 'Build and test jobs succeeded or were intentionally skipped.'
            ;;
          *)
            echo '::error::Required build and test jobs did not succeed.'
            exit 1
            ;;
        esac

name: Sessions certificate leak diagnostic

# Temporary, branch-scoped diagnostic. This is not a replacement for the PR gate.
on:
  push:
    branches:
    - marcschier-extract-machinery-changes
    paths:
    - .github/workflows/sessions-certificate-leak-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: sessions-certificate-leak-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sessions-certificate-leak:
    name: Sessions certificate allocation trace (macOS net10)
    runs-on: macos-latest
    timeout-minutes: 65
    env:
      NBGV_SetCloudBuildVersionVars: 'false'
      OPCUA_CERTIFICATE_LEAK_TRACKING: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: 920d08f7dd05338793b0537e02b4840776db7b4b

    - name: Record pinned diagnostic context
      shell: pwsh
      run: |
        $head = (& git rev-parse HEAD).Trim()
        if ($LASTEXITCODE -ne 0 -or $head -ne '920d08f7dd05338793b0537e02b4840776db7b4b') {
          throw 'The diagnostic must use the published failing source.'
        }
        if ($env:OPCUA_CERTIFICATE_LEAK_TRACKING -ne '1') {
          throw 'Certificate allocation tracking must be enabled before testhost startup.'
        }
        $null = New-Item -ItemType Directory -Path 'TestResults' -Force
        [ordered]@{
          workflowHead = $env:GITHUB_SHA
          checkedOutHead = $head
          certificateAllocationTracking = $env:OPCUA_CERTIFICATE_LEAK_TRACKING
          platform = [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
          architecture = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
          sourceRun = 38862967667
          sourceJob = 116853783643
          scope = 'Single-project diagnostic; not a full PR qualification'
        } | ConvertTo-Json | Set-Content 'TestResults/diagnostic-context.json'

    - name: Run tracked Sessions diagnostic
      uses: ./.github/actions/run-dotnet-tests
      with:
        projects: tests/Opc.Ua.Sessions.Tests/Opc.Ua.Sessions.Tests.csproj
        custom-test-target: net10.0
        framework: net10.0
        configuration: Release
        dotnet: 10.0.401
        filter: TestCategory!=LongRunning&TestCategory!=Stress
        hang-timeout: 10m
        per-project-timeout: '45'
        coverage: 'true'
        artifact-name: certificate-leak-sessions-macos

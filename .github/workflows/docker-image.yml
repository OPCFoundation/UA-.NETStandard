name: Docker Reference Server CI

on:
  push:
    branches: [ master, release/*, docker* ]
  pull_request:
    branches: [ master, main, master378, develop/*, release/* ]
    # Keep the same PR targets as buildandtest.yml. Filter jobs below so the
    # required summary also reports for documentation- and test-only changes.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: refserver
  DOCKERSIGN: false

jobs:
  discover:
    name: Discover image changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      relevant_changes: ${{ steps.relevance.outputs.relevant_changes }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Resolve path relevance
      id: relevance
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        BEFORE_SHA: ${{ github.event.before }}
      run: |
        set -euo pipefail
        relevant=true
        range=''
        if [[ "$EVENT_NAME" == pull_request ]]; then
          : "${BASE_SHA:?Missing pull-request base commit}"
          range="${BASE_SHA}...HEAD"
        elif [[ "$EVENT_NAME" == push && "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ && ! "$BEFORE_SHA" =~ ^0+$ ]] &&
          git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
          range="${BEFORE_SHA}..HEAD"
        fi
        # Build on new branches or when a force-push predecessor is unavailable.
        if [[ -n "$range" ]]; then
          git diff --name-only --no-renames -z "$range" > "$RUNNER_TEMP/image-changed-files"
          relevant=false
          while IFS= read -r -d '' file; do
            case "$file" in
              Docs/*|Tests/*) ;;
              *)
                relevant=true
                break
                ;;
            esac
          done < "$RUNNER_TEMP/image-changed-files"
        fi
        echo "relevant_changes=$relevant" >> "$GITHUB_OUTPUT"

  build-and-push-image:
    needs: discover
    if: ${{ needs.discover.outputs.relevant_changes == 'true' }}
    runs-on: ubuntu-latest
    env:
      IS_NOT_PR: ${{ !github.head_ref && true }}
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up .NET 8
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.x'

    - name: Set Version
      shell: pwsh
      run: ./.azurepipelines/set-version.ps1

    # Install the cosign tool except on PR
    # https://github.com/sigstore/cosign-installer
    - name: Install cosign
      if: github.event_name != 'pull_request' && env.DOCKERSIGN == 'true'
      uses: sigstore/cosign-installer@main
      with:
        cosign-release: 'v1.13.1'

    # https://github.com/docker/build-push-action
    - name: Setup Docker buildx
      uses: docker/setup-buildx-action@v3

    # Login against a Docker registry except on PR
    # https://github.com/docker/login-action
    - name: Log into registry ${{ env.REGISTRY }}
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Prepare Tag Repo Info
      run: |
        echo IMAGE_REPOSITORY=${{ env.REGISTRY }}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]' | awk '{gsub(/-|\./, "")}1')/${{ env.IMAGE_NAME }} >> $GITHUB_ENV
        echo IMAGE_VERSION=$(echo ${{ env.NBGV_Version }}${{ env.NBGV_PrereleaseVersion }}) >> $GITHUB_ENV

    - name: Prepare Tag Branch info
      if: env.NBGV_PublicRelease == 'False'
      run: |
        echo IMAGE_TAG=-$(echo ${{ github.ref }} | tr '[:upper:]' '[:lower:]' |  awk '{sub(/([^\/]*\/){2}/,""); gsub(/\/|_/, "-")}1') >> $GITHUB_ENV

    - name: Prepare version and latest tag
      run: |
        echo TAG_BRANCH=$(echo ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_VERSION }}${{ env.IMAGE_TAG }}) >> $GITHUB_ENV
        echo TAG_LATEST=$(echo ${{ env.IMAGE_REPOSITORY }}:latest${{ env.IMAGE_TAG }}) >> $GITHUB_ENV

    - name: Prepare Release tags
      if: ${{ env.NBGV_PublicRelease == 'True' && env.NBGV_PrereleaseVersion == '' && env.IS_NOT_PR == 'true' }}
      run: |
        echo TAG_RELEASE=,${{ env.IMAGE_REPOSITORY }}:${{ env.NBGV_MajorMinorVersion }},${{ env.IMAGE_REPOSITORY }}:${{ env.NBGV_SimpleVersion }},${{ env.IMAGE_REPOSITORY }}:release >> $GITHUB_ENV

    # Extract metadata (tags, labels) for Docker
    # https://github.com/docker/metadata-action
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_REPOSITORY }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    # Build and push Docker image with Buildx (don't push on PR)
    # https://github.com/docker/build-push-action
    - name: Build and push Docker image
      id: build-and-push
      uses: docker/build-push-action@v6
      with:
        context: .
        build-args: |
          Version=${{ env.NBGV_Version }}
          SimpleVersion=${{ env.NBGV_SimpleVersion }}
          InformationalVersion=${{ env.NBGV_AssemblyInformationalVersion }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ env.TAG_BRANCH }},${{ env.TAG_LATEST }}${{ env.TAG_RELEASE }}
        platforms: linux/amd64,linux/arm64/v8 
        file: ./Applications/ConsoleReferenceServer/Dockerfile
        labels: ${{ steps.meta.outputs.labels }}
        provenance: false
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Sign the resulting Docker image digest except on PRs.
    # https://github.com/sigstore/cosign
    - name: Sign the published Docker image
      if: github.event_name != 'pull_request' && env.DOCKERSIGN == 'true'
      env:
        COSIGN_EXPERIMENTAL: "true"
      # This step uses the identity token to provision an ephemeral certificate
      # against the sigstore community Fulcio instance.
      run: |
        echo Signing ${{ env.IMAGE_REPOSITORY }}@${{ steps.build-and-push.outputs.digest }}
        echo "${{ env.IMAGE_REPOSITORY }}" | xargs -I {} cosign sign {}@${{ steps.build-and-push.outputs.digest }}

  images-summary:
    name: images summary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ always() }}
    needs: [discover, build-and-push-image]
    steps:
    - name: Evaluate job results
      shell: bash
      env:
        DISCOVER_RESULT: ${{ needs.discover.result }}
        RELEVANT_CHANGES: ${{ needs.discover.outputs.relevant_changes }}
        IMAGES_RESULT: ${{ needs.build-and-push-image.result }}
      run: |
        set -euo pipefail
        echo "Discovery: $DISCOVER_RESULT; image-relevant: $RELEVANT_CHANGES; images: $IMAGES_RESULT"
        if [[ "$DISCOVER_RESULT" != success ]]; then
          echo '::error::Image change discovery did not succeed.'
          exit 1
        fi
        # Only accept a skipped build when discovery intentionally excluded it.
        case "$RELEVANT_CHANGES:$IMAGES_RESULT" in
          true:success|false:skipped)
            echo 'Image build succeeded or was intentionally skipped.'
            ;;
          *)
            echo '::error::Required image build did not succeed.'
            exit 1
            ;;
        esac

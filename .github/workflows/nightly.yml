name: Nightly full validation

# GitHub-hosted equivalent of the full-scope workload Azure Pipelines used to
# run on a schedule.
on:
  schedule:
    # Weekly full-scope run, Sunday 02:00 UTC.
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      include_macos:
        description: 'Include the macOS runners'
        type: boolean
        default: true
      run_private_corpus:
        description: >-
          Replay the private fuzz corpus. Requires the fuzz-private-corpus
          environment to be provisioned; a run without it is public-only and is
          reported as incomplete.
        type: boolean
        default: false

permissions:
  contents: read

env:
  # See the identical setting in buildandtest.yml: Nerdbank.GitVersioning
  # appends its cloud-build variables to $GITHUB_ENV once per project, and a
  # parallel solution build tears a line. The `Set cloud version` step already
  # exports the same variables once per job via `nbgv cloud -c -a`.
  NBGV_SetCloudBuildVersionVars: 'false'

# Deliberately separate from the pull-request workflow's group, and never
# cancel-in-progress: a manual full-scope run is expensive and approved, so a
# new push must not discard it.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Expand the full workload
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.matrix.outputs.tests }}
      builds: ${{ steps.matrix.outputs.builds }}
      private_tests: ${{ steps.private.outputs.tests }}
      aot_matrix: ${{ steps.aot.outputs.matrix }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Expand the full test and build matrix
      id: matrix
      shell: pwsh
      env:
        INCLUDE_MACOS: ${{ github.event_name == 'schedule' || inputs.include_macos }}
      run: |
        ./.github/scripts/get-ci-matrix.ps1 `
          -Scope full `
          -ExcludeMacOS:($env:INCLUDE_MACOS -ne 'true') `
          -ManifestPath '${{ runner.temp }}/workload-manifest.json'

    # The private corpus only extends the encoder fuzz project, so its matrix is
    # the same profile table narrowed to that one project rather than a second
    # hand-maintained profile list. macOS is always excluded: the corpus job is
    # about input coverage, not platform coverage, and every extra secret-bearing
    # runner is extra exposure.
    - name: Expand the private-corpus matrix
      id: private
      shell: pwsh
      run: |
        ./.github/scripts/get-ci-matrix.ps1 `
          -Scope full `
          -ExcludeMacOS `
          -OnlyProject 'fuzzing/Opc.Ua.Encoders.Fuzz.Tests/Opc.Ua.Encoders.Fuzz.Tests.csproj'

    - name: Build the NativeAOT matrix
      id: aot
      shell: pwsh
      env:
        INCLUDE_MACOS: ${{ github.event_name == 'schedule' || inputs.include_macos }}
      run: |
        # Windows is included here and not in the pull-request workflow: it is
        # the leg the Azure `testaot` stage owns today, so a full-scope run on
        # Actions has to cover it before that stage can be retired.
        $matrix = @(
            @{ os = 'ubuntu-latest'; rid = 'linux-x64' }
            @{ os = 'windows-latest'; rid = 'win-x64' }
        )
        if ($env:INCLUDE_MACOS -eq 'true') {
            $matrix += @{ os = 'macos-15-intel'; rid = 'osx-x64' }
            $matrix += @{ os = 'macos-latest'; rid = 'osx-arm64' }
        }
        "matrix=$(ConvertTo-Json -InputObject @($matrix) -Compress)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Upload the workload manifest
      uses: actions/upload-artifact@v7
      with:
        name: workload-manifest
        path: ${{ runner.temp }}/workload-manifest.json
        if-no-files-found: error

  build-solutions:
    name: build-${{ matrix.entry.name }}
    needs: discover
    runs-on: ${{ matrix.entry.runsOn }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        entry: ${{ fromJSON(needs.discover.outputs.builds) }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ matrix.entry.dotnet }}

    - name: Set cloud version
      shell: pwsh
      run: ./.azurepipelines/set-version.ps1

    - name: Build ${{ matrix.entry.solution }} (${{ matrix.entry.customTestTarget }})
      shell: pwsh
      env:
        CI_SOLUTION: ${{ matrix.entry.solution }}
        CI_CUSTOM_TEST_TARGET: ${{ matrix.entry.customTestTarget }}
        CI_CONFIGURATION: ${{ matrix.entry.configuration }}
      run: |
        dotnet build $env:CI_SOLUTION `
          --configuration $env:CI_CONFIGURATION `
          "/p:CustomTestTarget=$($env:CI_CUSTOM_TEST_TARGET)"
        if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=Solution build::$($env:CI_SOLUTION) failed to build for $($env:CI_CUSTOM_TEST_TARGET) ($($env:CI_CONFIGURATION))."
            exit $LASTEXITCODE
        }

  tests:
    name: test-${{ matrix.entry.name }}
    needs: discover
    runs-on: ${{ matrix.entry.runsOn }}
    timeout-minutes: ${{ matrix.entry.timeoutMinutes }}
    strategy:
      fail-fast: false
      # Bounded so one approved full-scope run cannot take the whole
      # organisation's runner concurrency for itself.
      max-parallel: 40
      matrix:
        entry: ${{ fromJSON(needs.discover.outputs.tests) }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - uses: ./.github/actions/run-dotnet-tests
      with:
        projects: ${{ matrix.entry.projects }}
        custom-test-target: ${{ matrix.entry.customTestTarget }}
        framework: ${{ matrix.entry.framework }}
        configuration: ${{ matrix.entry.configuration }}
        dotnet: ${{ matrix.entry.dotnet }}
        filter: ${{ matrix.entry.filter }}
        hang-timeout: ${{ matrix.entry.hangTimeout }}
        per-project-timeout: ${{ matrix.entry.perProjectTimeout }}
        coverage: ${{ matrix.entry.coverage }}
        artifact-name: dotnet-results-${{ matrix.entry.id }}

  aot:
    name: aot-${{ matrix.os }}
    needs: discover
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.aot_matrix) }}
    env:
      CONFIGURATION: Release
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.401'

    - name: Set cloud version
      shell: pwsh
      run: ./.azurepipelines/set-version.ps1

    # The three AOT binaries are separate projects to bound the native linker's
    # input, and every one of them is published and run on every AOT platform.
    - name: Publish and run the NativeAOT tests
      shell: pwsh
      env:
        RID: ${{ matrix.rid }}
      run: |
        $ErrorActionPreference = 'Stop'
        $projects = @(
            'tests/Opc.Ua.Aot.Tests/Opc.Ua.Aot.Tests.csproj',
            'tests/Opc.Ua.Aot.Tests.Historian/Opc.Ua.Aot.Tests.Historian.csproj',
            'tests/Opc.Ua.Aot.Tests.Mcp/Opc.Ua.Aot.Tests.Mcp.csproj')
        $failed = @()
        foreach ($project in $projects) {
            $stem = [System.IO.Path]::GetFileNameWithoutExtension($project)
            Write-Host "::group::$stem ($($env:RID))"
            try {
                dotnet publish $project --configuration $env:CONFIGURATION
                if ($LASTEXITCODE -ne 0) {
                    throw "Publish failed with exit code $LASTEXITCODE."
                }

                $publishDir = Join-Path (Split-Path $project -Parent) "bin/$($env:CONFIGURATION)/net10.0/$($env:RID)/publish"
                $executable = Get-ChildItem -LiteralPath $publishDir -File |
                    Where-Object { $_.BaseName -eq $stem -and ($_.Extension -eq '' -or $_.Extension -ieq '.exe') } |
                    Select-Object -First 1
                if ($null -eq $executable) {
                    # A managed publish that silently fell back from NativeAOT
                    # would leave a .dll here and nothing to run; that is a
                    # failure, not an empty pass.
                    throw "No NativeAOT executable was produced in '$publishDir'."
                }

                & $executable.FullName --results-directory "./TestResults/$stem"
                if ($LASTEXITCODE -ne 0) {
                    throw "The NativeAOT test run exited with code $LASTEXITCODE."
                }
            }
            catch {
                $failed += $stem
                Write-Host "::error title=$stem ($($env:RID))::$($_.Exception.Message)"
            }
            finally {
                Write-Host '::endgroup::'
            }
        }
        if ($failed.Count -gt 0) {
            throw "NativeAOT failed for: $($failed -join ', ')."
        }

    - name: Upload NativeAOT results
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: aot-results-${{ matrix.os }}-${{ matrix.rid }}
        path: |
          **/TestResults/**
          **/*-report.html

  coverage:
    name: coverage
    needs: [discover, tests]
    runs-on: ubuntu-latest
    # always(): the coverage of a run whose tests failed is still worth
    # reporting.
    if: ${{ always() }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.401'

    - name: Download test results
      uses: actions/download-artifact@v8
      with:
        pattern: dotnet-results-*
        path: coverage-artifacts

    - name: Detect coverage
      id: probe
      shell: pwsh
      env:
        TESTS_RESULT: ${{ needs.tests.result }}
      run: |
        $reports = @(Get-ChildItem -Path coverage-artifacts -Recurse -File -Filter *.cobertura.xml -ErrorAction SilentlyContinue)
        Write-Host "Found $($reports.Count) Cobertura report(s)."
        "has_reports=$(($reports.Count -gt 0).ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        if ($reports.Count -gt 0) {
            exit 0
        }

        # Whether "no coverage" is expected depends on whether the matrix ran. A
        # matrix that completed and published nothing means the collector is
        # broken, and reporting green would hide that indefinitely.
        if ($env:TESTS_RESULT -eq 'success') {
            Write-Host '::error title=Coverage::The test matrix completed but published no coverage at all; the collector is not working.'
            exit 1
        }
        Write-Host "::warning title=Coverage::The test matrix did not complete (result: $($env:TESTS_RESULT)), so there is no coverage to evaluate."

    - name: Merge coverage report
      if: ${{ steps.probe.outputs.has_reports == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        dotnet tool install --tool-path tools dotnet-reportgenerator-globaltool
        ./tools/reportgenerator `
            '-reports:coverage-artifacts/**/*.cobertura.xml' `
            '-targetdir:CodeCoverage' `
            '-reporttypes:Cobertura;HtmlSummary' `
            '-title:UA .Net Standard Full Test Coverage' `
            '-assemblyfilters:-*.Tests'
        if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=Coverage::ReportGenerator failed with exit code $LASTEXITCODE."
            exit $LASTEXITCODE
        }

    - name: Upload merged coverage report
      if: ${{ steps.probe.outputs.has_reports == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: CodeCoverage

    # Project floors only: there is no pull request to diff against, so
    # check-coverage.ps1 skips its changed-lines gate.
    - name: Evaluate coverage
      if: ${{ steps.probe.outputs.has_reports == 'true' }}
      shell: pwsh
      run: |
        ./.azurepipelines/check-coverage.ps1 `
            -CoberturaPath CodeCoverage/Cobertura.xml `
            -ThresholdsPath coverage-thresholds.json `
            -RepoRoot '${{ github.workspace }}' `
            -SummaryPath coverage-summary.md
        $outcome = $LASTEXITCODE
        if (Test-Path coverage-summary.md) {
            Get-Content coverage-summary.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
        }
        if ($outcome -ne 0) {
            Write-Host '::error title=Coverage::Coverage thresholds were not met; see the job summary for the numbers.'
            exit 1
        }

  # The approved exception to the "no secrets in CI test jobs" rule. The crash
  # corpus that Azure supplies as a secure file is genuinely consumed by
  # FuzzTargetTestsBase, and checked-in inputs are not an equivalent substitute,
  # so it is replayed here - only on an explicit request, only through a
  # protected environment, and never from a fork's code.
  #
  # Two things must stay true of this job:
  #   * no private corpus bytes and no raw test output ever become public. The
  #     executor is run with -QuietOutput because a failing fuzz test prints a
  #     base64 reproducer, and a public repository's job log is world-readable.
  #   * a missing prerequisite fails the job. Silently degrading to a
  #     public-corpus run would report full coverage that was never performed.
  private-corpus:
    name: private-corpus-${{ matrix.entry.name }}
    needs: discover
    if: ${{ inputs.run_private_corpus }}
    runs-on: ${{ matrix.entry.runsOn }}
    timeout-minutes: 90
    # Provisioned by a maintainer with a deployment-branch restriction and
    # required reviewers. See docs/DeveloperGuide.md.
    environment: fuzz-private-corpus
    permissions:
      contents: read
      # Federated credential exchange for the storage account holding the
      # corpus; no long-lived storage key is stored in this repository.
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        entry: ${{ fromJSON(needs.discover.outputs.private_tests) }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Verify the private-corpus prerequisites
      shell: pwsh
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        FUZZ_CORPUS_ACCOUNT: ${{ vars.FUZZ_CORPUS_ACCOUNT }}
        FUZZ_CORPUS_CONTAINER: ${{ vars.FUZZ_CORPUS_CONTAINER }}
        FUZZ_CORPUS_BLOB: ${{ vars.FUZZ_CORPUS_BLOB }}
        FUZZ_CORPUS_SHA256: ${{ vars.FUZZ_CORPUS_SHA256 }}
      run: |
        $required = @(
            'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID',
            'FUZZ_CORPUS_ACCOUNT', 'FUZZ_CORPUS_CONTAINER', 'FUZZ_CORPUS_BLOB',
            'FUZZ_CORPUS_SHA256')
        $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([System.Environment]::GetEnvironmentVariable($_)) })
        if ($missing.Count -gt 0) {
            throw ("The fuzz-private-corpus environment is not provisioned: $($missing -join ', ') " +
                'is not set. Falling back to the public corpus would report private-corpus coverage ' +
                'that was never performed, so this job fails instead. See docs/DeveloperGuide.md.')
        }
        Write-Host 'Private-corpus prerequisites are present.'

    - name: Authenticate to the corpus store
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Download and verify the corpus
      shell: pwsh
      env:
        FUZZ_CORPUS_ACCOUNT: ${{ vars.FUZZ_CORPUS_ACCOUNT }}
        FUZZ_CORPUS_CONTAINER: ${{ vars.FUZZ_CORPUS_CONTAINER }}
        FUZZ_CORPUS_BLOB: ${{ vars.FUZZ_CORPUS_BLOB }}
        FUZZ_CORPUS_SHA256: ${{ vars.FUZZ_CORPUS_SHA256 }}
      run: |
        $ErrorActionPreference = 'Stop'
        $archive = Join-Path '${{ runner.temp }}' 'FuzzingArtifacts.zip'
        az storage blob download `
            --auth-mode login `
            --account-name $env:FUZZ_CORPUS_ACCOUNT `
            --container-name $env:FUZZ_CORPUS_CONTAINER `
            --name $env:FUZZ_CORPUS_BLOB `
            --file $archive `
            --no-progress `
            --only-show-errors | Out-Null
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $archive)) {
            throw "The private corpus could not be downloaded (exit code $LASTEXITCODE)."
        }

        # Pinned digest: the corpus is an immutable input to this run, and a
        # changed archive has to be re-approved rather than silently replayed.
        $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        $expected = $env:FUZZ_CORPUS_SHA256.Trim().ToLowerInvariant()
        if ($actual -ne $expected) {
            throw "The private corpus digest does not match: expected $expected, got $actual."
        }

        # Same overlay location the Azure template extracts to, so the assets
        # land where FuzzTargetTestsBase enumerates them.
        Expand-Archive -LiteralPath $archive -DestinationPath './fuzzing/Opc.Ua.Encoders.Fuzz.Tests' -Force
        Remove-Item -LiteralPath $archive -Force
        Write-Host "Corpus verified ($actual) and extracted."

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ matrix.entry.dotnet }}

    - name: Set cloud version
      shell: pwsh
      run: ./.azurepipelines/set-version.ps1

    - name: Replay the private corpus
      shell: pwsh
      env:
        CI_PROJECTS: ${{ matrix.entry.projects }}
        CI_CUSTOM_TEST_TARGET: ${{ matrix.entry.customTestTarget }}
        CI_FRAMEWORK: ${{ matrix.entry.framework }}
        CI_CONFIGURATION: ${{ matrix.entry.configuration }}
        CI_FILTER: ${{ matrix.entry.filter }}
        CI_HANG_TIMEOUT: ${{ matrix.entry.hangTimeout }}
        CI_PER_PROJECT_TIMEOUT: ${{ matrix.entry.perProjectTimeout }}
      run: |
        ./.github/scripts/run-dotnet-tests.ps1 `
          -Projects $env:CI_PROJECTS `
          -CustomTestTarget $env:CI_CUSTOM_TEST_TARGET `
          -Framework $env:CI_FRAMEWORK `
          -Configuration $env:CI_CONFIGURATION `
          -Filter $env:CI_FILTER `
          -HangTimeout $env:CI_HANG_TIMEOUT `
          -PerProjectTimeoutMinutes ([int]$env:CI_PER_PROJECT_TIMEOUT) `
          -ResultsDirectory '${{ runner.temp }}/private-results' `
          -QuietOutput

    # Evidence without content: outcomes, counts and a digest per result file,
    # so a reviewer can tell the run happened and correlate it with the private
    # copy without any corpus byte or reproducer leaving the runner.
    - name: Publish sanitized evidence
      if: ${{ always() }}
      shell: pwsh
      run: |
        $root = '${{ runner.temp }}/private-results'
        if (-not (Test-Path -LiteralPath $root)) {
            Write-Host '::warning title=Private corpus::No results were produced.'
            exit 0
        }
        $lines = @(
            "### private corpus - ${{ matrix.entry.name }}",
            '',
            '| Evidence | SHA-256 | Bytes |',
            '| --- | --- | ---: |')
        foreach ($file in Get-ChildItem -LiteralPath $root -Recurse -File | Sort-Object FullName) {
            $relative = [System.IO.Path]::GetRelativePath($root, $file.FullName).Replace('\', '/')
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "| $relative | $hash | $($file.Length) |"
        }
        $lines += ''
        $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

    # Belt and braces: the results tree is under RUNNER_TEMP and no step uploads
    # it, but an accidental upload added later would publish reproducer bytes, so
    # remove it before the runner is recycled.
    - name: Discard private results
      if: ${{ always() }}
      shell: pwsh
      run: |
        $root = '${{ runner.temp }}/private-results'
        if (Test-Path -LiteralPath $root) {
            Remove-Item -LiteralPath $root -Recurse -Force
            Write-Host 'Private results discarded.'
        }

  nightly-summary:
    # Deliberately NOT named 'build-and-test summary': that name belongs to the
    # required pull-request check in buildandtest.yml, and two workflows
    # reporting the same context would make a manual run able to satisfy - or
    # break - branch protection.
    name: nightly summary
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [discover, build-solutions, tests, aot, coverage, private-corpus]
    steps:
    - name: Evaluate job results
      shell: pwsh
      env:
        DISCOVER_RESULT: ${{ needs.discover.result }}
        BUILD_RESULT: ${{ needs.build-solutions.result }}
        TEST_RESULT: ${{ needs.tests.result }}
        AOT_RESULT: ${{ needs.aot.result }}
        COVERAGE_RESULT: ${{ needs.coverage.result }}
        PRIVATE_RESULT: ${{ needs.private-corpus.result }}
        PRIVATE_REQUESTED: ${{ inputs.run_private_corpus }}
      run: |
        $results = [ordered]@{
          'discover'        = $env:DISCOVER_RESULT
          'build-solutions' = $env:BUILD_RESULT
          'tests'           = $env:TEST_RESULT
          'aot'             = $env:AOT_RESULT
          'coverage'        = $env:COVERAGE_RESULT
          'private-corpus'  = $env:PRIVATE_RESULT
        }

        $bad = @()
        foreach ($job in $results.GetEnumerator()) {
          Write-Host "$($job.Key): $($job.Value)"
          if (@('success', 'skipped') -notcontains $job.Value) {
            $bad += "$($job.Key)=$($job.Value)"
          }
        }

        # Coverage of the private corpus is the one part of the Azure full-scope
        # workload that cannot run from public inputs, so a run without it is
        # explicitly labelled incomplete rather than presented as full parity.
        if ($env:PRIVATE_REQUESTED -eq 'true' -and $env:PRIVATE_RESULT -eq 'skipped') {
          $bad += 'private-corpus=requested but did not run'
        }
        $complete = $env:PRIVATE_REQUESTED -eq 'true' -and $env:PRIVATE_RESULT -eq 'success'
        $scope = if ($complete) { 'full (public + private corpus)' } else { 'public only - INCOMPLETE for Azure parity' }
        Write-Host "Validation scope: $scope"
        "### Nightly validation scope: $scope" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

        if ($bad.Count -gt 0) {
          Write-Host "::error::Nightly jobs did not succeed: $($bad -join ', ')"
          exit 1
        }
        Write-Host 'All nightly jobs succeeded or were intentionally skipped.'

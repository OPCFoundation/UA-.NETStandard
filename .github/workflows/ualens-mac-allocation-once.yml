name: UaLens macOS allocation diagnostic (temporary)

on:
  pull_request:
    types: [synchronize]
    paths:
    - '.github/workflows/ualens-mac-allocation-once.yml'
    - 'tests/Opc.Ua.Lens.Artifacts.Tests/MacNativeAllocationDiagnosticTests.cs'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci4822-mac-allocation-once
  cancel-in-progress: false

jobs:
  mac-allocation-once:
    if: >-
      github.repository == 'OPCFoundation/UA-.NETStandard' &&
      github.event.pull_request.number == 4822 &&
      github.event.pull_request.head.repo.full_name == 'marcschier/UA-.NETStandard' &&
      github.event.pull_request.head.ref == 'pisrapp' &&
      github.run_attempt == 1
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      CI4822_ALLOCATION_AUTHORIZATION: mac-allocation-once-20261018
      CI4822_ALLOCATION_HEAD: ${{ github.event.pull_request.head.sha }}
      CI4822_ALLOCATION_SOURCE: f31ba46963821a411c3c6754b9bd11aeac0dcc93
    steps:
    - uses: actions/checkout@v7
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.sha }}
        path: definition
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@v7
      with:
        ref: f31ba46963821a411c3c6754b9bd11aeac0dcc93
        path: source
        fetch-depth: 0
        persist-credentials: false
    - name: Validate the single authorized definition
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = 'Stop'
        $parent = git -C definition rev-parse --verify "$($env:CI4822_ALLOCATION_HEAD)^"
        if ($LASTEXITCODE -ne 0 -or $parent.Trim() -ne $env:CI4822_ALLOCATION_SOURCE) { throw 'Unexpected definition parent.' }
        $changed = @(git -C definition diff-tree --no-commit-id --name-only -r $env:CI4822_ALLOCATION_HEAD)
        if ($LASTEXITCODE -ne 0) { throw 'Cannot verify the definition diff.' }
        $expected = @('.github/workflows/ualens-mac-allocation-once.yml', 'tests/Opc.Ua.Lens.Artifacts.Tests/MacNativeAllocationDiagnosticTests.cs')
        if (Compare-Object ($changed | Sort-Object) ($expected | Sort-Object)) { throw 'Unexpected definition changes.' }
        $pr = gh api repos/OPCFoundation/UA-.NETStandard/pulls/4822 | ConvertFrom-Json
        if ($LASTEXITCODE -ne 0) { throw 'Cannot verify PR ownership.' }
        if ($pr.state -ne 'open' -or !$pr.draft -or $pr.head.sha -ne $env:CI4822_ALLOCATION_HEAD -or $pr.head.repo.full_name -ne 'marcschier/UA-.NETStandard' -or $pr.head.ref -ne 'pisrapp' -or $pr.base.ref -ne 'master') { throw 'PR state or ownership changed.' }
        New-Item -ItemType Directory -Force artifacts/ci4822-mac-allocation | Out-Null
        "diagnostic-only`ndefinition=$($env:CI4822_ALLOCATION_HEAD)`nsource=$($env:CI4822_ALLOCATION_SOURCE)`nrun=$($env:GITHUB_RUN_ID)`nattempt=$($env:GITHUB_RUN_ATTEMPT)" | Set-Content artifacts/ci4822-mac-allocation/authorization.txt
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: source/global.json
    - name: Build the unchanged public-dependency native artifact
      working-directory: source
      shell: pwsh
      run: |
        dotnet publish tools/Opc.Ua.Lens/Opc.Ua.Lens.csproj -c Release -f net10.0 -p:CustomTestTarget=net10.0 -r osx-arm64 --self-contained true -p:PackAsTool=false -p:PublishAotEnabled=true -p:SuppressTrimAnalysisWarnings=false -p:TrimmerSingleWarn=false -m:2 -o "$env:GITHUB_WORKSPACE/mac-native"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        git diff --exit-code
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Build the isolated diagnostic fixture
      working-directory: definition
      shell: pwsh
      run: |
        dotnet build tests/Opc.Ua.Lens.Artifacts.Tests/Opc.Ua.Lens.Artifacts.Tests.csproj -c Release -f net10.0 -p:CustomTestTarget=net10.0 --nologo
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Recheck authorization immediately before execution
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $pr = gh api repos/OPCFoundation/UA-.NETStandard/pulls/4822 | ConvertFrom-Json
        if ($LASTEXITCODE -ne 0) { throw 'Cannot verify PR ownership.' }
        if ($pr.state -ne 'open' -or !$pr.draft -or $pr.head.sha -ne $env:CI4822_ALLOCATION_HEAD -or $pr.head.repo.full_name -ne 'marcschier/UA-.NETStandard' -or $pr.head.ref -ne 'pisrapp' -or $pr.base.ref -ne 'master') { throw 'PR state or ownership changed.' }
    - name: Run the one permitted allocation diagnostic
      working-directory: definition
      timeout-minutes: 4
      shell: pwsh
      run: |
        $env:UALENS_ARTIFACT_EXECUTABLE = "$env:GITHUB_WORKSPACE/mac-native/UaLens"
        $env:UALENS_ARTIFACT_LOG_DIRECTORY = "$env:GITHUB_WORKSPACE/artifacts/ci4822-mac-allocation"
        $env:CI4822_ALLOCATION_SOURCE_DIRECTORY = "$env:GITHUB_WORKSPACE/source"
        dotnet test tests/Opc.Ua.Lens.Artifacts.Tests/Opc.Ua.Lens.Artifacts.Tests.csproj -c Release -f net10.0 -p:CustomTestTarget=net10.0 --no-build --filter 'FullyQualifiedName~MacNativeAllocationDiagnosticTests.CaptureAllocationOnceAsync' --blame-hang --blame-hang-timeout 3min --logger 'trx;LogFileName=diagnostic.trx' --results-directory "$env:UALENS_ARTIFACT_LOG_DIRECTORY/nunit" -- NUnit.NumberOfTestWorkers=0 RunConfiguration.TreatNoTestsAsError=true
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ci4822-mac-allocation-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/ci4822-mac-allocation
        if-no-files-found: error
        retention-days: 30

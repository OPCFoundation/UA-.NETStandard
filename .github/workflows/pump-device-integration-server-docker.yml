name: Pump Device Integration Server Docker

on:
  push:
    branches: [ master ]
    paths:
    - 'samples/DI/PumpDeviceIntegrationServer/**'
    - 'src/**'
    - 'src/**'
    - 'tools/**'
    - 'Directory.*.props'
    - 'Directory.Build.targets'
    - '*.props'
    - 'NuGet.config'
    - '.github/workflows/pump-device-integration-server-docker.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pumpdeviceintegrationserver

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.401'

    - name: Set Version
      shell: pwsh
      run: ./.azurepipelines/set-version.ps1

    - name: Setup Docker buildx
      uses: docker/setup-buildx-action@v4

    - name: Log into registry ${{ env.REGISTRY }}
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Prepare image repository name
      run: |
        echo IMAGE_REPOSITORY=$(echo ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]') >> $GITHUB_ENV

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.IMAGE_REPOSITORY }}
        # This workflow only ever builds from master, which never produces a
        # stable release under the branch/version model in
        # docs/ReleaseProcess.md - only a canonical release/<major>.<minor>
        # branch does, and this image is not (yet) built from one. Tag the
        # development build "preview", not "latest", so it is never mistaken
        # for a stable release image.
        tags: |
          type=raw,value=preview
          type=raw,value=${{ env.NBGV_NuGetPackageVersion }}
          type=sha

    - name: Build and push Docker image
      id: build-and-push
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./samples/DI/PumpDeviceIntegrationServer/Dockerfile
        build-args: |
          Version=${{ env.NBGV_Version }}
          SimpleVersion=${{ env.NBGV_SimpleVersion }}
          InformationalVersion=${{ env.NBGV_AssemblyInformationalVersion }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64
        provenance: false
        cache-from: type=gha
        # setup-buildx-action@v4 installs Buildx and BuildKit versions that support ignore-error.
        cache-to: type=gha,mode=max,ignore-error=true

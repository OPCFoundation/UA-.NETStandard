name: UaLens desktop and distributed artifacts

on:
  pull_request:
    paths:
    - 'tools/Opc.Ua.Lens/**'
    - 'tools/Opc.Ua.OpenUsd.Connector.Viewer/**'
    - 'tests/Opc.Ua.Lens.Tests/**'
    - 'tests/Opc.Ua.Lens.Workflow.Tests/**'
    - 'tests/Opc.Ua.Lens.Desktop.Tests/**'
    - 'src/**'
    - '*.props'
    - 'Directory.Build.targets'
    - 'NuGet.config'
    - 'global.json'
    - 'version.json'
    - '.github/workflows/ualens-artifacts.yml'
    - '.github/scripts/test-lens-desktop.ps1'
    - '.github/scripts/test_desktop_result_guard.py'
    - '.github/scripts/test_ualens_artifact.py'
    - '.github/scripts/prepare_ualens_candidate.py'
    - '.github/scripts/test_ualens_candidate.py'
    - '.github/scripts/diagnose_ualens_macos.py'
  push:
    branches: [master, main, develop/*]
    paths:
    - 'tools/Opc.Ua.Lens/**'
    - 'tools/Opc.Ua.OpenUsd.Connector.Viewer/**'
    - 'tests/Opc.Ua.Lens.Tests/**'
    - 'tests/Opc.Ua.Lens.Workflow.Tests/**'
    - 'tests/Opc.Ua.Lens.Desktop.Tests/**'
    - 'src/**'
    - '*.props'
    - 'Directory.Build.targets'
    - 'NuGet.config'
    - 'global.json'
    - 'version.json'
    - '.github/workflows/ualens-artifacts.yml'
    - '.github/scripts/test-lens-desktop.ps1'
    - '.github/scripts/test_desktop_result_guard.py'
    - '.github/scripts/test_ualens_artifact.py'
    - '.github/scripts/prepare_ualens_candidate.py'
    - '.github/scripts/test_ualens_candidate.py'
    - '.github/scripts/diagnose_ualens_macos.py'
  workflow_dispatch:
    inputs:
      candidate_manifest:
        description: Optional checkout-relative immutable candidate manifest; never changes production pins
        type: string
        default: ''
  workflow_call:
    inputs:
      candidate_manifest:
        description: Checkout-relative immutable candidate manifest for artifact-only qualification
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: >-
    ualens-artifacts-${{ github.event.pull_request.number || github.ref }}-${{
    inputs.candidate_manifest != '' && 'candidate' || 'production' }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  PROJECT: tools/Opc.Ua.Lens/Opc.Ua.Lens.csproj

jobs:
  desktop-targets:
    name: Desktop diagnostics (${{ matrix.tfm }})
    if: ${{ !inputs.candidate_manifest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tfm: [net8.0, net9.0, net10.0]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Verify desktop result guard negative cases
      if: matrix.tfm == 'net10.0'
      run: python3 .github/scripts/test_desktop_result_guard.py
    - name: Verify native artifact acceptance and image-evidence guards
      if: matrix.tfm == 'net10.0'
      run: python3 .github/scripts/test_ualens_artifact.py
    - name: Verify candidate provenance and isolation guards
      if: matrix.tfm == 'net10.0'
      run: python3 .github/scripts/test_ualens_candidate.py
    - name: Build with normal analyzer and obsolete guards
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force artifacts/lens/logs | Out-Null
        dotnet build $env:PROJECT -c Release -f ${{ matrix.tfm }} -p:CustomTestTarget=${{ matrix.tfm }} -m:2 --nologo -v:minimal -bl:artifacts/lens/logs/build.binlog '-flp:logfile=artifacts/lens/logs/build.log;verbosity=normal'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ualens-diagnostics-${{ matrix.tfm }}
        path: artifacts/lens/logs
        if-no-files-found: error

  desktop-regressions:
    name: Windows desktop regressions
    if: ${{ !inputs.candidate_manifest }}
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Build the desktop regression harness
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force artifacts/lens/desktop-logs | Out-Null
        dotnet build tests/Opc.Ua.Lens.Desktop.Tests/Opc.Ua.Lens.Desktop.Tests.csproj -c Release -f net10.0 -p:CustomTestTarget=net10.0 -m:2 --nologo -v:minimal -bl:artifacts/lens/desktop-logs/build.binlog '-flp:logfile=artifacts/lens/desktop-logs/build.log;verbosity=normal'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Execute explicit real-desktop fixtures and validate the expected results
      timeout-minutes: 5
      shell: pwsh
      run: |
        pwsh -NoProfile -File .github/scripts/test-lens-desktop.ps1 -Configuration Release -NoBuild
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Execute connected desktop workflows in a separate process
      timeout-minutes: 25
      shell: pwsh
      run: |
        dotnet test tests/Opc.Ua.Lens.Workflow.Tests/Opc.Ua.Lens.Workflow.Tests.csproj -c Release -f net10.0 -p:CustomTestTarget=net10.0 --blame-hang --blame-hang-timeout 3min --logger 'trx;LogFileName=workflow.trx' --results-directory TestResults/lens-desktop-workflow -- NUnit.NumberOfTestWorkers=0
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        [xml] $report = Get-Content TestResults/lens-desktop-workflow/workflow.trx -Raw
        $counts = $report.TestRun.ResultSummary.Counters
        if ([int] $counts.total -le 0 -or [int] $counts.passed -ne [int] $counts.total) {
          throw 'Every selected desktop workflow must execute and pass.'
        }
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ualens-windows-desktop-regressions
        path: |
          TestResults/lens-desktop
          TestResults/lens-desktop-workflow
          artifacts/lens/desktop-logs
        if-no-files-found: error

  native-desktop:
    name: Native desktop (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-2022
          rid: win-x64
          executable: UaLens.exe
        - os: ubuntu-24.04
          rid: linux-x64
          executable: UaLens
        - os: macos-15
          rid: osx-arm64
          executable: UaLens
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Prepare immutable candidate inputs without editing production pins
      if: inputs.candidate_manifest != ''
      env:
        GH_TOKEN: ${{ github.token }}
        CANDIDATE_MANIFEST: ${{ inputs.candidate_manifest }}
      shell: pwsh
      run: |
        python .github/scripts/test_ualens_candidate.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python .github/scripts/prepare_ualens_candidate.py `
          --manifest $env:CANDIDATE_MANIFEST `
          --work-directory (Join-Path $env:RUNNER_TEMP 'ualens-candidate') `
          --evidence artifacts/lens/candidate-input.json --github-env $env:GITHUB_ENV
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Linux native compiler and desktop prerequisites
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang zlib1g-dev libopengl0 libvulkan1 mesa-vulkan-drivers libice6 libsm6 libx11-6 libxext6 libxrender1 libfontconfig1 libfreetype6 fonts-dejavu-core xvfb xauth
    - name: Publish native desktop (keep detailed trim and AOT diagnostics)
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force artifacts/lens/logs | Out-Null
        # Keep PublishAot project-local; a global value also targets netstandard source generators.
        dotnet publish $env:PROJECT -c Release -f net10.0 -p:CustomTestTarget=net10.0 -r ${{ matrix.rid }} --self-contained true -p:PackAsTool=false -p:PublishAotEnabled=true -p:SuppressTrimAnalysisWarnings=false -p:TrimmerSingleWarn=false -m:2 -o artifacts/lens/native -bl:artifacts/lens/logs/native.binlog '-flp:logfile=artifacts/lens/logs/native.log;verbosity=normal'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        # Preserve Unix executable permissions through artifact upload/download.
        tar -czf artifacts/lens/ualens-${{ matrix.rid }}.tar.gz -C artifacts/lens/native .
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Launch the native artifact on a desktop and require drained exit
      timeout-minutes: 3
      shell: pwsh
      run: |
        $arguments = @('tools/Opc.Ua.Lens/validate-artifact.py', '--executable', 'artifacts/lens/native/${{ matrix.executable }}', '--log-directory', 'artifacts/lens/logs/smoke')
        if ($IsLinux) {
          xvfb-run --auto-servernum '--server-args=-screen 0 1600x1000x24 -dpi 96' python3 @arguments
        } elseif ($IsMacOS) {
          python3 @arguments
        } else {
          python @arguments
        }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Require real native viewport capture, stage update and drained allocations
      id: native_viewport
      timeout-minutes: 3
      shell: pwsh
      run: |
        $arguments = @('tools/Opc.Ua.Lens/validate-artifact.py', '--executable', 'artifacts/lens/native/${{ matrix.executable }}', '--native-viewport', '--log-directory', 'artifacts/lens/logs/native-viewport')
        if ($IsLinux) {
          $arguments += '--x11-vulkan'
          xvfb-run --auto-servernum '--server-args=-screen 0 1600x1000x24 -dpi 96' python3 @arguments
        } elseif ($IsMacOS) {
          python3 @arguments
        } else {
          python @arguments
        }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Collect owned macOS native crash evidence
      if: ${{ failure() && runner.os == 'macOS' && steps.native_viewport.outcome == 'failure' }}
      timeout-minutes: 3
      run: python3 .github/scripts/diagnose_ualens_macos.py --result artifacts/lens/logs/native-viewport/result.json
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ualens-native-${{ matrix.rid }}
        path: artifacts/lens
        if-no-files-found: error

  managed-package:
    name: Pack managed desktop for all RIDs
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Prepare immutable candidate inputs without editing production pins
      if: inputs.candidate_manifest != ''
      env:
        GH_TOKEN: ${{ github.token }}
        CANDIDATE_MANIFEST: ${{ inputs.candidate_manifest }}
      shell: pwsh
      run: |
        python .github/scripts/test_ualens_candidate.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python .github/scripts/prepare_ualens_candidate.py `
          --manifest $env:CANDIDATE_MANIFEST `
          --work-directory (Join-Path $env:RUNNER_TEMP 'ualens-candidate') `
          --evidence artifacts/lens/candidate-input.json --github-env $env:GITHUB_ENV
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Restore and pack managed tool (never reuse native output)
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force artifacts/lens/logs | Out-Null
        dotnet restore $env:PROJECT -p:Configuration=Release -p:CustomTestTarget=net10.0 -p:PublishAotEnabled=false -p:PublishAot=false -p:PublishTrimmed=false -p:PackAsTool=true
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet pack $env:PROJECT -c Release --no-restore -p:CustomTestTarget=net10.0 -p:TargetFramework=net10.0 -p:PublishAotEnabled=false -p:PublishAot=false -p:PublishTrimmed=false -p:PackAsTool=true -m:2 -o artifacts/lens/packages -bl:artifacts/lens/logs/managed.binlog '-flp:logfile=artifacts/lens/logs/managed.log;verbosity=normal'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ualens-managed-packages
        path: artifacts/lens
        if-no-files-found: error
        compression-level: 0

  managed-tool:
    name: Installed managed desktop (${{ matrix.rid }})
    needs: managed-package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-2022
          rid: win-x64
          command: ualens.exe
        - os: ubuntu-24.04
          rid: linux-x64
          command: ualens
        - os: macos-15
          rid: osx-arm64
          command: ualens
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - uses: actions/download-artifact@v8
      with:
        name: ualens-managed-packages
        path: artifacts/lens
    - name: Linux desktop prerequisites
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libopengl0 libvulkan1 mesa-vulkan-drivers libice6 libsm6 libx11-6 libxext6 libxrender1 libfontconfig1 libfreetype6 fonts-dejavu-core xvfb xauth
    - name: Install only the freshly packed local artifact into an isolated directory
      id: tool_install
      shell: pwsh
      run: |
        $root = Join-Path $env:RUNNER_TEMP 'ualens-installed'
        New-Item -ItemType Directory $root | Out-Null
        $source = [System.Security.SecurityElement]::Escape((Resolve-Path artifacts/lens/packages).Path)
        $config = Join-Path $root 'NuGet.config'
        [System.IO.File]::WriteAllText($config, "<configuration><packageSources><clear/><add key=`"artifact`" value=`"$source`"/></packageSources></configuration>")
        $env:NUGET_PACKAGES = Join-Path $root 'cache'
        $env:DOTNET_CLI_HOME = Join-Path $root 'cli'
        $packages = @(Get-ChildItem artifacts/lens/packages -Filter '*.nupkg' -File)
        if ($packages.Count -ne 4) { throw 'Expected one selector and three RID-specific tool packages.' }
        $identities = @(foreach ($package in $packages) {
          $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $entries = @($archive.Entries | Where-Object {
              $_.FullName -notmatch '/' -and $_.FullName.EndsWith('.nuspec')
            })
            if ($entries.Count -ne 1) { throw "Invalid package manifest: $($package.Name)" }
            $reader = [IO.StreamReader]::new($entries[0].Open())
            try { [xml] $manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
            [pscustomobject]@{
              Id = [string]$manifest.package.metadata.id
              Version = [string]$manifest.package.metadata.version
            }
          } finally { $archive.Dispose() }
        })
        $id = 'OPCFoundation.NetStandard.Opc.Ua.Lens'
        $primary = @($identities | Where-Object Id -CEQ $id)
        if ($primary.Count -ne 1) { throw 'Expected exactly one root tool selector.' }
        $version = $primary[0].Version
        $expectedIds = @($id, "$id.win-x64", "$id.linux-x64", "$id.osx-arm64")
        if (@(Compare-Object $expectedIds $identities.Id -CaseSensitive).Count -ne 0 -or
            [string]::IsNullOrWhiteSpace($version) -or
            @($identities | Where-Object Version -CNE $version).Count -ne 0) {
          throw 'The tool packages must have the expected identities and exactly the same version.'
        }
        dotnet tool install OPCFoundation.NetStandard.Opc.Ua.Lens --version $version --tool-path (Join-Path $root 'tool') --configfile $config --no-cache
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "version=$version" >> $env:GITHUB_OUTPUT
    - name: Launch the installed shim on a desktop and require drained exit
      timeout-minutes: 3
      shell: pwsh
      run: |
        $executable = Join-Path $env:RUNNER_TEMP 'ualens-installed/tool/${{ matrix.command }}'
        $arguments = @('tools/Opc.Ua.Lens/validate-artifact.py', '--executable', $executable, '--log-directory', 'artifacts/lens/logs/smoke')
        if ($IsLinux) {
          xvfb-run --auto-servernum '--server-args=-screen 0 1600x1000x24 -dpi 96' python3 @arguments
        } elseif ($IsMacOS) {
          python3 @arguments
        } else {
          python @arguments
        }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Require native viewport capture through the installed shim
      id: native_viewport
      timeout-minutes: 3
      shell: pwsh
      run: |
        $executable = Join-Path $env:RUNNER_TEMP 'ualens-installed/tool/${{ matrix.command }}'
        $arguments = @('tools/Opc.Ua.Lens/validate-artifact.py', '--executable', $executable, '--native-viewport', '--log-directory', 'artifacts/lens/logs/native-viewport')
        if ($IsLinux) {
          $arguments += '--x11-vulkan'
          xvfb-run --auto-servernum '--server-args=-screen 0 1600x1000x24 -dpi 96' python3 @arguments
        } elseif ($IsMacOS) {
          python3 @arguments
        } else {
          python @arguments
        }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Collect owned macOS managed-host crash evidence
      if: ${{ failure() && runner.os == 'macOS' && steps.native_viewport.outcome == 'failure' }}
      timeout-minutes: 3
      run: python3 .github/scripts/diagnose_ualens_macos.py --result artifacts/lens/logs/native-viewport/result.json
    - name: Require Windows candidate rendering beyond the legacy path limit
      if: runner.os == 'Windows' && inputs.candidate_manifest != ''
      timeout-minutes: 5
      env:
        ARTIFACT_VERSION: ${{ steps.tool_install.outputs.version }}
      shell: pwsh
      run: |
        $root = Join-Path $env:RUNNER_TEMP 'ualens-installed'
        $deep = Join-Path $root ('native-long-path-' + ('x' * 96))
        $env:NUGET_PACKAGES = Join-Path $root 'cache'
        $env:DOTNET_CLI_HOME = Join-Path $root 'cli'
        dotnet tool install OPCFoundation.NetStandard.Opc.Ua.Lens `
          --version $env:ARTIFACT_VERSION --tool-path $deep `
          --configfile (Join-Path $root 'NuGet.config') --no-cache
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $assemblies = @(Get-ChildItem (Join-Path $deep '.store') -Filter 'UaLens.dll' -File -Recurse)
        if ($assemblies.Count -ne 1 -or $assemblies[0].DirectoryName.Length -lt 260) {
          throw 'The candidate path gate must execute from an application directory of at least 260 characters.'
        }
        python tools/Opc.Ua.Lens/validate-artifact.py `
          --executable (Join-Path $deep 'ualens.exe') --native-viewport `
          --log-directory artifacts/lens/logs/native-long-path
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ualens-managed-${{ matrix.rid }}
        path: artifacts/lens
        if-no-files-found: error

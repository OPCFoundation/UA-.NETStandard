name: WMTP Busy diagnostic 68eda
run-name: One-shot WMTP Busy diagnostic against 68eda7f6e8

on:
  push:
    branches: [marcschier-extract-remaining-shared-changes]
    paths:
      - .github/workflows/wmtp-busy-68eda.yml
      - .github/diagnostics/wmtp-busy-68eda/**

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: wmtp-busy-68eda-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: WMTP Busy pinned Linux diagnostic
    if: >-
      ${{ github.event_name == 'push' &&
          github.repository == 'OPCFoundation/UA-.NETStandard' &&
          github.ref == 'refs/heads/marcschier-extract-remaining-shared-changes' &&
          github.run_attempt == 1 &&
          startsWith(github.event.head_commit.message, 'Run one pinned WMTP Busy diagnostic') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      NBGV_SetCloudBuildVersionVars: 'false'
      DIAGNOSTIC_DEFINITION_SHA: ${{ github.sha }}
    steps:
      - name: Checkout the diagnostic definition
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: definition
          persist-credentials: false
      - name: Checkout the immutable failing source
        uses: actions/checkout@v7
        with:
          ref: 68eda7f6e84baf6399f37d5da228fb950115fc42
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Setup the source-pinned SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Execute one guarded WMTP fixture
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & ./definition/.github/diagnostics/wmtp-busy-68eda/Run-Diagnostic.ps1
      - name: Retain restricted diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: wmtp-busy-68eda-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wmtp-busy-68eda-evidence
          if-no-files-found: error
          retention-days: 7

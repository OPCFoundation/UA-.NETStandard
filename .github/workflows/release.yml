name: Release to nuget.org

# Manual promotion of the exact signed package bytes produced by a successful
# nuget-publish.yml run on a canonical "release/<major>.<minor>" branch (e.g.
# release/2.0). The release environment and NuGet trusted publishing identity
# require administrator-verified ref restrictions and approval records.
# This workflow additionally requires the
# candidate's base package version to be an exact stable release (no
# prerelease label or build metadata, e.g. "2.0.0") - a preview candidate is
# already published automatically by nuget-publish.yml and must never be
# promoted here. See docs/ReleaseProcess.md ("Approved promotion") for the
# full procedure, including how to pick a release_run_id and how to recover
# from a partial or failed promotion.
#
# One-time nuget.org trusted publishing policy:
#   Repository Owner: OPCFoundation
#   Repository: UA-.NETStandard
#   Workflow File: release.yml
#   Environment: release

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful nuget-publish.yml run ID from a release/<major>.<minor> branch
        required: true
        type: string
      dry_run:
        description: Validate the selected package set without publishing
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: nuget-release
  cancel-in-progress: false

jobs:
  candidate-verification:
    name: Dormant read-only candidate verification
    if: ${{ false }}
    runs-on: windows-2025
    permissions:
      actions: read
      contents: read
    outputs:
      assessment_digest: ${{ steps.verify.outputs.assessment_digest }}
    steps:
      - name: Checkout protected controller, never candidate code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build protected verifier before candidate acquisition
        shell: pwsh
        run: dotnet build tools\Opc.Ua.ReleaseEvidence\Opc.Ua.ReleaseEvidence.csproj -c Release -f net10.0 --nologo
      - name: Require independently provisioned read-only candidate and trust inputs
        id: verify
        shell: pwsh
        run: |
          # Acquisition namespaces, access, current roots/checkpoints and grant records remain unconfigured.
          # Administrators must supply these outside the candidate; no dispatch parameter activates this path.
          .\.azurepipelines\release\promotion.ps1 -Operation Verify `
            -CandidateRoot "$env:RUNNER_TEMP\release-candidate" `
            -Evidence "$env:RUNNER_TEMP\release-candidate\evidence\release-evidence.json" `
            -Expected "$env:RUNNER_TEMP\release-candidate\expected.json" `
            -VerificationBundle "$env:RUNNER_TEMP\release-candidate\verification-bundle.json" `
            -Request "$env:RUNNER_TEMP\release-candidate\promotion-request.json" `
            -Work "$env:RUNNER_TEMP\release-verifier" -Output "$env:RUNNER_TEMP\promotion-assessment.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $digest = 'sha256:' + (Get-FileHash "$env:RUNNER_TEMP\promotion-assessment.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          "assessment_digest=$digest" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
      - name: Transfer immutable read-only assessment
        uses: actions/upload-artifact@v7
        with:
          name: dormant-promotion-assessment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-assessment.json
          if-no-files-found: error

  candidate-writer:
    name: Dormant isolated official writer
    if: ${{ false }}
    needs: candidate-verification
    runs-on: windows-2025
    environment: release
    concurrency:
      group: dormant-release-official-destination
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout protected controller, never candidate code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build protected writer before candidate acquisition
        shell: pwsh
        run: dotnet build tools\Opc.Ua.ReleaseEvidence\Opc.Ua.ReleaseEvidence.csproj -c Release -f net10.0 --nologo
      - name: Acquire read-only assessment
        uses: actions/download-artifact@v8
        with:
          name: dormant-promotion-assessment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-assessment
      - name: Reverify current authorization and exact bytes immediately before isolated writing
        shell: pwsh
        env:
          ASSESSMENT_DIGEST: ${{ needs.candidate-verification.outputs.assessment_digest }}
        run: |
          # Candidate acquisition and real registry lease/transport require the pending administrator handoff.
          # No registered official transport exists; neither this job nor a boolean can fabricate a grant.
          .\.azurepipelines\release\promotion.ps1 -Operation Write `
            -CandidateRoot "$env:RUNNER_TEMP\release-candidate" `
            -Evidence "$env:RUNNER_TEMP\release-candidate\evidence\release-evidence.json" `
            -Expected "$env:RUNNER_TEMP\release-candidate\expected.json" `
            -VerificationBundle "$env:RUNNER_TEMP\release-candidate\verification-bundle.json" `
            -Request "$env:RUNNER_TEMP\release-candidate\promotion-request.json" `
            -Assessment "$env:RUNNER_TEMP\release-assessment\promotion-assessment.json" `
            -AssessmentDigest $env:ASSESSMENT_DIGEST -Journal "$env:OPCUA_RELEASE_JOURNAL" `
            -Work "$env:RUNNER_TEMP\release-writer" -Output "$env:RUNNER_TEMP\promotion-result.json"

  publish:
    name: Promote signed packages
    if: ${{ github.repository == 'OPCFoundation/UA-.NETStandard' && startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: windows-2025
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
      packages: write

    steps:
      # Deliberately no checkout here. This job holds the release environment
      # plus packages:write and id-token:write, so no repository code may run
      # before the workspace is bound to the candidate's own commit - the
      # branch tip could otherwise have been changed after the candidate was
      # built and would execute with those credentials. The step below
      # therefore uses only the GitHub API and an inline branch-shape check,
      # and the first and only checkout is at the candidate SHA.
      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'

      - name: Validate selected publish run
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          if ($env:RELEASE_RUN_ID -notmatch '^\d+$') {
              throw 'release_run_id must be a numeric GitHub Actions run ID.'
          }

          $runJson = gh api "repos/$($env:GITHUB_REPOSITORY)/actions/runs/$env:RELEASE_RUN_ID"
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to read workflow run $env:RELEASE_RUN_ID."
          }
          $run = $runJson | ConvertFrom-Json

          $workflowJson = gh api (
              "repos/$($env:GITHUB_REPOSITORY)/actions/workflows/$($run.workflow_id)")
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to identify the workflow for run $env:RELEASE_RUN_ID."
          }
          $workflow = $workflowJson | ConvertFrom-Json

          if ($workflow.path -cne '.github/workflows/nuget-publish.yml') {
              throw "Run $env:RELEASE_RUN_ID belongs to '$($workflow.path)', not nuget-publish.yml."
          }
          if ($run.status -cne 'completed' -or $run.conclusion -cne 'success') {
              throw (
                  "Run $env:RELEASE_RUN_ID is not successful: " +
                  "status=$($run.status), conclusion=$($run.conclusion).")
          }
          if ($run.event -cnotin @('push', 'workflow_dispatch') -or
              $run.head_sha -cnotmatch '^[0-9a-f]{40}$' -or
              $run.run_attempt -lt 1 -or
              [string]$run.id -cne $env:RELEASE_RUN_ID) {
              throw 'The selected run has an invalid event, source, attempt or run identity.'
          }
          if (-not $run.head_branch.StartsWith(
              'release/',
              [StringComparison]::OrdinalIgnoreCase)) {
              throw (
                  "Run $env:RELEASE_RUN_ID came from '$($run.head_branch)'. " +
                  'Only release/* branches can be promoted.')
          }
          # Inlined on purpose rather than dot-sourced from
          # .azurepipelines/nuget/package-version-policy.ps1: nothing from the
          # repository may execute before the candidate checkout below. This
          # is the same shape as Test-CanonicalReleaseBranchRef, and
          # PackageVersionPolicyTests pins the two together so they cannot
          # drift apart.
          if ("refs/heads/$($run.head_branch)" -notmatch '(?-i)^refs/heads/release/(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              throw (
                  "Run $env:RELEASE_RUN_ID came from '$($run.head_branch)', which is not a " +
                  "canonical release/<major>.<minor> branch (for example release/2.0). Only " +
                  'that naming may be promoted; see docs/ReleaseProcess.md.')
          }
          if ($env:GITHUB_REF -cne "refs/heads/$($run.head_branch)") {
              throw (
                  "This release.yml dispatch runs from '$($env:GITHUB_REF)', but the selected " +
                  "candidate was built from 'refs/heads/$($run.head_branch)'. Dispatch " +
                  'release.yml from that exact canonical release branch so the validation ' +
                  'policy and promotion code are source-bound to the candidate.')
          }
          if ($run.head_repository.full_name -cne $env:GITHUB_REPOSITORY) {
              throw (
                  "Run $env:RELEASE_RUN_ID came from '$($run.head_repository.full_name)', " +
                  "not '$($env:GITHUB_REPOSITORY)'.")
          }

          "commit=$($run.head_sha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "branch=$($run.head_branch)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "attempt=$($run.run_attempt)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "definition=$($run.head_sha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "artifact=opcua-packages-$env:RELEASE_RUN_ID" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host (
              "Selected successful nuget-publish.yml run $env:RELEASE_RUN_ID " +
              "for $($run.head_branch) at $($run.head_sha).")

      - name: Check out the candidate commit
        # First and only checkout, and deliberately after the validation step
        # above: the dispatch ref pins a branch, not a commit, so checking out
        # the branch tip would let a commit that landed after the candidate was
        # built supply the promotion logic. Binding to the candidate's own SHA
        # makes the validator, the policy scripts and the package bytes all
        # describe the same source.
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.commit }}

      - name: Download signed promotion artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.release_run_id }}
          name: ${{ steps.source.outputs.artifact }}
          path: promotion

      - name: Validate promotion manifest and package bytes
        shell: pwsh
        env:
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_BRANCH: ${{ steps.source.outputs.branch }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          . ./.azurepipelines/nuget/package-version-policy.ps1
          $manifestPath = 'promotion/release-manifest.json'
          if (-not (Test-Path -LiteralPath $manifestPath)) {
              throw "The selected run artifact contains no release-manifest.json."
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $expectedRef = "refs/heads/$($env:RELEASE_BRANCH)"
          if (($manifest.schemaVersion -ne 1 -and $manifest.schemaVersion -ne 2) -or
              $manifest.repository -cne $env:GITHUB_REPOSITORY -or
              $manifest.workflow -cne '.github/workflows/nuget-publish.yml' -or
              $manifest.runId -cne $env:RELEASE_RUN_ID -or
              $manifest.ref -cne $expectedRef -or
              $manifest.commit -cne $env:RELEASE_COMMIT) {
              throw (
                  "The promotion manifest does not match nuget-publish.yml run " +
                  "$($env:RELEASE_RUN_ID) on $expectedRef.")
          }
          $expectedBaseVersion = if ($manifest.schemaVersion -eq 2) {
              $manifest.basePackageVersion
          }
          else {
              $manifest.packageVersion
          }

          # This workflow exists solely to promote a stable release (e.g.
          # "2.0.0", "2.0.1", "2.1.0") to nuget.org. In-development preview
          # candidates are already published automatically by
          # nuget-publish.yml and must never be promoted here. See
          # docs/ReleaseProcess.md ("Approved promotion").
          if (-not (Test-StablePackageVersion -Version $expectedBaseVersion)) {
              throw (
                  "Run $($env:RELEASE_RUN_ID) produced base version " +
                  "'$expectedBaseVersion', which is not an exact stable release. Only a " +
                  'stable candidate (no prerelease label or build metadata) may be ' +
                  'promoted through this workflow.')
          }
          if (-not (Test-CanonicalReleaseBranchForPackageVersion `
              -Ref $expectedRef `
              -Version $expectedBaseVersion)) {
              throw (
                  "Candidate version '$expectedBaseVersion' does not match release branch " +
                  "'$expectedRef'. A stable M.m.p candidate must be promoted only from " +
                  'the matching release/M.m branch.')
          }

          $currentPath = 'promotion/current-package-set.json'
          ./.azurepipelines/nuget/validate-package-set.ps1 `
            -PackageDirectory promotion `
            -ManifestPath $currentPath `
            -MetadataPath promotion\archive-metadata.json `
            -ExpectedVersion $expectedBaseVersion `
            -RequireDebug `
            -VerifySignatures
          $current = Get-Content -LiteralPath $currentPath -Raw | ConvertFrom-Json

          if ($current.packageCount -ne $manifest.packageCount -or
              $current.symbolPackageCount -ne $manifest.symbolPackageCount -or
              $current.debugPackageCount -ne $manifest.debugPackageCount) {
              throw 'The downloaded package counts do not match the promotion manifest.'
          }

          $expectedArchives = @($manifest.archives | Sort-Object id, type, file) |
              ConvertTo-Json -Depth 5 -Compress
          $actualArchives = @($current.archives | Sort-Object id, type, file) |
              ConvertTo-Json -Depth 5 -Compress
          if ($actualArchives -cne $expectedArchives) {
              throw 'The downloaded package names, identities, versions, or hashes have changed.'
          }

          Write-Host (
              "Validated $($current.packageCount) exact package bytes at version " +
              "$($current.basePackageVersion) from run $($env:RELEASE_RUN_ID).")

      - name: Verify preview package ordering
        # Last gate before an irreversible publication: the preview-only
        # families carry the number committed in preview-version.props, which
        # cannot track the growing "-preview.<height>" series that ordinary
        # development publishes. Re-prove the ordering here (including on a
        # dry run) rather than trusting that nothing was published between
        # candidate creation and approval. See docs/ReleaseProcess.md.
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.azurepipelines/nuget/validate-preview-package-ordering.ps1 `
            -ManifestPath 'promotion/current-package-set.json'

      - name: Verify already-published package identity
        # "--skip-duplicate" below makes a failed promotion recoverable by
        # re-running the same candidate, but on its own it accepts *any*
        # pre-existing id/version as a successful no-op. Prove first that every
        # version this candidate already occupies really is this candidate's,
        # so a foreign build that claimed an immutable version can never be
        # mistaken for a completed publication. Runs on a dry run too: it is
        # read-only and is exactly what a rehearsal should establish.
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.azurepipelines/nuget/assert-published-packages-match.ps1 `
            -PackageDirectory promotion `
            -ManifestPath 'promotion/current-package-set.json' `
            -Feed 'nuget.org' `
            -ExcludeDebugPackages
          ./.azurepipelines/nuget/assert-published-packages-match.ps1 `
            -PackageDirectory promotion `
            -ManifestPath 'promotion/current-package-set.json' `
            -Feed 'GitHub Packages'

      - name: Prepare offline evidence reader
        shell: pwsh
        run: |
          .\.azurepipelines\nuget\evidence.ps1 -Operation PrepareTool `
            -Work "$env:RUNNER_TEMP\nuget-reader" -Output promotion\reader-report.json

      - name: Refresh same-source assurance for promotion
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .\.azurepipelines\nuget\evidence.ps1 -Operation Assurance -Packages promotion `
            -Output promotion\assurance -Work "$env:RUNNER_TEMP\nuget-release-assurance"

      - name: Preflight against current controller policy
        shell: pwsh
        env:
          SOURCE_SHA: ${{ steps.source.outputs.commit }}
          SOURCE_REF: refs/heads/${{ steps.source.outputs.branch }}
          SOURCE_RUN_ID: ${{ inputs.release_run_id }}
          SOURCE_ATTEMPT: ${{ steps.source.outputs.attempt }}
          SOURCE_DEFINITION_SHA: ${{ steps.source.outputs.definition }}
        run: |
          .\.azurepipelines\nuget\evidence.ps1 -Operation Preflight -Packages promotion `
            -Expected promotion\evidence\producer-context.json `
            -Destination NugetOrg -Output promotion\preflight.json `
            -Work "$env:RUNNER_TEMP\nuget-preflight"

      - name: NuGet login
        if: ${{ !inputs.dry_run }}
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packages = @(Get-ChildItem promotion -Filter '*.nupkg' -File |
              Where-Object {
                  $archive = [IO.Compression.ZipFile]::OpenRead($_.FullName)
                  try {
                      $nuspec = @($archive.Entries | Where-Object {
                          $_.FullName -notmatch '/' -and $_.FullName.EndsWith('.nuspec')
                      })
                      if ($nuspec.Count -ne 1) {
                          throw "Unable to identify package '$($_.Name)'."
                      }
                      $reader = [IO.StreamReader]::new($nuspec[0].Open())
                      try {
                          [xml]$metadata = $reader.ReadToEnd()
                      }
                      finally {
                          $reader.Dispose()
                      }

                      $id = [string]$metadata.package.metadata.id
                      -not $id.EndsWith(
                          '.Debug',
                          [StringComparison]::OrdinalIgnoreCase)
                  }
                  finally {
                      $archive.Dispose()
                  }
              } |
              Sort-Object Name)
          if ($packages.Count -eq 0) {
              throw 'The stable candidate contains no non-Debug packages to push to nuget.org.'
          }
          Write-Host (
              "Publishing $($packages.Count) non-Debug package(s) to nuget.org. " +
              'Debug package IDs remain in the signed candidate artifact and are ' +
              'published only to GitHub Packages.')
          .\.azurepipelines\nuget\evidence.ps1 -Operation Receipt -Packages promotion `
            -Output promotion\nugetorg-receipt.json -Destination NugetOrg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($package in $packages) {
              .\.azurepipelines\nuget\evidence.ps1 -Operation Receipt -Packages promotion `
                -Output promotion\nugetorg-receipt.json -Destination NugetOrg `
                -File $package.Name -State attempting
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              # --skip-duplicate keeps a partially completed promotion
              # re-runnable. The preflight above rejects a foreign existing
              # package; the post-push verification below closes the remaining
              # race where another publisher claims the version between that
              # check and this push.
              dotnet nuget push $package.FullName `
                --source 'https://api.nuget.org/v3/index.json' `
                --symbol-source 'https://api.nuget.org/v3/index.json' `
                --api-key $env:NUGET_API_KEY `
                --skip-duplicate
              $pushCode = $LASTEXITCODE
              $state = if ($pushCode -eq 0) { 'push-accepted-or-duplicate' } else { 'push-failed' }
              .\.azurepipelines\nuget\evidence.ps1 -Operation Receipt -Packages promotion `
                -Output promotion\nugetorg-receipt.json -Destination NugetOrg `
                -File $package.Name -State $state
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              if ($pushCode -ne 0) {
                  throw "nuget.org push failed for '$($package.Name)'."
              }
          }
          ./.azurepipelines/nuget/assert-published-packages-match.ps1 `
            -PackageDirectory promotion `
            -ManifestPath 'promotion/current-package-set.json' `
            -Feed 'nuget.org' `
            -ExcludeDebugPackages `
            -RequirePresent

      - name: Push to GitHub Packages
        # nuget-publish.yml deliberately never pushes a stable candidate to
        # any feed automatically (see its "Skip feed publication" step); this
        # is the one place a stable release also gets mirrored to GitHub
        # Packages, gated behind the same approval and dry-run switch as the
        # nuget.org push above.
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub Packages retains the complete signed candidate, including
          # .Debug package IDs. Public nuget.org releases above intentionally
          # exclude them; see docs/ReleaseProcess.md.
          $packages = @(Get-ChildItem promotion -Filter '*.nupkg' -File | Sort-Object Name)
          .\.azurepipelines\nuget\evidence.ps1 -Operation Receipt -Packages promotion `
            -Output promotion\githubpackages-receipt.json -Destination GitHubPackages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($package in $packages) {
              .\.azurepipelines\nuget\evidence.ps1 -Operation Receipt -Packages promotion `
                -Output promotion\githubpackages-receipt.json -Destination GitHubPackages `
                -File $package.Name -State attempting
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              # As above, the preflight and post-push checks jointly prove that
              # a duplicate is this candidate rather than a package published
              # in the check-then-push window.
              dotnet nuget push $package.FullName `
                --source 'https://nuget.pkg.github.com/OPCFoundation/index.json' `
                --api-key $env:GITHUB_PACKAGES_TOKEN `
                --skip-duplicate `
                --no-symbols
              $pushCode = $LASTEXITCODE
              $state = if ($pushCode -eq 0) { 'push-accepted-or-duplicate' } else { 'push-failed' }
              .\.azurepipelines\nuget\evidence.ps1 -Operation Receipt -Packages promotion `
                -Output promotion\githubpackages-receipt.json -Destination GitHubPackages `
                -File $package.Name -State $state
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              if ($pushCode -ne 0) {
                  throw "GitHub Packages push failed for '$($package.Name)'."
              }
          }
          ./.azurepipelines/nuget/assert-published-packages-match.ps1 `
            -PackageDirectory promotion `
            -ManifestPath 'promotion/current-package-set.json' `
            -Feed 'GitHub Packages' `
            -GitHubToken $env:GITHUB_PACKAGES_TOKEN `
            -RequirePresent

      - name: Verify feed delivery read-only
        if: ${{ always() && !inputs.dry_run && hashFiles('promotion/nugetorg-receipt.json') != '' }}
        shell: pwsh
        run: |
          .\.azurepipelines\nuget\evidence.ps1 -Operation VerifyFeed -Packages promotion `
            -Destination NugetOrg -Output promotion\nugetorg-receipt.json `
            -Work "$env:RUNNER_TEMP\nuget-feed"

      - name: Attach sanitized evidence to an existing matching release
        if: ${{ success() && !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .\.azurepipelines\nuget\evidence.ps1 -Operation Attach -Packages promotion `
            -Output promotion\attachment-report.json -Work "$env:RUNNER_TEMP\nuget-attachments"

      - name: Retain preflight and partial delivery receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nuget-promotion-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            promotion/preflight.json
            promotion/reader-report.json
            promotion/nugetorg-receipt.json
            promotion/nugetorg-receipt.json.events/*.json
            promotion/nugetorg-receipt.json.evidence/*.json
            promotion/nugetorg-receipt.json.incomplete.json
            promotion/githubpackages-receipt.json
            promotion/githubpackages-receipt.json.events/*.json
            promotion/githubpackages-receipt.json.incomplete.json
            promotion/attachment-report.json
            promotion/assurance/*.json
            promotion/assurance.incomplete.json
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        if: always()
        shell: pwsh
        env:
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_BRANCH: ${{ steps.source.outputs.branch }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $manifestPath = 'promotion/release-manifest.json'
          if (Test-Path -LiteralPath $manifestPath) {
              $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
              $version = if ($manifest.schemaVersion -eq 2) {
                  $manifest.basePackageVersion
              }
              else {
                  $manifest.packageVersion
              }
              $count = $manifest.packageCount
          }
          else {
              $version = 'unavailable'
              $count = 'unavailable'
          }
          @"
          ### nuget.org release


name: Release to nuget.org

# Manual promotion of the exact signed package bytes produced by a successful
# nuget-publish.yml run on a canonical "release/<major>.<minor>" branch (e.g.
# release/2.0). The release environment provides the approval boundary (its
# deployment_branch_policy restricts execution to release/* branches) and the
# NuGet trusted publishing identity. This workflow additionally requires the
# candidate's base package version to be an exact stable release (no
# prerelease label or build metadata, e.g. "2.0.0") - a preview candidate is
# already published automatically by nuget-publish.yml and must never be
# promoted here. See docs/ReleaseProcess.md ("Approved promotion") for the
# full procedure, including how to pick a release_run_id and how to recover
# from a partial or failed promotion.
#
# One-time nuget.org trusted publishing policy:
#   Repository Owner: OPCFoundation
#   Repository: UA-.NETStandard
#   Workflow File: release.yml
#   Environment: release

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful nuget-publish.yml run ID from a release/<major>.<minor> branch
        required: true
        type: string
      dry_run:
        description: Validate the selected package set without publishing
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  id-token: write
  packages: write

concurrency:
  group: nuget-release
  cancel-in-progress: false

jobs:
  publish:
    name: Promote signed packages
    runs-on: windows-2025
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'

      - name: Validate selected publish run
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          if ($env:RELEASE_RUN_ID -notmatch '^\d+$') {
              throw 'release_run_id must be a numeric GitHub Actions run ID.'
          }

          $runJson = gh api "repos/${{ github.repository }}/actions/runs/$env:RELEASE_RUN_ID"
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to read workflow run $env:RELEASE_RUN_ID."
          }
          $run = $runJson | ConvertFrom-Json

          $workflowJson = gh api (
              "repos/${{ github.repository }}/actions/workflows/$($run.workflow_id)")
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to identify the workflow for run $env:RELEASE_RUN_ID."
          }
          $workflow = $workflowJson | ConvertFrom-Json

          if ($workflow.path -cne '.github/workflows/nuget-publish.yml') {
              throw "Run $env:RELEASE_RUN_ID belongs to '$($workflow.path)', not nuget-publish.yml."
          }
          if ($run.status -cne 'completed' -or $run.conclusion -cne 'success') {
              throw (
                  "Run $env:RELEASE_RUN_ID is not successful: " +
                  "status=$($run.status), conclusion=$($run.conclusion).")
          }
          if (-not $run.head_branch.StartsWith(
              'release/',
              [StringComparison]::OrdinalIgnoreCase)) {
              throw (
                  "Run $env:RELEASE_RUN_ID came from '$($run.head_branch)'. " +
                  'Only release/* branches can be promoted.')
          }
          . ./.azurepipelines/package-version-policy.ps1
          if (-not (Test-CanonicalReleaseBranchRef -Ref "refs/heads/$($run.head_branch)")) {
              throw (
                  "Run $env:RELEASE_RUN_ID came from '$($run.head_branch)', which is not a " +
                  "canonical release/<major>.<minor> branch (for example release/2.0). Only " +
                  'that naming may be promoted; see docs/ReleaseProcess.md.')
          }
          if ('${{ github.ref }}' -cne "refs/heads/$($run.head_branch)") {
              throw (
                  "This release.yml dispatch runs from '${{ github.ref }}', but the selected " +
                  "candidate was built from 'refs/heads/$($run.head_branch)'. Dispatch " +
                  'release.yml from that exact canonical release branch so the validation ' +
                  'policy and promotion code are source-bound to the candidate.')
          }
          if ($run.head_repository.full_name -cne '${{ github.repository }}') {
              throw (
                  "Run $env:RELEASE_RUN_ID came from '$($run.head_repository.full_name)', " +
                  "not '${{ github.repository }}'.")
          }

          "commit=$($run.head_sha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "branch=$($run.head_branch)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "artifact=opcua-packages-$env:RELEASE_RUN_ID" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host (
              "Selected successful nuget-publish.yml run $env:RELEASE_RUN_ID " +
              "for $($run.head_branch) at $($run.head_sha).")

      - name: Download signed promotion artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.release_run_id }}
          name: ${{ steps.source.outputs.artifact }}
          path: promotion

      - name: Validate promotion manifest and package bytes
        shell: pwsh
        run: |
          . ./.azurepipelines/package-version-policy.ps1
          $manifestPath = 'promotion/release-manifest.json'
          if (-not (Test-Path -LiteralPath $manifestPath)) {
              throw "The selected run artifact contains no release-manifest.json."
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $expectedRef = 'refs/heads/${{ steps.source.outputs.branch }}'
          if (($manifest.schemaVersion -ne 1 -and $manifest.schemaVersion -ne 2) -or
              $manifest.repository -cne '${{ github.repository }}' -or
              $manifest.workflow -cne '.github/workflows/nuget-publish.yml' -or
              $manifest.runId -cne '${{ inputs.release_run_id }}' -or
              $manifest.ref -cne $expectedRef -or
              $manifest.commit -cne '${{ steps.source.outputs.commit }}') {
              throw (
                  "The promotion manifest does not match nuget-publish.yml run " +
                  "${{ inputs.release_run_id }} on $expectedRef.")
          }
          $expectedBaseVersion = if ($manifest.schemaVersion -eq 2) {
              $manifest.basePackageVersion
          }
          else {
              $manifest.packageVersion
          }

          # This workflow exists solely to promote a stable release (e.g.
          # "2.0.0", "2.0.1", "2.1.0") to nuget.org. In-development preview
          # candidates are already published automatically by
          # nuget-publish.yml and must never be promoted here. See
          # docs/ReleaseProcess.md ("Approved promotion").
          if (-not (Test-StablePackageVersion -Version $expectedBaseVersion)) {
              throw (
                  "Run ${{ inputs.release_run_id }} produced base version " +
                  "'$expectedBaseVersion', which is not an exact stable release. Only a " +
                  'stable candidate (no prerelease label or build metadata) may be ' +
                  'promoted through this workflow.')
          }
          if (-not (Test-CanonicalReleaseBranchForPackageVersion `
              -Ref $expectedRef `
              -Version $expectedBaseVersion)) {
              throw (
                  "Candidate version '$expectedBaseVersion' does not match release branch " +
                  "'$expectedRef'. A stable M.m.p candidate must be promoted only from " +
                  'the matching release/M.m branch.')
          }

          $currentPath = 'promotion/current-package-set.json'
          ./.azurepipelines/validate-nuget-package-set.ps1 `
            -PackageDirectory promotion `
            -ManifestPath $currentPath `
            -ExpectedVersion $expectedBaseVersion `
            -RequireDebug `
            -VerifySignatures
          $current = Get-Content -LiteralPath $currentPath -Raw | ConvertFrom-Json

          if ($current.packageCount -ne $manifest.packageCount -or
              $current.symbolPackageCount -ne $manifest.symbolPackageCount -or
              $current.debugPackageCount -ne $manifest.debugPackageCount) {
              throw 'The downloaded package counts do not match the promotion manifest.'
          }

          $expectedArchives = @($manifest.archives | Sort-Object id, type, file) |
              ConvertTo-Json -Depth 5 -Compress
          $actualArchives = @($current.archives | Sort-Object id, type, file) |
              ConvertTo-Json -Depth 5 -Compress
          if ($actualArchives -cne $expectedArchives) {
              throw 'The downloaded package names, identities, versions, or hashes have changed.'
          }

          Write-Host (
              "Validated $($current.packageCount) exact package bytes at version " +
              "$($current.basePackageVersion) from run ${{ inputs.release_run_id }}.")

      - name: Verify preview package ordering
        # Last gate before an irreversible publication: the preview-only
        # families carry the number committed in preview-version.props, which
        # cannot track the growing "-preview.<height>" series that ordinary
        # development publishes. Re-prove the ordering here (including on a
        # dry run) rather than trusting that nothing was published between
        # candidate creation and approval. See docs/ReleaseProcess.md.
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.azurepipelines/validate-preview-package-ordering.ps1 `
            -ManifestPath 'promotion/current-package-set.json'

      - name: NuGet login
        if: ${{ !inputs.dry_run }}
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packages = @(Get-ChildItem promotion -Filter '*.nupkg' -File |
              Where-Object {
                  $archive = [IO.Compression.ZipFile]::OpenRead($_.FullName)
                  try {
                      $nuspec = @($archive.Entries | Where-Object {
                          $_.FullName -notmatch '/' -and $_.FullName.EndsWith('.nuspec')
                      })
                      if ($nuspec.Count -ne 1) {
                          throw "Unable to identify package '$($_.Name)'."
                      }
                      $reader = [IO.StreamReader]::new($nuspec[0].Open())
                      try {
                          [xml]$metadata = $reader.ReadToEnd()
                      }
                      finally {
                          $reader.Dispose()
                      }

                      $id = [string]$metadata.package.metadata.id
                      -not $id.EndsWith(
                          '.Debug',
                          [StringComparison]::OrdinalIgnoreCase)
                  }
                  finally {
                      $archive.Dispose()
                  }
              } |
              Sort-Object Name)
          if ($packages.Count -eq 0) {
              throw 'The stable candidate contains no non-Debug packages to push to nuget.org.'
          }
          Write-Host (
              "Publishing $($packages.Count) non-Debug package(s) to nuget.org. " +
              'Debug package IDs remain in the signed candidate artifact and are ' +
              'published only to GitHub Packages.')
          foreach ($package in $packages) {
              dotnet nuget push $package.FullName `
                --source 'https://api.nuget.org/v3/index.json' `
                --symbol-source 'https://api.nuget.org/v3/index.json' `
                --api-key '${{ steps.login.outputs.NUGET_API_KEY }}' `
                --skip-duplicate
              if ($LASTEXITCODE -ne 0) {
                  throw "nuget.org push failed for '$($package.Name)'."
              }
          }

      - name: Push to GitHub Packages
        # nuget-publish.yml deliberately never pushes a stable candidate to
        # any feed automatically (see its "Skip feed publication" step); this
        # is the one place a stable release also gets mirrored to GitHub
        # Packages, gated behind the same approval and dry-run switch as the
        # nuget.org push above.
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        run: |
          # GitHub Packages retains the complete signed candidate, including
          # .Debug package IDs. Public nuget.org releases above intentionally
          # exclude them; see docs/ReleaseProcess.md.
          $packages = @(Get-ChildItem promotion -Filter '*.nupkg' -File | Sort-Object Name)
          foreach ($package in $packages) {
              dotnet nuget push $package.FullName `
                --source 'https://nuget.pkg.github.com/OPCFoundation/index.json' `
                --api-key '${{ secrets.GITHUB_TOKEN }}' `
                --skip-duplicate `
                --no-symbols
              if ($LASTEXITCODE -ne 0) {
                  throw "GitHub Packages push failed for '$($package.Name)'."
              }
          }

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $manifestPath = 'promotion/release-manifest.json'
          if (Test-Path -LiteralPath $manifestPath) {
              $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
              $version = if ($manifest.schemaVersion -eq 2) {
                  $manifest.basePackageVersion
              }
              else {
                  $manifest.packageVersion
              }
              $count = $manifest.packageCount
          }
          else {
              $version = 'unavailable'
              $count = 'unavailable'
          }
          @"
          ### nuget.org release

          - Source run: ``${{ inputs.release_run_id }}``
          - Source branch: ``${{ steps.source.outputs.branch }}``
          - Version: ``$version``
          - Packages: ``$count``
          - Dry run: ``${{ inputs.dry_run }}``
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

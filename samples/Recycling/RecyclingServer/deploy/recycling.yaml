# One replica per role. Provision trust and user identities before starting production.
apiVersion: v1
kind: Namespace
metadata:
  name: recycling-sample
---
apiVersion: v1
kind: Service
metadata:
  name: recycling-coordinator
  namespace: recycling-sample
  labels: &id001
    app.kubernetes.io/name: recycling-sample
    app.kubernetes.io/component: coordinator
spec:
  clusterIP: None
  selector: *id001
  ports:
  - name: opc-tcp
    port: 62570
    targetPort: opc-tcp
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: recycling-coordinator
  namespace: recycling-sample
  labels: &id001
    app.kubernetes.io/name: recycling-sample
    app.kubernetes.io/component: coordinator
spec:
  serviceName: recycling-coordinator
  replicas: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
      containers:
      - name: server
        image: recycling-server:local
        imagePullPolicy: IfNotPresent
        args:
        - --role
        - coordinator
        - --line-id
        - line-1
        - --endpoint
        - opc.tcp://recycling-coordinator:62570/Recycling
        - --identities
        - /config/identities.json
        - --pki-root
        - /data/pki
        - --state-root
        - /data/state
        ports:
        - name: opc-tcp
          containerPort: 62570
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        startupProbe:
          tcpSocket:
            port: opc-tcp
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: opc-tcp
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: opc-tcp
          periodSeconds: 10
          failureThreshold: 6
        volumeMounts:
        - name: data
          mountPath: /data
        - name: identities
          mountPath: /config
          readOnly: true
        - name: temporary
          mountPath: /tmp
      volumes:
      - name: identities
        configMap:
          name: recycling-identities
      - name: temporary
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---

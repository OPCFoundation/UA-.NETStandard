name: recycling-sample

x-common: &common
  image: ${RECYCLING_IMAGE:-recycling-server:local}
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  restart: on-failure

x-view: &view
  <<: *common
  depends_on: [coordinator]

services:
  coordinator:
    <<: *common
    hostname: recycling-coordinator
    build:
      context: ../../..
      dockerfile: samples/Recycling/RecyclingServer/Dockerfile
    command:
      - "--role"
      - "coordinator"
      - "--line-id"
      - "line-1"
      - "--endpoint"
      - "opc.tcp://recycling-coordinator:62570/Recycling"
      - "--identities"
      - "/config/identities.json"
      - "--pki-root"
      - "/data/pki"
      - "--state-root"
      - "/data/state"
    ports: ["127.0.0.1:62570:62570"]
    volumes:
      - "${RECYCLING_DATA_DIR:?Set an absolute provisioned directory outside the repository}/identities.json:/config/identities.json:ro"
      - "${RECYCLING_DATA_DIR}/coordinator:/data"

  collection:
    <<: *view
    hostname: recycling-collection
    command:
      - "--process"
      - "collection"
      - "--line-id"
      - "line-1"
      - "--endpoint"
      - "opc.tcp://recycling-collection:62570/Recycling"
      - "--coordinator"
      - "opc.tcp://recycling-coordinator:62570/Recycling"
      - "--identities"
      - "/config/identities.json"
      - "--pki-root"
      - "/data/pki"
      - "--state-root"
      - "/data/state"
      - "--identity-store"
      - "/data/users"
      - "--identity-subject"
      - "CN=Recycling-line-1-collection"
    ports: ["127.0.0.1:62571:62570"]
    volumes:
      - "${RECYCLING_DATA_DIR}/identities.json:/config/identities.json:ro"
      - "${RECYCLING_DATA_DIR}/collection:/data"


apiVersion: v1
kind: ConfigMap
metadata:
  name: stub-inference-backend
  labels:
    app.kubernetes.io/name: stub-inference-backend
data:
  # A minimal OpenAI-compatible endpoint. This is a TEST FIXTURE, not part of the
  # sample: it exists so a cluster smoke test can prove the whole path - OPC UA
  # client, Server, backend, HTTP and back - without a hosted service or a local
  # model runtime. Nothing here should be copied into anything real.
  server.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def _send(self, payload):
            body = json.dumps(payload).encode("utf-8")
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            self._send({"data": [{"id": "smoke-model", "object": "model",
                                  "owned_by": "smoke"}]})

        def do_POST(self):
            self.rfile.read(int(self.headers.get("Content-Length", "0")))
            self._send({
                "id": "chatcmpl-smoke",
                "model": "smoke-model",
                "choices": [{"index": 0, "finish_reason": "stop",
                             "message": {"role": "assistant",
                                         "content": "SMOKE-TEST-OK"}}],
                "usage": {"prompt_tokens": 3, "completion_tokens": 4,
                          "total_tokens": 7},
            })

        def log_message(self, fmt, *args):
            pass

    HTTPServer(("0.0.0.0", 5273), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stub-inference-backend
  labels:
    app.kubernetes.io/name: stub-inference-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stub-inference-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stub-inference-backend
    spec:
      containers:
        - name: stub
          image: python:3.13-alpine
          command: ["python", "/app/server.py"]
          ports:
            - name: http
              containerPort: 5273
          volumeMounts:
            - name: script
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
      volumes:
        - name: script
          configMap:
            name: stub-inference-backend
---
apiVersion: v1
kind: Service
metadata:
  name: stub-inference-backend
  labels:
    app.kubernetes.io/name: stub-inference-backend
spec:
  ports:
    - port: 5273
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: stub-inference-backend

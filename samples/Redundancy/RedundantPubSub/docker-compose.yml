services:
  demo:
    profiles: [isolated-demo]
    build:
      context: ../../..
      dockerfile: samples/Redundancy/RedundantPubSub/Dockerfile
    network_mode: none
    environment:
      HA_INSECURE: ${HA_INSECURE:-false}
    command: ["--role", "demo", "--ha-mode", "hot"]

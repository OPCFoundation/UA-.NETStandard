services:
  server:
    profiles: [isolated-demo]
    build:
      context: ../../..
      dockerfile: samples/Redundancy/RedundantServer/Dockerfile
    network_mode: none
    environment:
      HA_INSECURE: ${HA_INSECURE:-false}
      HA_HOST: 127.0.0.1
      REDUNDANCY_MODE: none
  client:
    profiles: [isolated-demo]
    build:
      context: ../../..
      dockerfile: samples/Redundancy/RedundantClient/Dockerfile
    network_mode: service:server
    depends_on: [server]
    environment:
      HA_INSECURE: ${HA_INSECURE:-false}
    command: ["--server", "opc.tcp://127.0.0.1:62543/RedundantServer", "--nosecurity", "--duration", "00:02:00"]

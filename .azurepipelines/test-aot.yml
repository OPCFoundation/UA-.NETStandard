#
# Test Opc.Ua.Aot.Tests with native AOT publish using Microsoft Testing Platform
#
parameters:
- name: configuration
  type: string
  default: 'Release'
- name: agents
  type: string
  default: '@{}'
- name: jobnamesuffix
  type: string
  default: ''
# Set hosted=true to force all jobs in this template invocation onto
# Microsoft-hosted agents (bypasses the netstandard managed DevOps pool).
# Use this for stages that target macOS, which the managed pool does not
# provide.
- name: hosted
  type: boolean
  default: false
# See ci.yml: passing pool config via parameters because root-pipeline
# variables defined in ${{ if ... }}: blocks aren't reliably visible to
# included templates at compile-time.
- name: poolName
  type: string
  default: ''
- name: windowsImage
  type: string
  default: 'windows-2025-vs2026'
jobs:
- job: testaotprep${{ parameters.jobnamesuffix }}
  displayName: Prepare AoT Test Jobs ${{ parameters.configuration }}
  pool:
    ${{ if ne(parameters.poolName, '') }}:
      name: ${{ parameters.poolName }}
      demands:
        - ImageOverride -equals ${{ parameters.windowsImage }}
    ${{ else }}:
      vmImage: ${{ parameters.windowsImage }}
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: true
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  steps:
  - task: PowerShell@2
    name: aotmatrix
    displayName: Prepare AoT Tests
    inputs:
      targetType: filePath
      filePath: ./.azurepipelines/get-matrix.ps1
      arguments: -FileName Opc.Ua.Aot.Tests*.csproj -AgentTable ${{ parameters.agents }}
- job: testaot${{ parameters.jobnamesuffix }}
  displayName: AoT Tests
  dependsOn: testaotprep${{ parameters.jobnamesuffix }}
  timeoutInMinutes: 60
  strategy:
    matrix: $[dependencies.testaotprep${{ parameters.jobnamesuffix }}.outputs['aotmatrix.jobMatrix'] ]
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: true
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  pool:
    ${{ if and(ne(parameters.poolName, ''), not(parameters.hosted)) }}:
      name: ${{ parameters.poolName }}
      demands:
        - ImageOverride -equals $(poolImage)
    ${{ else }}:
      vmImage: $(poolImage)
  steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 10.0'
    inputs:
      packageType: 'sdk'
      version: '10.0.x'
  - task: NuGetToolInstaller@1
    inputs:
      versionSpec: '>=7.0.x'
  - task: PowerShell@2
    displayName: Versioning
    inputs:
      targetType: filePath
      filePath: ./.azurepipelines/set-version.ps1
  - task: PowerShell@2
    displayName: Publish and independently observe native execution
    inputs:
      pwsh: true
      targetType: inline
      script: |
        $arch = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
        $rid = if ($IsWindows) { "win-$arch" } elseif ($IsMacOS) { "osx-$arch" } else { "linux-$arch" }
        ./.azurepipelines/assurance/native.ps1 -Project '$(file)' -RuntimeIdentifier $rid `
          -Configuration '${{ parameters.configuration }}' `
          -WorkDirectory '$(Build.SourcesDirectory)/.assurance/aot-$(Build.BuildId)-$(System.JobAttempt)-$(System.JobId)' `
          -OutputPath '$(Build.SourcesDirectory)/.assurance/aot-public-$(System.JobId)/native-proof.json'
        exit $LASTEXITCODE
  - task: PowerShell@2
    displayName: Record native proof without claiming definition-chain verification
    condition: succeededOrFailed()
    inputs:
      pwsh: true
      targetType: filePath
      filePath: ./.azurepipelines/assurance/write-job.ps1
      arguments: -Project "$(file)" -ResultsPath "$(Build.SourcesDirectory)/.assurance/aot-public-$(System.JobId)/native-proof.json" -Kind native-aot -OutputPath "$(Build.SourcesDirectory)/.assurance/aot-public-$(System.JobId)/evidence.job.json" -Workflow azure-pipelines.yml -Configuration "${{ parameters.configuration }}"
  - task: PublishPipelineArtifact@1
    displayName: Publish sanitized native proof only
    condition: succeededOrFailed()
    inputs:
      targetPath: '$(Build.SourcesDirectory)/.assurance/aot-public-$(System.JobId)'
      artifact: 'assurance-native-aot-$(Build.BuildId)-$(System.JobAttempt)-$(System.JobId)'

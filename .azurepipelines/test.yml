#
# Test all .Net Core projects on all platforms
#
parameters:
- name: configuration
  type: string
  default: 'Release'
- name: framework
  type: string
  default: net8.0
- name: agents
  type: string
  default: '@{}'
- name: jobnamesuffix
  type: string
  default: ''
- name: customtestarget
  type: string
  default: ''
# Test project discovery.  The defaults fan out over every *.Tests.csproj except
# the tiers that are deliberately kept out of mainline CI (see #3810): AoT has
# its own stage, and the stress / durable tiers run nightly.
- name: projectfilename
  type: string
  default: '*.Tests.csproj'
- name: excludeprojects
  type: string
  default: 'Opc.Ua.Aot.Tests.csproj,Opc.Ua.Stress.Tests.csproj,Opc.Ua.Subscriptions.Durable.Tests.csproj'
# NUnit category filter passed to 'dotnet test'.  The default keeps the
# long-running and stress tiers out of the fast legs; pass an empty string to
# run everything (used by the scheduled long-running stage).
- name: testfilter
  type: string
  default: 'TestCategory!=LongRunning&TestCategory!=Stress'
# --blame-hang-timeout for a single test.  Raise it together with testfilter
# when a leg deliberately includes the long-running tier.
- name: hangtimeout
  type: string
  default: '10m'
# Set hosted=true to force all jobs in this template invocation onto
# Microsoft-hosted agents (bypasses the netstandard managed DevOps pool).
# Use this for stages that target macOS, which the managed pool does not
# provide.
- name: hosted
  type: boolean
  default: false
# See ci.yml: passing pool config via parameters because root-pipeline
# variables defined in ${{ if ... }}: blocks aren't reliably visible to
# included templates at compile-time.
- name: poolName
  type: string
  default: ''
- name: windowsImage
  type: string
  default: 'windows-2025-vs2026'
# Optional job-level condition forwarded to the testprep…, testall… and
# coverage… jobs.
# When unset (the overwhelming majority of callers) no `condition:` line is
# emitted - preserves today's "always run" behaviour exactly.  When set, all
# jobs receive the same condition so the entire test invocation is gated
# together (used by the root pipeline to skip macOS test invocations on draft
# GitHub PRs).  Pass the condition *bare*, without a succeeded() wrapper: the
# test jobs wrap it in succeeded() so a build cancellation still propagates to
# them - without the wrapper an Azure Pipelines `condition:` re-evaluates to
# true during cancel and the job keeps running (see "Job will continue running
# after cancellation was requested because its condition re-evaluated to true"
# warnings) - while the coverage gate wraps it in not(canceled()) because it has
# to report a failed status check when the tests failed.
- name: condition
  type: string
  default: ''
# Collect code coverage in every test job of this invocation and append a
# 'Coverage ...' job that merges the per-project Cobertura reports published by
# those jobs and runs check-coverage.ps1 against the merged result.  The gate
# job is the single per-(framework, configuration) signal used as the required
# GitHub status check: it fails when any test job failed, and when the merged
# coverage misses the thresholds, so the tests never have to be re-run.
- name: coverage
  type: boolean
  default: true
# Blocking (true) vs advisory (false) coverage thresholds.  Test failures always
# block regardless of this switch.
- name: enforceCoverage
  type: boolean
  default: false
# Publish the merged report to the build's Code Coverage tab and to Codacy.
# Exactly one invocation per pipeline run may set this - Azure DevOps keeps a
# single code-coverage summary per build, so a second publish overwrites the
# first.
- name: publishCoverage
  type: boolean
  default: false
# Pool for the coverage gate job.  The gate only merges XML and diffs git, so it
# is deliberately decoupled from the framework under test and runs on Linux.
- name: coveragePoolName
  type: string
  default: ''
- name: coverageImage
  type: string
  default: 'ubuntu-24.04'
jobs:
- job: testprep${{ parameters.jobnamesuffix }}
  displayName: Prepare Test Jobs ${{ parameters.configuration }} (${{ parameters.framework }})
  ${{ if ne(parameters.condition, '') }}:
    condition: and(succeeded(), ${{ parameters.condition }})
  pool:
    ${{ if ne(parameters.poolName, '') }}:
      name: ${{ parameters.poolName }}
      demands:
        - ImageOverride -equals ${{ parameters.windowsImage }}
    ${{ else }}:
      vmImage: ${{ parameters.windowsImage }}
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: true
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  steps:
  - task: PowerShell@2
    name: testmatrix
    displayName: Prepare Tests
    inputs:
      targetType: filePath
      filePath: ./.azurepipelines/get-matrix.ps1
      arguments: -FileName ${{ parameters.projectfilename }} -ExcludeFileName "${{ parameters.excludeprojects }}" -AgentTable ${{ parameters.agents }}
- job: testall${{ parameters.jobnamesuffix }}
  displayName: Tests (${{ parameters.framework }})
  dependsOn: testprep${{ parameters.jobnamesuffix }}
  ${{ if ne(parameters.condition, '') }}:
    condition: and(succeeded(), ${{ parameters.condition }})
  timeoutInMinutes: 180
  strategy:
    matrix: $[dependencies.testprep${{ parameters.jobnamesuffix }}.outputs['testmatrix.jobMatrix'] ]
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: true
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    CustomTestTarget: ${{ parameters.customtestarget }}
    ${{ if eq( parameters.customtestarget, '' ) }}:
      DotCliCommandline: '--framework ${{ parameters.framework }}'
    ${{ else }}:
      DotCliCommandline: '/p:CustomTestTarget=${{ parameters.customtestarget }}'
    # /p:CollectCoverage=true does not switch coverlet's msbuild integration on
    # (the XPlat data collector does the instrumentation); it only turns
    # ContinuousIntegrationBuild off in common.props.  Without that, SourceLink
    # rewrites the source paths embedded in the pdb to deterministic '/_/...'
    # paths and the coverage report can no longer be mapped back onto the files
    # in the working tree, which the changed-lines gate needs.
    #
    # coverlet.collector 10.x ships build assets for net8.0+ only, so a .NET
    # Framework test host cannot load the 'XPlat Code Coverage' collector at all
    # (VSTest only warns and produces no report).  Those legs - anything running
    # on net48 / net472, which includes the netstandard2.0 leg because it hosts
    # its tests on net48 - therefore run without the collector, and their gate
    # job below degrades to the test-result check.
    ${{ if and(parameters.coverage, not(startsWith(parameters.framework, 'net4')), not(startsWith(parameters.customtestarget, 'net4'))) }}:
      CoverageArgs: '/p:CollectCoverage=true --collect:"XPlat Code Coverage" --settings ./tests/coverlet.runsettings.xml'
    ${{ else }}:
      CoverageArgs: ''
    ${{ if ne(parameters.testfilter, '') }}:
      TestFilterArgs: '--filter "${{ parameters.testfilter }}"'
    ${{ else }}:
      TestFilterArgs: ''
  pool:
    ${{ if and(ne(parameters.poolName, ''), not(parameters.hosted)) }}:
      name: ${{ parameters.poolName }}
      demands:
        - ImageOverride -equals $(poolImage)
    ${{ else }}:
      vmImage: $(poolImage)
  steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 8.0'
    condition: eq('${{parameters.framework}}', 'net8.0')
    inputs:
      packageType: 'sdk'
      version: '8.0.x'
  - task: UseDotNet@2
    displayName: 'Install .NET 9.0'
    condition: eq('${{parameters.framework}}', 'net9.0')
    inputs:
      packageType: 'sdk'
      version: '9.0.x'
  - task: UseDotNet@2
    displayName: 'Install .NET 10.0'
    inputs:
      packageType: 'sdk'
      version: '10.0.x'
  - task: NuGetToolInstaller@1
    inputs:
      versionSpec: '>=7.0.x'
  - task: PowerShell@2
    displayName: Versioning
    inputs:
      targetType: filePath
      filePath: ./.azurepipelines/set-version.ps1
  - task: DownloadSecureFile@1
    name: fuzzingartifacts
    displayName: 'Download Fuzzing artifacts'
    # Only the Opc.Ua.Encoders.Fuzz.Tests matrix entry consumes these crash-seed
    # assets; gating the download saves a secure-file fetch + ~28k 'inflating:
    # crash-*' log lines on every other matrix entry (observed pre-fix on mac
    # build 14598 log 652).
    condition: contains(variables['file'], 'Fuzz.Tests')
    inputs:
      secureFile: 'FuzzingArtifacts.zip'
  - task: ExtractFiles@1
    displayName: 'Extract Fuzzing artifacts'
    condition: and(contains(variables['file'], 'Fuzz.Tests'), ne(variables['fuzzingartifacts.secureFilePath'], ''))
    inputs:
      archiveFilePatterns: '$(Agent.TempDirectory)/FuzzingArtifacts.zip'
      destinationFolder: ./fuzzing/Opc.Ua.Encoders.Fuzz.Tests
      cleanDestinationFolder: false
      overwriteExistingFiles: true
    continueOnError: true
  - task: DotNetCoreCLI@2
    displayName: Restore ${{ parameters.configuration }}
    inputs:
      command: restore
      projects: $(file)
      arguments: '${{ variables.DotCliCommandline }} --configuration ${{ parameters.configuration }}'
  - task: DotNetCoreCLI@2
    displayName: Test ${{ parameters.configuration }}
    timeoutInMinutes: 90
    # continueOnError: a non-zero 'dotnet test' exit code no longer fails the job
    # directly - the "Evaluate test results" gate below decides pass/fail from the
    # emitted TRX. This is required because the hosted macOS agent intermittently
    # stalls the test host during PROCESS EXIT (after every test has already
    # passed and all teardowns have run; managed threads are frozen so no in-test
    # mitigation can fire), and the blame collector then kills the host with a
    # non-zero exit even though the run was functionally green. A real test
    # failure is still caught: it is recorded in the TRX and fails the gate.
    continueOnError: true
    inputs:
      command: test
      projects: $(file)
      # --blame-hang-timeout/--blame-hang-dump-type: kill (and name) any single test
      # that exceeds the configured hangtimeout so silent hangs surface as
      # "Test <Name> exceeded the configured timeout" instead of burning the full
      # 90-min step timeout with no diagnostic info (observed on mac PR build 14598
      # log 933: 28 min of silence after the previous test before the step timeout
      # fired). The 10-min default is well above any legitimate run once the
      # LongRunning/Stress tiers are filtered out; legs that include them raise it.
      # --blame-hang-dump-type mini: capture a minidump on hang so we can root-cause
      # teardown / shutdown hangs (observed on mac PR builds for Opc.Ua.History.Tests:
      # all tests pass, then a ~10-min silent teardown -> hang dump -> exit 1). A mini
      # dump still contains every thread's stack (what is stuck and what it is blocked
      # on) which is what a hang needs; a full dump additionally serializes the managed
      # heap, which for a server-hosting test process is several GB and impractical to
      # upload/download. It is only produced on an actual hang, so the cost is paid
      # rarely; the dump is published as a downloadable pipeline artifact below (it is
      # otherwise only reachable via the auth-gated test attachments API).
      # --logger trx + --results-directory: emit trx ourselves because we set
      # publishTestResults: false below to decouple "ran tests" from "published
      # results to AzDO" - the inline publish step inside DotNetCoreCLI@2 fails
      # the whole task on transient DNS / network blips when reaching back to
      # opcfoundation.visualstudio.com (observed on mac PR build 14614 log 737:
      # all 707 tests passed, then post-test publish errored with
      # "nodename nor servname provided, or not known" and failed the job).
      arguments: '--no-restore ${{ variables.DotCliCommandline }} --configuration ${{ parameters.configuration }} ${{ variables.CoverageArgs }} ${{ variables.TestFilterArgs }} --blame-hang-timeout ${{ parameters.hangtimeout }} --blame-hang-dump-type mini --logger trx --results-directory $(Agent.TempDirectory)'
      publishTestResults: false
  - task: PublishTestResults@2
    displayName: 'Publish Test Results ${{ parameters.configuration }} (${{ parameters.framework }})'
    # succeededOrFailed() so test results land in AzDO even when tests failed;
    # continueOnError so a transient publish failure (e.g. macOS hosted agent DNS
    # hiccup against opcfoundation.visualstudio.com) does not flip the job to
    # failed when the actual tests already passed.
    condition: succeededOrFailed()
    continueOnError: true
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '$(Agent.TempDirectory)/*.trx'
      mergeTestResults: true
      failTaskOnFailedTests: false
      testRunTitle: '${{ parameters.framework }} ${{ parameters.configuration }} - $(Agent.JobName)'
  - task: PowerShell@2
    displayName: 'Evaluate test results ${{ parameters.configuration }} (${{ parameters.framework }})'
    # Result-driven gate: the job's pass/fail is defined by the emitted TRX, not
    # by the 'dotnet test' exit code (the test step runs with continueOnError).
    # Fails the job if any test failed/errored/timed-out/aborted, or if no results
    # were produced at all. Tolerates ONLY a non-zero exit when every recorded
    # test passed - i.e. the benign macOS test-host process-exit stall that the
    # blame collector turns into a non-zero exit after a fully green run. This
    # runs before the failure-only artifact steps below so their failed()
    # conditions still see a genuine failure.
    condition: succeededOrFailed()
    inputs:
      targetType: inline
      script: |
        $ErrorActionPreference = 'Stop'
        $dir = "$(Agent.TempDirectory)"

        function Get-CounterValue([System.Xml.XmlElement] $element, [string] $name) {
            $raw = $element.GetAttribute($name)
            if ([string]::IsNullOrEmpty($raw)) { return 0 }
            return [int]$raw
        }

        $trx = @(Get-ChildItem -Path $dir -Filter *.trx -ErrorAction SilentlyContinue)
        if ($trx.Count -eq 0) {
            # No VSTest TRX in the results directory. This is expected for
            # Microsoft.Testing.Platform (MTP) test projects, which do not emit a
            # VSTest-style TRX there. For those, defer to the test host's own exit
            # code as reflected by Agent.JobStatus: 'Succeeded' means the test step
            # (and every prior step) exited cleanly -> pass; anything else (the
            # continueOnError test step exited non-zero, or an earlier step failed)
            # -> fail. This preserves the original exit-code behaviour for MTP
            # projects while the TRX path below tolerates the VSTest macOS at-exit
            # stall.
            $jobStatus = $env:AGENT_JOBSTATUS
            Write-Host "No VSTest TRX found in $dir; deferring to the test host exit (Agent.JobStatus=$jobStatus)."
            if ($jobStatus -eq 'Succeeded') {
                Write-Host "Test host exited cleanly; treating the run as successful."
                exit 0
            }
            Write-Host "##vso[task.logissue type=error]Test host did not exit cleanly and produced no TRX results."
            exit 1
        }
        $passed = 0
        $failed = 0
        $total = 0
        foreach ($f in $trx) {
            # Use XmlDocument.Load (not [xml](Get-Content ...)) so large TRX
            # files - PubSub emits ~9400 results, several MB - parse reliably;
            # the array-of-lines cast fails on big files ("Cannot convert value
            # System.String[]").
            $doc = New-Object System.Xml.XmlDocument
            try {
                $doc.Load($f.FullName)
            }
            catch {
                Write-Host "##vso[task.logissue type=error]Could not parse TRX $($f.Name): $($_.Exception.Message)"
                exit 1
            }
            foreach ($c in $doc.GetElementsByTagName('Counters')) {
                $passed += Get-CounterValue $c 'passed'
                $total += Get-CounterValue $c 'total'
                $failed += (Get-CounterValue $c 'failed') + (Get-CounterValue $c 'error') +
                    (Get-CounterValue $c 'timeout') + (Get-CounterValue $c 'aborted') +
                    (Get-CounterValue $c 'passedButRunAborted')
            }
        }
        Write-Host "Aggregated test results: total=$total, passed=$passed, failed/error/timeout/aborted=$failed (from $($trx.Count) trx file(s))."
        if ($failed -gt 0) {
            Write-Host "##vso[task.logissue type=error]$failed test(s) failed or the run was aborted mid-execution."
            exit 1
        }
        if ($total -le 0) {
            Write-Host "##vso[task.logissue type=error]No tests were recorded (total=0); the run did not execute."
            exit 1
        }
        Write-Host "No test failures recorded across $total test(s); treating the run as successful (tolerating any non-zero test-host exit after a fully green run)."
        exit 0
  # Hand the raw per-project Cobertura report to the Coverage gate job below
  # instead of letting that job re-run the whole suite with coverage enabled.
  # Re-running defeats the point of fanning the suite out across matrix jobs and
  # reliably blew the stage timeout.  The artifact name is unique per matrix
  # entry (System.JobId) and prefixed with this invocation's job-name suffix so
  # the gate job downloads only the reports for its own framework/configuration.
  - ${{ if and(parameters.coverage, not(startsWith(parameters.framework, 'net4')), not(startsWith(parameters.customtestarget, 'net4'))) }}:
    - task: CopyFiles@2
      displayName: 'Stage code coverage'
      condition: succeededOrFailed()
      continueOnError: true
      inputs:
        SourceFolder: '$(Agent.TempDirectory)'
        Contents: '**/*.cobertura.xml'
        TargetFolder: '$(Build.ArtifactStagingDirectory)/coverage'
        # Not flattened: the collector writes every report as 'coverage.cobertura.xml'
        # below a per-run guid folder, so flattening would drop all but one.
        flattenFolders: false
    - task: PowerShell@2
      name: coverageProbe
      displayName: 'Detect code coverage'
      condition: succeededOrFailed()
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $dir = '$(Build.ArtifactStagingDirectory)/coverage'
          $found = (Test-Path $dir) -and
              @(Get-ChildItem -Path $dir -Recurse -File -Filter *.cobertura.xml -ErrorAction SilentlyContinue).Count -gt 0
          Write-Host "Code coverage reports present: $found"
          Write-Host "##vso[task.setvariable variable=HAS_COVERAGE;isOutput=true]$($found.ToString().ToLowerInvariant())"
    - task: PublishPipelineArtifact@1
      displayName: 'Publish code coverage'
      # Only publish when the probe found a report; PublishPipelineArtifact@1
      # warns on an empty targetPath and would light the step up yellow.
      condition: and(succeededOrFailed(), eq(variables['coverageProbe.HAS_COVERAGE'], 'true'))
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/coverage'
        artifact: 'coverage-${{ parameters.jobnamesuffix }}-$(System.JobId)'
  - task: PublishBuildArtifacts@1
    displayName: 'Publish Fuzzing artifacts on failure'
    condition: and(failed(), contains(variables['file'], 'Fuzz.Tests'), ne(variables['fuzzingartifacts.secureFilePath'], ''))
    inputs:
      PathtoPublish: '$(Agent.TempDirectory)/FuzzingArtifacts.zip'
  # On job completion, collect any dumps written under the results directory
  # ($(Agent.TempDirectory)) and publish them as a downloadable pipeline
  # artifact.  Covers:
  #   - --blame-hang-dump-type mini / full hang dumps (*.dmp)
  #   - --blame-crash-dump-type mini / full crash dumps (*.dmp)
  #   - Linux core dumps (core / core.*)
  #   - Any other dump variant a test collector might emit (*.mdmp, *.dump)
  # The blame collector otherwise only attaches the dump to the trx, which is
  # reachable solely through the auth-gated test attachments API; publishing
  # them as build artifacts makes teardown/shutdown hangs and testhost crashes
  # (e.g. the macOS Opc.Ua.History.Tests 10-minute teardown hang) downloadable
  # for root-cause analysis.  The artifact name embeds the unique job id so
  # parallel matrix entries never collide.  succeededOrFailed() gates run on
  # both success and failure because the dotnet test task uses
  # publishTestResults: false + failTaskOnFailedTests: false, so a crash or
  # hang may not surface as failed() on this step even when the testhost
  # dumped.  A probe step sets HAS_DUMPS so the publish task only runs when
  # there is at least one file to upload - PublishPipelineArtifact@1 emits a
  # warning on an empty targetPath, which we do NOT want on healthy runs.
  - task: CopyFiles@2
    displayName: 'Stage diagnostic dumps'
    condition: succeededOrFailed()
    continueOnError: true
    inputs:
      SourceFolder: '$(Agent.TempDirectory)'
      Contents: |
        **/*.dmp
        **/*.mdmp
        **/*.dump
        **/core
        **/core.*
      TargetFolder: '$(Build.ArtifactStagingDirectory)/dumps'
      flattenFolders: true
  - task: PowerShell@2
    name: dumpProbe
    displayName: 'Detect diagnostic dumps'
    condition: succeededOrFailed()
    inputs:
      targetType: inline
      pwsh: true
      script: |
        $dir = '$(Build.ArtifactStagingDirectory)/dumps'
        $found = (Test-Path $dir) -and @(Get-ChildItem -Path $dir -File -ErrorAction SilentlyContinue).Count -gt 0
        Write-Host "Diagnostic dumps present: $found"
        Write-Host "##vso[task.setvariable variable=HAS_DUMPS;isOutput=true]$($found.ToString().ToLowerInvariant())"
  - task: PublishPipelineArtifact@1
    displayName: 'Publish diagnostic dumps'
    # Only publish when the probe found at least one dump; otherwise
    # PublishPipelineArtifact@1 warns on an empty targetPath and the whole
    # step lights up yellow on healthy runs.
    condition: and(succeededOrFailed(), eq(variables['dumpProbe.HAS_DUMPS'], 'true'))
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/dumps'
      artifact: 'dumps-$(System.JobId)'
# Per-(framework, configuration) gate.  Runs once every test job of this
# invocation has finished, re-assembles the Cobertura fragments those jobs
# published into a single report and evaluates the coverage thresholds on it.
# This job - not the fan-out matrix - is the status check to require in the
# GitHub branch ruleset: it fails when any test job failed and, on the leg that
# sets enforceCoverage, when the merged report is missing or misses the
# thresholds in coverage-thresholds.json.
- ${{ if parameters.coverage }}:
  - job: coverage${{ parameters.jobnamesuffix }}
    displayName: Coverage ${{ parameters.configuration }} (${{ parameters.framework }})
    dependsOn:
    - testprep${{ parameters.jobnamesuffix }}
    - testall${{ parameters.jobnamesuffix }}
    timeoutInMinutes: 30
    # not(canceled()) rather than the default succeeded(): the job has to report
    # a *failed* status check when the tests failed, and a job that is skipped
    # because its dependency failed surfaces to GitHub as 'skipped', which a
    # required check treats as satisfied.
    ${{ if ne(parameters.condition, '') }}:
      condition: and(not(canceled()), ${{ parameters.condition }})
    ${{ else }}:
      condition: not(canceled())
    variables:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      disable.coverage.autogenerate: true
      testsResult: $[ dependencies.testall${{ parameters.jobnamesuffix }}.result ]
      testMatrix: $[ dependencies.testprep${{ parameters.jobnamesuffix }}.outputs['testmatrix.jobMatrix'] ]
    # The gate merges XML and diffs git, so it is independent of the framework
    # under test and always runs on Linux.
    pool:
      ${{ if ne(parameters.coveragePoolName, '') }}:
        name: ${{ parameters.coveragePoolName }}
        demands:
          - ImageOverride -equals ${{ parameters.coverageImage }}
      ${{ else }}:
        vmImage: ${{ parameters.coverageImage }}
    steps:
    # Full history: the coverage gate diffs the pull request against its base branch
    # to compute changed-line (patch) coverage, which a shallow clone cannot do.
    - checkout: self
      fetchDepth: 0
    - task: PowerShell@2
      displayName: 'Verify test results ${{ parameters.configuration }} (${{ parameters.framework }})'
      inputs:
        pwsh: true
        targetType: inline
        script: |
          # Aggregated result of every matrix entry of the test job. Anything
          # other than a (possibly warning-decorated) success means at least one
          # test job failed, was cancelled or never ran - fail here so this
          # single check reflects the health of the whole framework leg.
          $result = '$(testsResult)'
          Write-Host "Test jobs for ${{ parameters.framework }} ${{ parameters.configuration }} reported '$result'."
          if ($result -eq 'Succeeded' -or $result -eq 'SucceededWithIssues') {
              exit 0
          }
          Write-Host "##vso[task.logissue type=error]Tests for ${{ parameters.framework }} ${{ parameters.configuration }} did not succeed (result: $result)."
          exit 1
    - task: UseDotNet@2
      displayName: 'Install .NET 10.0'
      inputs:
        packageType: 'sdk'
        version: '10.0.x'
    - task: DownloadPipelineArtifact@2
      displayName: 'Download code coverage'
      inputs:
        buildType: current
        # One artifact per matrix entry; the '-' after the suffix keeps sibling
        # invocations apart (for example net100 does not pick up net100mac).
        patterns: 'coverage-${{ parameters.jobnamesuffix }}-*/**/*.cobertura.xml'
        path: '$(Agent.TempDirectory)/coverage'
    - task: PowerShell@2
      name: reportProbe
      displayName: 'Detect code coverage'
      inputs:
        pwsh: true
        targetType: inline
        script: |
          $source = '$(Agent.TempDirectory)/coverage'
          $artifacts = @(Get-ChildItem -Path $source -Directory -ErrorAction SilentlyContinue)
          $reports = @(Get-ChildItem -Path $source -Recurse -File -Filter *.cobertura.xml -ErrorAction SilentlyContinue)
          Write-Host "Downloaded $($reports.Count) Cobertura report(s) from $($artifacts.Count) test job(s)."
          $found = $reports.Count -gt 0
          Write-Host "##vso[task.setvariable variable=HAS_REPORTS;isOutput=true]$($found.ToString().ToLowerInvariant())"
          if ($found) {
              # One artifact per matrix entry. Fewer means a test job passed but
              # published nothing, which silently shrinks the merged report - the
              # project floor only gets stricter, but the changed-lines gate can
              # pass vacuously for files whose assembly went missing. Surface it.
              $expected = 0
              try {
                  $expected = @(($env:TEST_MATRIX | ConvertFrom-Json).PSObject.Properties).Count
              }
              catch {
                  Write-Host "Could not read the test job matrix: $($_.Exception.Message)"
              }
              if ($expected -gt 0 -and $artifacts.Count -lt $expected) {
                  Write-Host "##vso[task.logissue type=warning]Only $($artifacts.Count) of $expected test job(s) published coverage; the merged report is incomplete."
              }
              exit 0
          }
          # Expected on the .NET Framework legs: coverlet.collector 10.x has no
          # net4x build asset, so those jobs never emit a report and this gate
          # degrades to the test-result check. Where the thresholds are enforced
          # a missing report is a hard failure instead - it would otherwise let
          # a silently broken collector pass the gate.
          if ('${{ parameters.enforceCoverage }}' -eq 'true') {
              Write-Host "##vso[task.logissue type=error]No coverage was published by the test jobs; the gate has nothing to evaluate."
              exit 1
          }
          Write-Host "##vso[task.logissue type=warning]No coverage was published by the test jobs; only the test results are checked for this leg."
          exit 0
      env:
        TEST_MATRIX: $(testMatrix)
    - task: DotNetCoreCLI@2
      displayName: Install ReportGenerator tool
      condition: and(succeeded(), eq(variables['reportProbe.HAS_REPORTS'], 'true'))
      inputs:
        command: custom
        custom: tool
        arguments: install --tool-path tools dotnet-reportgenerator-globaltool
    - task: PowerShell@2
      displayName: 'Merge Code Coverage Report'
      condition: and(succeeded(), eq(variables['reportProbe.HAS_REPORTS'], 'true'))
      inputs:
        pwsh: true
        targetType: inline
        workingDirectory: '$(Build.SourcesDirectory)'
        script: |
          $ErrorActionPreference = 'Stop'
          $source = '$(Agent.TempDirectory)/coverage'
          & '$(Build.SourcesDirectory)/tools/reportgenerator' `
              "-reports:$source/**/*.cobertura.xml" `
              '-targetdir:$(Build.SourcesDirectory)/CodeCoverage' `
              '-reporttypes:Cobertura;HtmlSummary' `
              '-title:UA .Net Standard Test Coverage' `
              '-assemblyfilters:-*.Tests'
          if ($LASTEXITCODE -ne 0) {
              Write-Host "##vso[task.logissue type=error]ReportGenerator failed with exit code $LASTEXITCODE."
              exit $LASTEXITCODE
          }
          $summary = '$(Build.SourcesDirectory)/CodeCoverage/summary.htm'
          if (Test-Path $summary) {
              Move-Item -Force $summary '$(Build.SourcesDirectory)/CodeCoverage/index.htm'
          }
    - task: PublishPipelineArtifact@1
      displayName: 'Publish merged coverage report'
      condition: and(succeeded(), eq(variables['reportProbe.HAS_REPORTS'], 'true'))
      continueOnError: true
      inputs:
        targetPath: '$(Build.SourcesDirectory)/CodeCoverage'
        artifact: 'coverage-report-${{ parameters.jobnamesuffix }}'
    # Azure DevOps keeps a single code-coverage summary per build and Codacy
    # accepts a single report per commit, so only the invocation flagged as the
    # publishing one uploads - the remaining legs keep their report as the
    # pipeline artifact published above.
    - ${{ if parameters.publishCoverage }}:
      - task: PublishCodeCoverageResults@2
        displayName: 'Publish code coverage'
        condition: and(succeeded(), eq(variables['reportProbe.HAS_REPORTS'], 'true'))
        inputs:
          summaryFileLocation: '$(Build.SourcesDirectory)/CodeCoverage/Cobertura.xml'
        continueOnError: true
      - script: |
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r $REPORT_LOCATION --commit-uuid $COMMIT_UUID

        condition: and(succeeded(), eq(variables['reportProbe.HAS_REPORTS'], 'true'), ne(variables['CODACY_PROJECT_TOKEN'], ''))
        env:
          CODACY_PROJECT_TOKEN: $(CODACY_PROJECT_TOKEN)
          REPORT_LOCATION: '$(Build.SourcesDirectory)/CodeCoverage/Cobertura.xml'
          COMMIT_UUID: '$(Build.SourceVersion)'
        continueOnError: true
        displayName: 'Upload to Codacy'
    # Coverage gate. Replaces the codecov/project and codecov/patch status checks:
    # a blocking absolute floor over the whole report, a blocking changed-lines
    # check on pull requests, and an advisory comparison against the recorded
    # baseline. Runs last so the report is published even when the gate fails.
    - task: PowerShell@2
      displayName: 'Coverage gate'
      condition: and(succeeded(), eq(variables['reportProbe.HAS_REPORTS'], 'true'))
      # Advisory unless the caller opted in: only the leg whose thresholds are
      # calibrated blocks the build; the others still fail on test failures.
      ${{ if not(parameters.enforceCoverage) }}:
        continueOnError: true
      inputs:
        pwsh: true
        targetType: inline
        workingDirectory: '$(Build.SourcesDirectory)'
        script: |
          # Empty on anything that is not a pull request validation build, in which
          # case check-coverage.ps1 enforces the project floor only.
          $baseRef = $env:SYSTEM_PULLREQUEST_TARGETBRANCH
          if ([string]::IsNullOrWhiteSpace($baseRef)) {
              Write-Host 'Not a pull request build; the changed-lines gate is skipped.'
          }
          else {
              Write-Host "Pull request targets '$baseRef'."
          }

          & ./.azurepipelines/check-coverage.ps1 `
              -CoberturaPath '$(Build.SourcesDirectory)/CodeCoverage/Cobertura.xml' `
              -ThresholdsPath '$(Build.SourcesDirectory)/coverage-thresholds.json' `
              -RepoRoot '$(Build.SourcesDirectory)' `
              -BaseRef $baseRef
          exit $LASTEXITCODE
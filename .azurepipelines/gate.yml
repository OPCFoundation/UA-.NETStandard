#
# Required "all tests passed" gate.
#
# This is the single status check to require in the GitHub branch ruleset. It
# rolls the result of every test stage up into one job so the ruleset does not
# have to name matrix-generated jobs, whose names change whenever a test project
# or an agent is added.
#
# Three things make it safe as a required check:
#
#   * The stage runs on not(canceled()) rather than the default succeeded(). A
#     stage that is skipped because its dependency failed reports to GitHub as
#     'skipped', and a required check reporting 'skipped' is treated as
#     SATISFIED - so with the default condition a broken build would merge.
#   * Stages that are Schedule/Manual-only report 'Skipped' on a pull request.
#     That is a legitimate outcome, so 'Skipped' passes while 'Failed' and
#     'Canceled' do not.
#   * The set of stages it checks is read from the 'dependencies' context rather
#     than from a second hand-maintained list, so the stages it verifies are by
#     construction exactly the stages it depends on.
#
# This is a stage template, not a jobs template, because the 'dependencies'
# context holding stage results resolves at STAGE scope only; at job scope
# 'dependencies' refers to other jobs of the same stage.
#
parameters:
# Stages to depend on, and therefore to verify.
- name: stages
  type: object
  default: []
- name: stagename
  type: string
  default: 'gate'
- name: poolName
  type: string
  default: ''
- name: poolImage
  type: string
  default: 'ubuntu-24.04'
stages:
- stage: ${{ parameters.stagename }}
  displayName: 'Tests passed'
  dependsOn: ${{ parameters.stages }}
  condition: not(canceled())
  jobs:
  - job: gate
    displayName: Verify stage results
    timeoutInMinutes: 10
    variables:
      # Every job of every stage this one depends on, as
      # { "<stage>": { "<job>": { "result": "...", ... } } }.
      #
      # This has to be 'stageDependencies' declared at JOB scope. A stage-scoped
      # '$[ ]' variable is still evaluated when the job is prepared, where the
      # 'dependencies' context means sibling jobs of the same stage - the gate
      # stage has one job and no job dependencies, so
      # '$[ convertToJson(dependencies) ]' resolves to '{}' and the gate
      # silently verifies nothing (observed on build 16520).
      #
      # Reading the context rather than a second hand-maintained stage list also
      # means the gate can only ever check exactly what it depends on.
      stageResults: $[ convertToJson(stageDependencies) ]
    pool:
      ${{ if ne(parameters.poolName, '') }}:
        name: ${{ parameters.poolName }}
        demands:
          - ImageOverride -equals ${{ parameters.poolImage }}
      ${{ else }}:
        vmImage: ${{ parameters.poolImage }}
    steps:
    # Nothing is built or read from the tree; this job only inspects results.
    - checkout: none
    - task: PowerShell@2
      displayName: 'Evaluate stage results'
      inputs:
        pwsh: true
        targetType: inline
        script: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:STAGE_RESULTS)) {
              Write-Host "##vso[task.logissue type=error]The stage dependency context was empty; the gate cannot verify anything."
              exit 1
          }

          try {
              $deps = $env:STAGE_RESULTS | ConvertFrom-Json
          }
          catch {
              Write-Host "##vso[task.logissue type=error]Could not parse the stage dependency context: $($_.Exception.Message)"
              exit 1
          }

          $stages = @($deps.PSObject.Properties)
          if ($stages.Count -eq 0) {
              # Never treat "no data" as success: that is exactly how a required
              # check silently stops protecting the branch.
              Write-Host "##vso[task.logissue type=error]The stage dependency context resolved to no stages, so the gate would verify nothing."
              exit 1
          }

          # 'Skipped' is legitimate: the stage is Schedule/Manual-only and this
          # is a pull request, or the CI backend switch stood it down.
          $acceptable = @('Succeeded', 'SucceededWithIssues', 'Skipped')
          $bad = @()
          $checked = 0

          Write-Host 'Stage results:'
          foreach ($stage in ($stages | Sort-Object Name)) {
              $jobs = @($stage.Value.PSObject.Properties)
              if ($jobs.Count -eq 0) {
                  # A stage that was skipped outright contributes no jobs.
                  Write-Host ("  {0,-24} (skipped - no jobs ran)" -f $stage.Name)
                  continue
              }
              foreach ($job in ($jobs | Sort-Object Name)) {
                  $result = $job.Value.result
                  $shown = if ([string]::IsNullOrWhiteSpace($result)) { 'Skipped (did not report)' } else { $result }
                  Write-Host ("  {0,-24} {1,-46} {2}" -f $stage.Name, $job.Name, $shown)
                  if ([string]::IsNullOrWhiteSpace($result)) { continue }
                  $checked++
                  if ($acceptable -notcontains $result) {
                      $bad += "$($stage.Name)/$($job.Name) ($result)"
                  }
              }
          }

          if ($bad.Count -gt 0) {
              Write-Host "##vso[task.logissue type=error]$($bad.Count) job(s) did not succeed: $($bad -join ', ')."
              Write-Host 'Tests did NOT pass.'
              exit 1
          }

          Write-Host "Checked $checked job(s) across $($stages.Count) stage(s); all succeeded or were intentionally skipped."
          exit 0
      env:
        STAGE_RESULTS: $(stageResults)


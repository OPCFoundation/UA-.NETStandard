#
# Required "all tests passed" gate.
#
# This is the single status check to require in the GitHub branch ruleset. It
# rolls the result of every test stage up into one job so the ruleset does not
# have to name matrix-generated jobs, whose names change whenever a test project
# or an agent is added.
#
# Three things make it safe as a required check:
#
#   * The stage runs on not(canceled()) rather than the default succeeded(). A
#     stage that is skipped because its dependency failed reports to GitHub as
#     'skipped', and a required check reporting 'skipped' is treated as
#     SATISFIED - so with the default condition a broken build would merge.
#   * Stages that are Schedule/Manual-only report 'Skipped' on a pull request.
#     That is a legitimate outcome, so 'Skipped' passes while 'Failed' and
#     'Canceled' do not.
#   * An empty result is rejected. dependencies.<stage>.result is only readable
#     at STAGE scope and only for DIRECT dependencies, so an empty value means
#     the stage list and the dependsOn list have drifted apart - which would
#     otherwise silently turn the gate into a no-op. This template derives both
#     lists from the same parameter so they cannot drift, and the check is kept
#     as a backstop.
#
# This is a stage template, not a jobs template, precisely because
# dependencies.<stage>.result does NOT resolve at job scope: there,
# 'dependencies' refers to other jobs of the same stage.
#
parameters:
# Names of the stages to roll up. Used for both dependsOn and the result
# lookups, so the two can never disagree.
- name: stages
  type: object
  default: []
- name: stagename
  type: string
  default: 'gate'
- name: poolName
  type: string
  default: ''
- name: poolImage
  type: string
  default: 'ubuntu-24.04'
stages:
- stage: ${{ parameters.stagename }}
  displayName: 'Tests passed'
  dependsOn: ${{ parameters.stages }}
  condition: not(canceled())
  variables:
    # Stage scope: dependencies.<stage>.result is the whole stage's rollup,
    # which avoids enumerating the generated testall* / buildall* job names.
    # Jobs of this stage inherit these.
    ${{ each stage in parameters.stages }}:
      stageresult_${{ stage }}: $[ dependencies.${{ stage }}.result ]
  jobs:
  - job: gate
    displayName: Tests passed
    timeoutInMinutes: 10
    pool:
      ${{ if ne(parameters.poolName, '') }}:
        name: ${{ parameters.poolName }}
        demands:
          - ImageOverride -equals ${{ parameters.poolImage }}
      ${{ else }}:
        vmImage: ${{ parameters.poolImage }}
    steps:
    # Nothing is built or read from the tree; this job only inspects results.
    - checkout: none
    - task: PowerShell@2
      displayName: 'Evaluate stage results'
      inputs:
        pwsh: true
        targetType: inline
        script: |
          $ErrorActionPreference = 'Stop'

          $names = @($env:STAGE_NAMES -split ',' |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ })

          if ($names.Count -eq 0) {
              Write-Host "##vso[task.logissue type=error]No stage names were supplied; the gate cannot verify anything."
              exit 1
          }

          # 'Skipped' is legitimate: the stage is Schedule/Manual-only and this
          # is a pull request, or the CI backend switch stood it down.
          $acceptable = @('Succeeded', 'SucceededWithIssues', 'Skipped')
          $bad = @()
          $unresolved = @()

          Write-Host 'Stage results:'
          foreach ($name in $names) {
              # GetEnvironmentVariable is case-sensitive on Linux, so this has
              # to match the RESULT_<stage> names the template emits exactly.
              $result = [System.Environment]::GetEnvironmentVariable("RESULT_$name")
              $shown = if ([string]::IsNullOrWhiteSpace($result)) { '<unresolved>' } else { $result }
              Write-Host ("  {0,-22} {1}" -f $name, $shown)
              if ([string]::IsNullOrWhiteSpace($result)) {
                  $unresolved += $name
              }
              elseif ($acceptable -notcontains $result) {
                  $bad += "$name ($result)"
              }
          }

          # An unresolved result means the stage is not a direct dependency of
          # this one. Failing loudly beats silently accepting a gate that
          # verifies nothing.
          if ($unresolved.Count -gt 0) {
              Write-Host "##vso[task.logissue type=error]Could not read the result of: $($unresolved -join ', '). Every stage listed here must also be a direct dependsOn of this stage."
              exit 1
          }

          if ($bad.Count -gt 0) {
              Write-Host "##vso[task.logissue type=error]$($bad.Count) stage(s) did not succeed: $($bad -join ', ')."
              Write-Host 'Tests did NOT pass.'
              exit 1
          }

          Write-Host 'Every test stage either succeeded or was intentionally skipped.'
          exit 0
      env:
        STAGE_NAMES: ${{ join(',', parameters.stages) }}
        ${{ each stage in parameters.stages }}:
          RESULT_${{ stage }}: $(stageresult_${{ stage }})

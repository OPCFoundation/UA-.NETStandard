# Azure pipeline
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

parameters:
- name: poolMode
  displayName: 'Pool routing: mixed shares the netstandard Managed DevOps Pool and Microsoft-hosted agents across stages; managed forces all stages onto the managed pool; hosted forces all stages onto hosted agents'
  type: string
  default: mixed
  values:
  - mixed
  - managed
  - hosted
# How much of the build/test workload this pipeline runs during the migration to
# GitHub Actions.
#
# GitHub Actions owns pull-request validation outright:
# .github/workflows/buildandtest.yml runs the complete build and test workload
# unconditionally and has no switch that hands any of it back. Since the Azure
# context was dropped from the master ruleset this pipeline no longer runs on
# pull requests at all (`pr: none` below), so this parameter now only decides
# how much of the Actions workload the remaining push, schedule and manual runs
# duplicate while both systems run in parallel.
#
#   ado     - duplicate the full workload here: the Linux all-TFM build leg, the
#             Linux test leg and Native AoT run alongside the Windows matrix.
#   actions - (default) run the narrow gate here and leave the rest to the
#             stages' Schedule/Manual-only cadence.
#
# Note on scope: Azure Pipelines evaluates a pull request against the *target*
# branch's copy of this file, so master378 and the release/* lines are governed
# by their own copies and keep their own Azure validation. Only master is
# affected by the settings here.
- name: ciBuildBackend
  displayName: 'CI build backend: actions runs the narrow gate here; ado additionally duplicates the all-TFM build, cross-platform tests and AoT'
  type: string
  default: actions
  values:
  - ado
  - actions
# Codecov is reporting only - the enforced coverage rules live in
# coverage-thresholds.json and are applied by check-coverage.ps1 in the
# 'Code coverage' stage.  Turn this off to stop uploading entirely; the upload
# is skipped anyway whenever the CODECOV_TOKEN secret variable is unset, which
# is the case for pull requests from forks.
- name: enableCodecov
  displayName: 'Upload the merged coverage report to codecov.io from Azure (requires a valid Azure token)'
  type: boolean
  default: false
# Every stage that runs tests, consumed by the two terminal stages at the bottom
# of this file.  It is a parameter purely so the list is written once: Azure
# Pipelines supports no YAML anchors, and a second hand-maintained copy would
# drift.  There is no reason to override it at queue time.
- name: testStages
  displayName: 'Test stages rolled up by the Tests passed and Code coverage stages (do not change)'
  type: object
  default:
  - build
  - testfastpr
  - testaot
  - testdebug
  - testnet90
  - testnet80
  - testnet472
  - testnetstandard20
  - testnetstandard21
  - testnightly

trigger:
  batch: 'true'
  branches:
    include:
    - 'master'
    - 'main'
    - 'release/*'
  paths:
    include:
    - '*'
    exclude:
    - 'docs/**'
    - '**/*.md'
pr: none
# Pull-request validation is owned outright by GitHub Actions
# (.github/workflows/buildandtest.yml, required context 'build-and-test
# summary').  The Azure context was dropped from the master ruleset first, so
# disabling this trigger removes a duplicate rather than a gate.
#
# Azure Pipelines evaluates a PR against the target branch's copy of this file,
# and every existing release/* line is a 1.x branch or the frozen release/2.0.0.
# Those keep their own copy of this file and their own required Azure context in
# the 'Release' ruleset, so they are unaffected by this change.
#
# Before a canonical release/2.<minor> branch is cut from master, the 'Release'
# ruleset must stop requiring the Azure context for it - the branch inherits
# 'pr: none' from this file, so that context would otherwise never report and
# would block every pull request into the new line.  See
# docs/DeveloperGuide.md#migration-status.

# Weekly full-scope run.  Fires every Sunday at 02:00 UTC (late Saturday
# night in the Americas / early Sunday morning in EU).  `always: true`
# forces the run even when there are no commits since the previous one so
# the badge in README.md reflects a recent green build. All stages that
# are gated on `ScheduledBuild` (AOT, Debug, .NET 9/8/472/netstandard)
# are automatically included because Build.Reason is 'Schedule' for these runs.
# macOS jobs are additionally controlled by MacOSJobsEnabled and are disabled
# while GitHub Actions owns them.
schedules:
- cron: '0 2 * * 0'
  displayName: 'Weekly full-scope tests (Sat night UTC)'
  branches:
    include:
    - master
  always: true

variables:
  FullBuild: ${{ ne(variables['Build.Reason'], 'PullRequest') }}
  ScheduledBuild: ${{ in(variables['Build.Reason'], 'Schedule', 'Manual') }}
  # 'True' when Azure Pipelines additionally duplicates the build/test matrix
  # GitHub Actions already runs (see the ciBuildBackend parameter).  Native AoT,
  # normally Schedule/Manual-only here, then also runs on push builds.
  AdoOwnsMatrix: ${{ eq(parameters.ciBuildBackend, 'ado') }}
  # GitHub Actions owns macOS validation. Keep the Azure definitions available
  # for emergency/manual use, but do not schedule them unless explicitly enabled.
  MacOSJobsEnabled: false
  macImage: 'macOS-15'
  # Two pool profiles are defined so stages can be routed independently and the
  # netstandard Managed DevOps Pool and the Microsoft-hosted agents share the
  # workload of a single run (see the per-stage mapping below).  Each profile is
  # a (poolName, windowsImage, linuxImage) triple; poolName='' selects hosted
  # agents (vmImage), otherwise the named Managed DevOps Pool is used with an
  # ImageOverride demand per OS.  See
  # https://learn.microsoft.com/azure/devops/managed-devops-pools/configure-images#use-demands-to-specify-an-image
  #
  # poolMode collapses the two profiles for the all-managed / all-hosted
  # overrides; 'mixed' (default) keeps them distinct so both pools run in
  # parallel.  Stages reference mgd*/host* only, so no per-stage conditionals
  # are needed.
  ${{ if eq(parameters.poolMode, 'hosted') }}:
    mgdPoolName: ''
    mgdWindowsImage: 'windows-2025-vs2026'
    mgdLinuxImage: 'ubuntu-24.04'
    hostPoolName: ''
    hostWindowsImage: 'windows-2025-vs2026'
    hostLinuxImage: 'ubuntu-24.04'
  ${{ elseif eq(parameters.poolMode, 'managed') }}:
    mgdPoolName: 'netstandard'
    mgdWindowsImage: 'windows-2022-g2'
    mgdLinuxImage: 'ubuntu-22.04-g2'
    hostPoolName: 'netstandard'
    hostWindowsImage: 'windows-2022-g2'
    hostLinuxImage: 'ubuntu-22.04-g2'
  ${{ else }}:
    mgdPoolName: 'netstandard'
    mgdWindowsImage: 'windows-2022-g2'
    mgdLinuxImage: 'ubuntu-22.04-g2'
    hostPoolName: ''
    hostWindowsImage: 'windows-2025-vs2026'
    hostLinuxImage: 'ubuntu-24.04'

stages:
- stage: build
  dependsOn: []
  displayName: 'Build'
  jobs:
  - template: .azurepipelines/sln.yml
    parameters:
      poolImage: ${{ variables.hostWindowsImage }}
      poolName: ${{ variables.hostPoolName }}
      jobnamesuffix: win2025
      # Every build discovers every *.slnx.  The TFM fan-out differs by run
      # type: master/scheduled/manual builds cover all supported TFMs here,
      # while PR builds are narrowed so the managed pool is not swamped.
      solutions: ''
      ${{ if ne(variables.FullBuild, 'False') }}:
        tfms: 'net472,net48,netstandard2.0,netstandard2.1,net8.0,net9.0,net10.0'
      ${{ elseif eq(parameters.ciBuildBackend, 'ado') }}:
        # Duplicate the all-TFM PR build GitHub Actions runs, so a PR covers all
        # seven TFMs here too.  Windows takes the .NET Framework targets and the
        # Linux leg below takes the modern ones, which keeps full coverage
        # without fanning every TFM across both pools.
        tfms: 'net472,net48,netstandard2.0'
      ${{ else }}:
        # GitHub Actions runs the all-TFM build; this PR gate only needs the two
        # TFMs the contribution guide requires.
        tfms: 'net10.0,net48'
  - ${{ if eq(parameters.ciBuildBackend, 'ado') }}:
    # Duplicates the GitHub Actions build-solutions Linux legs: proves UA.slnx
    # still compiles on Linux for every Linux-capable TFM.  Release only,
    # because this leg exists to catch TFM/platform breaks rather than to
    # exercise Debug.
    - template: .azurepipelines/sln.yml
      parameters:
        poolImage: ${{ variables.mgdLinuxImage }}
        poolName: ${{ variables.mgdPoolName }}
        jobnamesuffix: linuxalltfm
        solutions: 'UA.slnx'
        configurations: 'Release'
        tfms: 'netstandard2.1,net8.0,net9.0,net10.0'
- stage: testfastpr
  dependsOn: []
  displayName: 'Fast PR test'
  jobs:
  - template: .azurepipelines/test.yml
    parameters:
      configuration: Release
      framework: net48
      agents: '@{ windows = "${{ variables.mgdWindowsImage }}" }'
      jobnamesuffix: net48
      poolName: ${{ variables.mgdPoolName }}
      windowsImage: ${{ variables.mgdWindowsImage }}
  - template: .azurepipelines/test.yml
    parameters:
      configuration: Release
      framework: net10.0
      # With the default ciBuildBackend=actions this leg stays Windows-only
      # because the GitHub Actions build-and-test job provides the Linux
      # coverage.  Setting it to ado duplicates that Linux leg here.
      ${{ if eq(parameters.ciBuildBackend, 'ado') }}:
        agents: '@{ windows = "${{ variables.mgdWindowsImage }}"; linux = "${{ variables.mgdLinuxImage }}" }'
      ${{ else }}:
        agents: '@{ windows = "${{ variables.mgdWindowsImage }}" }'
      jobnamesuffix: net100
      customtestarget: net10.0
      poolName: ${{ variables.mgdPoolName }}
      windowsImage: ${{ variables.mgdWindowsImage }}
  - template: .azurepipelines/test.yml
    parameters:
      configuration: Release
      framework: net10.0
      agents: '@{ mac = "${{ variables.macImage }}" }'
      jobnamesuffix: net100mac
      customtestarget: net10.0
      hosted: true
      poolName: ${{ variables.mgdPoolName }}
      windowsImage: ${{ variables.mgdWindowsImage }}
      condition: and(eq(variables.MacOSJobsEnabled, 'True'), ne(variables.ScheduledBuild, 'False'))
- stage: testaot
  dependsOn: []
  displayName: 'Test Native AoT'
  # Native AoT is Schedule/Manual-only while GitHub Actions runs its own ubuntu
  # AoT job.  When ADO owns the matrix this is the only place AoT runs here, so
  # it also runs on push builds.
  condition: and(succeeded(), or(ne(variables.ScheduledBuild, 'False'), ne(variables.AdoOwnsMatrix, 'False')))
  jobs:
  - template: .azurepipelines/test-aot.yml
    parameters:
      configuration: Release
      agents: '@{ windows = "${{ variables.mgdWindowsImage }}"; linux="${{ variables.mgdLinuxImage }}"}'
      jobnamesuffix: net100aot
      poolName: ${{ variables.mgdPoolName }}
      windowsImage: ${{ variables.mgdWindowsImage }}
- stage: testdebug
  dependsOn: [build]
  displayName: 'Test Core and SDK Debug'
  condition: and(succeeded(), ne(variables.ScheduledBuild, 'False'))
  jobs:
  - template: .azurepipelines/test.yml
    parameters:
      framework: net10.0
      configuration: Debug
      jobnamesuffix: net100debug
      poolName: ${{ variables.hostPoolName }}
      windowsImage: ${{ variables.hostWindowsImage }}
      agents: '@{ windows = "${{ variables.hostWindowsImage }}"; linux = "${{ variables.hostLinuxImage }}" }'
  - template: .azurepipelines/test.yml
    parameters:
      framework: net10.0
      configuration: Debug
      jobnamesuffix: net100debugmac
      agents: '@{ mac = "${{ variables.macImage }}" }'
      hosted: true
      poolName: ${{ variables.hostPoolName }}
      windowsImage: ${{ variables.hostWindowsImage }}
      condition: eq(variables.MacOSJobsEnabled, 'True')
- stage: testnet90
  dependsOn: [build]
  displayName: 'Test .NET 9.0'
  condition: and(succeeded(), ne(variables.ScheduledBuild, 'False'))
  jobs:
  - template: .azurepipelines/test.yml
    parameters:
      framework: net9.0
      configuration: Release
      jobnamesuffix: net90
      poolName: ${{ variables.mgdPoolName }}
      windowsImage: ${{ variables.mgdWindowsImage }}
      agents: '@{ windows = "${{ variables.mgdWindowsImage }}"; linux = "${{ variables.mgdLinuxImage }}" }'
  - template: .azurepipelines/test.yml
    parameters:
      framework: net9.0
      configuration: Release
      jobnamesuffix: net90mac
      agents: '@{ mac = "${{ variables.macImage }}" }'
      hosted: true
      poolName: ${{ variables.mgdPoolName }}
      windowsImage: ${{ variables.mgdWindowsImage }}
      condition: eq(variables.MacOSJobsEnabled, 'True')
- stage: testnet80
  dependsOn: [build]
  displayName: 'Test .NET 8.0'
  condition: and(succeeded(), ne(variables.ScheduledBuild, 'False'))
  jobs:
  - template: .azurepipelines/test.yml
    parameters:
      framework: net8.0
      configuration: Release
      jobnamesuffix: net80
      poolName: ${{ variables.hostPoolName }}
      windowsImage: ${{ variables.hostWindowsImage }}
      agents: '@{ windows = "${{ variables.hostWindowsImage }}"; linux = "${{ variables.hostLinuxImage }}" }'
  - template: .azurepipelines/test.yml
    parameters:
      framework: net8.0
      configuration: Release
      jobnamesuffix: net80mac
      agents: '@{ mac = "${{ variables.macImage }}" }'
      hosted: true
      poolName: ${{ variables.hostPoolName }}
      windowsImage: ${{ variables.hostWindowsImage }}
      condition: eq(variables.MacOSJobsEnabled, 'True')
- stage: testnet472
  dependsOn: [build]
  displayName: 'Test .NET 4.7.2'
  condition: and(succeeded(), ne(variables.ScheduledBuild, 'False'))
  jobs:
  - template: .azurepipelines/test.yml
    parameters:
      framework: net472
      configuration: Release
      jobnamesuffix: net472
      agents: '@{ windows = "${{ variables.hostWindowsImage }}" }'
      customtestarget: net472
      poolName: ${{ variables.hostPoolName }}
      windowsImage: ${{ variables.hostWindowsImage }}
- stage: testnetstandard20
  dependsOn: [build]
  displayName: 'Test .NETStandard 2.0'
  condition: and(succeeded(), ne(variables.ScheduledBuild, 'False'))
  jobs:
  - template: .azurepipelines/test.yml
    parameters:
      framework: net48
      configuration: Release
      jobnamesuffix: netstandard20
      agents: '@{ windows = "${{ variables.mgdWindowsImage }}"}'
      customtestarget: netstandard2.0
      poolName: ${{ variables.mgdPoolName }}
      windowsImage: ${{ variables.mgdWindowsImage }}
- stage: testnetstandard21
  dependsOn: [build]
  displayName: 'Test .NETStandard 2.1'
  condition: and(succeeded(), ne(variables.ScheduledBuild, 'False'))
  jobs:
  - template: .azurepipelines/test.yml
    parameters:
      framework: net8.0
      configuration: Release
      jobnamesuffix: netstandard21
      customtestarget: netstandard2.1
      poolName: ${{ variables.mgdPoolName }}
      windowsImage: ${{ variables.mgdWindowsImage }}
      agents: '@{ windows = "${{ variables.mgdWindowsImage }}"; linux = "${{ variables.mgdLinuxImage }}" }'
  - template: .azurepipelines/test.yml
    parameters:
      framework: net8.0
      configuration: Release
      jobnamesuffix: netstandard21mac
      customtestarget: netstandard2.1
      agents: '@{ mac = "${{ variables.macImage }}" }'
      hosted: true
      poolName: ${{ variables.mgdPoolName }}
      windowsImage: ${{ variables.mgdWindowsImage }}
      condition: eq(variables.MacOSJobsEnabled, 'True')
- stage: testnightly
  dependsOn: [build]
  displayName: 'Test long-running tiers'
  # Tiers that the fast legs deliberately filter out and that used to be dragged
  # in only by the combined coverage job that re-ran the whole suite.  That job
  # is gone, so they get their own Schedule/Manual stage here.  The stress tier
  # keeps running from .github/workflows/stress-test.yml.
  condition: and(succeeded(), ne(variables.ScheduledBuild, 'False'))
  jobs:
  # Mainline projects with no category filter, so the LongRunning tier (today
  # Opc.Ua.Subscriptions.Tests) is exercised.  A single Linux leg is enough -
  # the cross-platform matrix is already covered by the filtered stages.
  - template: .azurepipelines/test.yml
    parameters:
      framework: net10.0
      configuration: Release
      jobnamesuffix: net100longrunning
      customtestarget: net10.0
      testfilter: ''
      hangtimeout: '30m'
      # A tier, not a mainline leg: it re-runs a subset of the same projects
      # with the filter lifted, so folding its numbers into the merged report
      # would double-count. Skip coverage collection here.
      coverage: false
      agents: '@{ linux = "${{ variables.hostLinuxImage }}" }'
      poolName: ${{ variables.hostPoolName }}
      windowsImage: ${{ variables.hostWindowsImage }}
  # Durable-subscription tier, kept out of the mainline matrix by #3810.
  - template: .azurepipelines/test.yml
    parameters:
      framework: net10.0
      configuration: Release
      jobnamesuffix: net100durable
      customtestarget: net10.0
      projectfilename: 'Opc.Ua.Subscriptions.Durable.Tests.csproj'
      excludeprojects: ''
      testfilter: ''
      hangtimeout: '30m'
      coverage: false
      agents: '@{ windows = "${{ variables.hostWindowsImage }}"; linux = "${{ variables.hostLinuxImage }}" }'
      poolName: ${{ variables.hostPoolName }}
      windowsImage: ${{ variables.hostWindowsImage }}


# Required check.  Rolls every test stage up into a single status so the GitHub
# branch ruleset does not have to name matrix-generated jobs, whose names change
# whenever a test project or an agent is added.
#
# The verdict lives entirely in the stage `condition`, which is the one place
# Azure Pipelines reliably exposes stage results.  Two earlier attempts failed:
# a stage-scoped `$[ ]` variable is evaluated when the JOB is prepared, where
# `dependencies` means sibling jobs, so `convertToJson(dependencies)` resolved
# to '{}' (build 16520); and `convertToJson(stageDependencies)` at job scope
# blew the expression memory limit, because this pipeline's ~115 jobs carry
# large output variables such as the serialised test matrix (build 16583).
# Reading `dependencies.<stage>.result` here costs nothing and is the documented
# usage.
#
# 'Skipped' is accepted because the Schedule/Manual-only stages report exactly
# that on an ordinary push build.  When a stage genuinely fails the condition is
# false, this stage is skipped, and Azure Pipelines then posts NO check for it -
# which leaves any required check permanently unfulfilled and blocks the merge.
# That is deliberately fail-closed: the failing job itself is already red, and a
# required check that never reports can never be mistaken for a passing one.
# On master this now only affects push builds - `build-and-test summary` from
# GitHub Actions is the required check, and this pipeline no longer runs on
# pull requests - but master378 and the release/* lines still depend on it.
- stage: gate
  displayName: 'Tests passed'
  dependsOn: ${{ parameters.testStages }}
  condition: |
    and(
      not(canceled()),
      in(dependencies.build.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
      in(dependencies.testfastpr.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
      in(dependencies.testaot.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
      in(dependencies.testdebug.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
      in(dependencies.testnet90.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
      in(dependencies.testnet80.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
      in(dependencies.testnet472.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
      in(dependencies.testnetstandard20.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
      in(dependencies.testnetstandard21.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
      in(dependencies.testnightly.result, 'Succeeded', 'SucceededWithIssues', 'Skipped')
    )
  jobs:
  - job: gate
    displayName: Verify stage results
    timeoutInMinutes: 10
    pool:
      ${{ if ne(variables.hostPoolName, '') }}:
        name: ${{ variables.hostPoolName }}
        demands:
          - ImageOverride -equals ${{ variables.hostLinuxImage }}
      ${{ else }}:
        vmImage: ${{ variables.hostLinuxImage }}
    steps:
    # Nothing is built or read from the tree; reaching this job IS the verdict.
    - checkout: none
    - pwsh: |
        Write-Host 'Every test stage succeeded or was intentionally skipped.'
      displayName: 'Tests passed'
# Advisory check.  Merges every Cobertura fragment the run produced and
# evaluates coverage-thresholds.json once.  It reports a clean failure when the
# thresholds are missed so the miss is visible, but it must NOT be added to the
# GitHub branch ruleset - 'Tests passed' above is the required check.
- template: .azurepipelines/coverage.yml
  parameters:
    poolName: ${{ variables.hostPoolName }}
    poolImage: ${{ variables.hostLinuxImage }}
    stages: ${{ parameters.testStages }}
    enableCodecov: ${{ parameters.enableCodecov }}

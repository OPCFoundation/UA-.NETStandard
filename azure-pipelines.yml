# Azure pipeline
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

parameters:
- name: poolMode
  displayName: 'Pool routing: mixed shares the netstandard Managed DevOps Pool and Microsoft-hosted agents across stages; managed forces all stages onto the managed pool; hosted forces all stages onto hosted agents'
  type: string
  default: mixed
  values:
  - mixed
  - managed
  - hosted
# Which CI system owns the all-TFM solution build, the cross-platform test
# matrix and the Native AoT run.  This is one half of a single conceptual
# switch - the other half is CI_BUILD_BACKEND in
# .github/workflows/buildandtest.yml.  BOTH MUST BE FLIPPED TOGETHER.
#
#   ado     - (default) Azure Pipelines owns the work: the Linux all-TFM build
#             leg, the Linux test leg, Native AoT and the coverage gate all run
#             on pull requests, and the equivalent GitHub Actions jobs stand
#             down.
#   actions - restores the previous split: GitHub Actions runs the all-TFM
#             builds, the ubuntu test matrix and AoT, and the stages below fall
#             back to their Schedule/Manual-only cadence.
#
# Note on scope: Azure Pipelines evaluates the YAML from the PR's merge ref, so
# a PR targeting master378 or a release branch runs *that* branch's copy of this
# file.  In practice every PR that evaluates this file targets master, which is
# why the conditions below only need the parameter and not a target-branch test.
- name: ciBuildBackend
  displayName: 'CI build backend: ado runs the all-TFM build, cross-platform tests, AoT and the coverage gate here; actions hands them back to GitHub Actions'
  type: string
  default: ado
  values:
  - ado
  - actions

trigger:
  batch: 'true'
  branches:
    include:
    - 'master'
    - 'main'
    - 'release/*'
  paths:
    include:
    - '*'
    exclude:
    - 'docs/**'
    - '**/*.md'
pr:
  autoCancel: 'true'
  drafts: 'true'
  branches:
    include:
    - '*'
  paths:
    include:
    - '*'
    exclude:
    - 'docs/**'
    - '**/*.md'

# Weekly full-scope run.  Fires every Sunday at 02:00 UTC (late Saturday
# night in the Americas / early Sunday morning in EU).  `always: true`
# forces the run even when there are no commits since the previous one so
# the badge in README.md reflects a recent green build.  All stages that
# are gated on `ScheduledBuild` (AOT, Debug, .NET 9/8/472/netstandard,
# mac matrix) are automatically included because Build.Reason
# is 'Schedule' for these runs.
schedules:
- cron: '0 2 * * 0'
  displayName: 'Weekly full-scope tests (Sat night UTC)'
  branches:
    include:
    - master
  always: true

variables:
  FullBuild: ${{ ne(variables['Build.Reason'], 'PullRequest') }}
  ScheduledBuild: ${{ in(variables['Build.Reason'], 'Schedule', 'Manual') }}
  # 'True' when Azure Pipelines owns the build/test matrix that GitHub Actions
  # used to run (see the ciBuildBackend parameter).  Native AoT, previously
  # Schedule/Manual-only, additionally runs on pull requests while this is True,
  # because it is then the only place that work happens.
  AdoOwnsMatrix: ${{ eq(parameters.ciBuildBackend, 'ado') }}
  # macOS jobs always run on Microsoft-hosted agents because Managed DevOps Pools
  # does not provide macOS images.
  macImage: 'macOS-15'
  # Two pool profiles are defined so stages can be routed independently and the
  # netstandard Managed DevOps Pool and the Microsoft-hosted agents share the
  # workload of a single run (see the per-stage mapping below).  Each profile is
  # a (poolName, windowsImage, linuxImage) triple; poolName='' selects hosted
  # agents (vmImage), otherwise the named Managed DevOps Pool is used with an
  # ImageOverride demand per OS.  See
  # https://learn.microsoft.com/azure/devops/managed-devops-pools/configure-images#use-demands-to-specify-an-image
  #
  # poolMode collapses the two profiles for the all-managed / all-hosted
  # overrides; 'mixed' (default) keeps them distinct so both pools run in
  # parallel.  Stages reference mgd*/host* only, so no per-stage conditionals
  # are needed.
  ${{ if eq(parameters.poolMode, 'hosted') }}:
    mgdPoolName: ''
    mgdWindowsImage: 'windows-2025-vs2026'
    mgdLinuxImage: 'ubuntu-24.04'
    hostPoolName: ''
    hostWindowsImage: 'windows-2025-vs2026'
    hostLinuxImage: 'ubuntu-24.04'
  ${{ elseif eq(parameters.poolMode, 'managed') }}:
    mgdPoolName: 'netstandard'
    mgdWindowsImage: 'windows-2022-g2'
    mgdLinuxImage: 'ubuntu-22.04-g2'
    hostPoolName: 'netstandard'
    hostWindowsImage: 'windows-2022-g2'
    hostLinuxImage: 'ubuntu-22.04-g2'
  ${{ else }}:
    mgdPoolName: 'netstandard'
    mgdWindowsImage: 'windows-2022-g2'
    mgdLinuxImage: 'ubuntu-22.04-g2'
    hostPoolName: ''
    hostWindowsImage: 'windows-2025-vs2026'
    hostLinuxImage: 'ubuntu-24.04'

stages:
- stage: build
  dependsOn: []
  displayName: 'Build'
  jobs:
  - template: .azurepipelines/sln.yml
    parameters:
      poolImage: ${{ variables.hostWindowsImage }}
      poolName: ${{ variables.hostPoolName }}
      jobnamesuffix: win2025
      # Every build discovers every *.slnx.  The TFM fan-out differs by run
      # type: master/scheduled/manual builds cover all supported TFMs here,
      # while PR builds are narrowed so the managed pool is not swamped.
      solutions: ''
      ${{ if ne(variables.FullBuild, 'False') }}:
        tfms: 'net472,net48,netstandard2.0,netstandard2.1,net8.0,net9.0,net10.0'
      ${{ elseif eq(parameters.ciBuildBackend, 'ado') }}:
        # ADO now owns the all-TFM PR build that GitHub Actions used to run, so
        # a PR has to cover all seven TFMs.  Windows takes the .NET Framework
        # targets and the Linux leg below takes the modern ones - the same split
        # the build-all-tfm-windows / build-all-tfm-linux jobs used - which
        # keeps full coverage without fanning every TFM across both pools.
        tfms: 'net472,net48,netstandard2.0'
      ${{ else }}:
        # GitHub Actions owns the all-TFM build; this PR gate only needs the two
        # TFMs the contribution guide requires.
        tfms: 'net10.0,net48'
  - ${{ if eq(parameters.ciBuildBackend, 'ado') }}:
    # Replaces the GitHub Actions build-all-tfm-linux job: proves UA.slnx still
    # compiles on Linux for every Linux-capable TFM.  Release only, because this
    # leg exists to catch TFM/platform breaks rather than to exercise Debug.
    - template: .azurepipelines/sln.yml
      parameters:
        poolImage: ${{ variables.mgdLinuxImage }}
        poolName: ${{ variables.mgdPoolName }}
        jobnamesuffix: linuxalltfm
        solutions: 'UA.slnx'
        configurations: 'Release'
        tfms: 'netstandard2.1,net8.0,net9.0,net10.0'
- stage: testfastpr
  dependsOn: []
  displayName: 'Fast PR test'
  jobs:
  - template: .azurepipelines/test.yml
    parameters:
      configuration: Release
      framework: net48
      agents: '@{ windows = "${{ variables.mgdWindowsImage }}" }'
      jobnamesuffix: net48
      poolName: ${{ variables.mgdPoolName }}
      windowsImage: ${{ variables.mgdWindowsImage }}
      coveragePoolName: ${{ variables.hostPoolName }}
      coverageImage: ${{ variables.hostLinuxImage }}
  - template: .azurepipelines/test.yml
    parameters:
      configuration: Release
      framework: net10.0
      # When ADO owns the matrix this leg also covers Linux, replacing the
      # GitHub Actions build-and-test job that ran every test project on
      # ubuntu.  With ciBuildBackend=actions it stays Windows-only, exactly as
      # before, because GitHub Actions is still providing the Linux coverage.
      ${{ if eq(parameters.ciBuildBackend, 'ado') }}:
        agents: '@{ windows = "${{ variables.mgdWindowsImage }}"; linux = "${{ variables.mgdLinuxImage }}" }'
      ${{ else }}:
        agents: '@{ windows = "${{ variables.mgdWindowsImage }}" }'
      jobnamesuffix: net100
      customtestarget: net10.0
      poolName: ${{ variables.mgdPoolName }}
      windowsImage: ${{ variables.mgdWindowsImage }}
      coveragePoolName: ${{ variables.hostPoolName }}
      coverageImage: ${{ variables.hostLinuxImage }}
      # The reference leg: net10.0 Release is the configuration the thresholds in
      # coverage-thresholds.json are calibrated against, so this is the only one
      # whose coverage gate blocks, and the only one that publishes the merged
      # report to the build summary and to Codacy.
      enforceCoverage: true
      publishCoverage: true
  - template: .azurepipelines/test.yml
    parameters:
      configuration: Release
      framework: net10.0
      agents: '@{ mac = "${{ variables.macImage }}" }'
      jobnamesuffix: net100mac
      customtestarget: net10.0
      hosted: true
      poolName: ${{ variables.mgdPoolName }}
      windowsImage: ${{ variables.mgdWindowsImage }}
      coveragePoolName: ${{ variables.hostPoolName }}
      coverageImage: ${{ variables.hostLinuxImage }}
      # macOS runs only on Schedule/Manual (nightly + on-demand), not on
      # PR or master push, to keep the PR gate fast and Windows-focused.
      # Passed bare: test.yml wraps it in succeeded() for the test jobs and in
      # not(canceled()) for the coverage gate, which has to report a failure
      # rather than skip when a test job failed.
      condition: ne(variables.ScheduledBuild, 'False')
- stage: testaot
  dependsOn: []
  displayName: 'Test Native AoT'
  # Native AoT is Schedule/Manual-only when GitHub Actions still runs its own
  # AoT job.  Once ADO owns the matrix this is the only place AoT runs, so it
  # has to gate pull requests too.
  condition: and(succeeded(), or(ne(variables.ScheduledBuild, 'False'), ne(variables.AdoOwnsMatrix, 'False')))
  jobs:
  - template: .azurepipelines/test-aot.yml
    parameters:
      configuration: Release
      agents: '@{ windows = "${{ variables.mgdWindowsImage }}"; linux="${{ variables.mgdLinuxImage }}"}'
      jobnamesuffix: net100aot
      poolName: ${{ variables.mgdPoolName }}
      windowsImage: ${{ variables.mgdWindowsImage }}
- stage: testdebug
  dependsOn: [build]
  displayName: 'Test Core and SDK Debug'
  condition: and(succeeded(), ne(variables.ScheduledBuild, 'False'))
  jobs:
  - template: .azurepipelines/test.yml
    parameters:
      framework: net10.0
      configuration: Debug
      jobnamesuffix: net100debug
      poolName: ${{ variables.hostPoolName }}
      windowsImage: ${{ variables.hostWindowsImage }}
      coveragePoolName: ${{ variables.hostPoolName }}
      coverageImage: ${{ variables.hostLinuxImage }}
      agents: '@{ windows = "${{ variables.hostWindowsImage }}"; linux = "${{ variables.hostLinuxImage }}" }'
  - template: .azurepipelines/test.yml
    parameters:
      framework: net10.0
      configuration: Debug
      jobnamesuffix: net100debugmac
      agents: '@{ mac = "${{ variables.macImage }}" }'
      hosted: true
      poolName: ${{ variables.hostPoolName }}
      windowsImage: ${{ variables.hostWindowsImage }}
      coveragePoolName: ${{ variables.hostPoolName }}
      coverageImage: ${{ variables.hostLinuxImage }}
- stage: testnet90
  dependsOn: [build]
  displayName: 'Test .NET 9.0'
  condition: and(succeeded(), ne(variables.ScheduledBuild, 'False'))
  jobs:
  - template: .azurepipelines/test.yml
    parameters:
      framework: net9.0
      configuration: Release
      jobnamesuffix: net90
      poolName: ${{ variables.mgdPoolName }}
      windowsImage: ${{ variables.mgdWindowsImage }}
      coveragePoolName: ${{ variables.hostPoolName }}
      coverageImage: ${{ variables.hostLinuxImage }}
      agents: '@{ windows = "${{ variables.mgdWindowsImage }}"; linux = "${{ variables.mgdLinuxImage }}" }'
  - template: .azurepipelines/test.yml
    parameters:
      framework: net9.0
      configuration: Release
      jobnamesuffix: net90mac
      agents: '@{ mac = "${{ variables.macImage }}" }'
      hosted: true
      poolName: ${{ variables.mgdPoolName }}
      windowsImage: ${{ variables.mgdWindowsImage }}
      coveragePoolName: ${{ variables.hostPoolName }}
      coverageImage: ${{ variables.hostLinuxImage }}
- stage: testnet80
  dependsOn: [build]
  displayName: 'Test .NET 8.0'
  condition: and(succeeded(), ne(variables.ScheduledBuild, 'False'))
  jobs:
  - template: .azurepipelines/test.yml
    parameters:
      framework: net8.0
      configuration: Release
      jobnamesuffix: net80
      poolName: ${{ variables.hostPoolName }}
      windowsImage: ${{ variables.hostWindowsImage }}
      coveragePoolName: ${{ variables.hostPoolName }}
      coverageImage: ${{ variables.hostLinuxImage }}
      agents: '@{ windows = "${{ variables.hostWindowsImage }}"; linux = "${{ variables.hostLinuxImage }}" }'
  - template: .azurepipelines/test.yml
    parameters:
      framework: net8.0
      configuration: Release
      jobnamesuffix: net80mac
      agents: '@{ mac = "${{ variables.macImage }}" }'
      hosted: true
      poolName: ${{ variables.hostPoolName }}
      windowsImage: ${{ variables.hostWindowsImage }}
      coveragePoolName: ${{ variables.hostPoolName }}
      coverageImage: ${{ variables.hostLinuxImage }}
- stage: testnet472
  dependsOn: [build]
  displayName: 'Test .NET 4.7.2'
  condition: and(succeeded(), ne(variables.ScheduledBuild, 'False'))
  jobs:
  - template: .azurepipelines/test.yml
    parameters:
      framework: net472
      configuration: Release
      jobnamesuffix: net472
      agents: '@{ windows = "${{ variables.hostWindowsImage }}" }'
      customtestarget: net472
      poolName: ${{ variables.hostPoolName }}
      windowsImage: ${{ variables.hostWindowsImage }}
      coveragePoolName: ${{ variables.hostPoolName }}
      coverageImage: ${{ variables.hostLinuxImage }}
- stage: testnetstandard20
  dependsOn: [build]
  displayName: 'Test .NETStandard 2.0'
  condition: and(succeeded(), ne(variables.ScheduledBuild, 'False'))
  jobs:
  - template: .azurepipelines/test.yml
    parameters:
      framework: net48
      configuration: Release
      jobnamesuffix: netstandard20
      agents: '@{ windows = "${{ variables.mgdWindowsImage }}"}'
      customtestarget: netstandard2.0
      poolName: ${{ variables.mgdPoolName }}
      windowsImage: ${{ variables.mgdWindowsImage }}
      coveragePoolName: ${{ variables.hostPoolName }}
      coverageImage: ${{ variables.hostLinuxImage }}
- stage: testnetstandard21
  dependsOn: [build]
  displayName: 'Test .NETStandard 2.1'
  condition: and(succeeded(), ne(variables.ScheduledBuild, 'False'))
  jobs:
  - template: .azurepipelines/test.yml
    parameters:
      framework: net8.0
      configuration: Release
      jobnamesuffix: netstandard21
      customtestarget: netstandard2.1
      poolName: ${{ variables.mgdPoolName }}
      windowsImage: ${{ variables.mgdWindowsImage }}
      coveragePoolName: ${{ variables.hostPoolName }}
      coverageImage: ${{ variables.hostLinuxImage }}
      agents: '@{ windows = "${{ variables.mgdWindowsImage }}"; linux = "${{ variables.mgdLinuxImage }}" }'
  - template: .azurepipelines/test.yml
    parameters:
      framework: net8.0
      configuration: Release
      jobnamesuffix: netstandard21mac
      customtestarget: netstandard2.1
      agents: '@{ mac = "${{ variables.macImage }}" }'
      hosted: true
      poolName: ${{ variables.mgdPoolName }}
      windowsImage: ${{ variables.mgdWindowsImage }}
      coveragePoolName: ${{ variables.hostPoolName }}
      coverageImage: ${{ variables.hostLinuxImage }}
- stage: testnightly
  dependsOn: [build]
  displayName: 'Test long-running tiers'
  # Tiers that the fast legs deliberately filter out and that used to be dragged
  # in only by the combined coverage job that re-ran the whole suite.  That job
  # is gone, so they get their own Schedule/Manual stage here.  The stress tier
  # keeps running from .github/workflows/stress-test.yml.
  condition: and(succeeded(), ne(variables.ScheduledBuild, 'False'))
  jobs:
  # Mainline projects with no category filter, so the LongRunning tier (today
  # Opc.Ua.Subscriptions.Tests) is exercised.  A single Linux leg is enough -
  # the cross-platform matrix is already covered by the filtered stages.
  - template: .azurepipelines/test.yml
    parameters:
      framework: net10.0
      configuration: Release
      jobnamesuffix: net100longrunning
      customtestarget: net10.0
      testfilter: ''
      hangtimeout: '30m'
      # A tier, not a (framework, configuration) leg: its numbers cannot be
      # merged into the pull-request gate, so skip the coverage job here.
      coverage: false
      agents: '@{ linux = "${{ variables.hostLinuxImage }}" }'
      poolName: ${{ variables.hostPoolName }}
      windowsImage: ${{ variables.hostWindowsImage }}
  # Durable-subscription tier, kept out of the mainline matrix by #3810.
  - template: .azurepipelines/test.yml
    parameters:
      framework: net10.0
      configuration: Release
      jobnamesuffix: net100durable
      customtestarget: net10.0
      projectfilename: 'Opc.Ua.Subscriptions.Durable.Tests.csproj'
      excludeprojects: ''
      testfilter: ''
      hangtimeout: '30m'
      coverage: false
      agents: '@{ windows = "${{ variables.hostWindowsImage }}"; linux = "${{ variables.hostLinuxImage }}" }'
      poolName: ${{ variables.hostPoolName }}
      windowsImage: ${{ variables.hostWindowsImage }}
